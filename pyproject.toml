[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "midicoder"
version = "1.0.0"
description = "Midicoder CE"
readme = "README.md"
requires-python = "==3.12.*"
authors = [{ name = "Midicoder Team" }]
license = { file = "LICENSE" }
dependencies = [
  "typer>=0.9.0",
  "pydantic>=2.0.0",
  "ruamel.yaml>=0.17.0",
  "rich>=13.0.0",
  "questionary>=2.0.0",
  "tree_sitter>=0.21.3",
  "tree_sitter_languages>=1.10.2",
  "code-review-graph>=2.3.2",
  "openai>=1.0.0",
  "tiktoken>=0.7.0",
]

[project.scripts]
midicoder = "midicoder.cli:app"

[project.entry-points."python.command"]
midicoder = "midicoder.__main__:main"

[tool.setuptools]
packages = ["midicoder"]

[tool.black]
target-version = ["py311"]

[tool.pytest.ini_options]
testpaths = [
    "midicoder/tests",
    "midicoder/emitters/core",
]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--import-mode=importlib",
    "-q",
]
asyncio_mode = "auto"
