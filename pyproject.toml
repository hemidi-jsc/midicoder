[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "midicoder"
version = "0.1.0"
description = "Midicoder CLI"
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Midicoder" }]
license = { file = "LICENSE" }
dependencies = [
  "typer>=0.9.0",
  "pydantic>=2.0.0",
  "ruamel.yaml>=0.17.0",
  "rich>=13.0.0",
  "questionary>=2.0.0",
  "tree_sitter>=0.21.3",
  "tree_sitter_languages>=1.10.2",
]

[project.scripts]
midicoder = "midicoder.cli:app"

[project.entry-points."python.command"]
midicoder = "midicoder.__main__:main"

[tool.setuptools]
packages = ["midicoder"]

[tool.black]
target-version = ["py311"]