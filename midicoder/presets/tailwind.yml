# ============================================================================
# Tailwind CSS Preset v2 — Component behavior + tokens
# ============================================================================

DataTable:
  behavior:
    sortable: true
    paginated: true
    page_size: 20
    selectable: false
    filterable: true
    searchable: true
    editable: false
    virtual_scroll: false
