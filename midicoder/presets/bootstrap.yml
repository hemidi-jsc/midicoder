    show_cancel: true
    default_width: "md"
  bootstrap:
    overlay: "modal fade"
    container: "modal-dialog"
    header: "modal-header"
    body: "modal-body"
    footer: "modal-footer"
    sm: "modal-dialog modal-sm"
    md: "modal-dialog"
    lg: "modal-dialog modal-lg"
    xl: "modal-dialog modal-xl"
    full_screen: "modal-dialog modal-fullscreen"

ErrorBoundary:
