# ============================================================================
# Bootstrap 5 Preset v2 — Component behavior + tokens
# ============================================================================

DataTable:
  behavior:
    sortable: true
    paginated: true
    page_size: 20
    selectable: false
    filterable: true
    searchable: true
    editable: false
    virtual_scroll: false
  bootstrap:
    container: "table-responsive"
    table: "table table-hover table-striped"
    header: "thead-light"
    header_cell: "th"
    body: "tbody"
    row: "tr"
    cell: "td py-3"
    pagination: "d-flex justify-content-between align-items-center px-3 py-2"
    empty: "text-center py-5 text-muted"

Card:
  behavior: {}
  bootstrap:
    container: "card shadow-sm"
    header: "card-header"
    body: "card-body"
    footer: "card-footer bg-light"
    title: "card-title"
    text: "card-text"

CardList:
  behavior: {}
  bootstrap:
    container: "row g-3"
    item: "col-12 col-md-6 col-lg-4"

Avatar:
  behavior: {}
  bootstrap:
    container: "d-flex align-items-center gap-2"
    img: "rounded-circle object-fit-cover"
    fallback: "rounded-circle d-flex align-items-center justify-content font-medium bg-primary-light text-primary"
    name: "small fw-medium"
    xs: "w-24 h-24"
    sm: "w-32 h-32"
    md: "w-40 h-40"
    lg: "w-48 h-48"

Badge:
  behavior: {}
  bootstrap:
    container: "badge rounded-pill"
    info: "bg-info text-bg-info"
    success: "bg-success text-bg-success"
    warning: "bg-warning text-bg-warning text-dark"
    error: "bg-danger text-bg-danger"
    neutral: "bg-secondary text-bg-secondary"
    dot: "badge rounded-circle"

Chip:
  behavior: {}
  bootstrap:
    container: "badge rounded-pill d-inline-flex align-items-center gap-1 px-3 py-1"
    removable: "text-nowrap"
    icon: "me-1"
    outline: "badge bg-light text-dark border"
    filled: "badge bg-primary text-white"

DescriptionList:
  behavior: {}
  bootstrap:
    container: "row row-cols-auto g-3 border-top"
    term: "col dt-text fw-medium text-muted"
    detail: "col dt-text"
    horizontal: "row row-cols-1 row-cols-md-2"

List:
  behavior: {}
  bootstrap:
    container: "list-group"
    item: "list-group-item"
    dense: "list-group-item py-2 px-3"
    flush: "list-group-flush"
    horizontal: "list-group-horizontal"

Popover:
  behavior: {}
  bootstrap:
    trigger: "data-bs-toggle='popover'"
    content: "popover"
    header: "popover-header"
    body: "popover-body"

Timeline:
  behavior: {}
  bootstrap:
    container: "timeline"
    item: "timeline-item position-relative ps-4 pb-4 border-start border-2"
    dot: "timeline-dot position-absolute start-0 translate-middle rounded-circle bg-primary"
    content: "timeline-content"
    label: "small text-muted"

Tooltip:
  behavior: {}
  bootstrap:
    trigger: "data-bs-toggle='tooltip'"
    placement: "data-bs-placement='top'"
    content: "tooltip"

Autocomplete:
  behavior:
    filterable: true
    searchable: true
  bootstrap:
    container: "position-relative"
    input: "form-control"
    dropdown: "dropdown-menu w-100 show"
    option: "dropdown-item"
    option_selected: "dropdown-item active"

Checkbox:
  behavior: {}
  bootstrap:
    input: "form-check-input"
    label: "form-check-label"
    switch: "form-switch"
    inline: "form-check form-check-inline"

ColorPicker:
  behavior: {}
  bootstrap:
    container: "d-flex align-items-center gap-2"
    input: "form-control form-control-color w-auto"
    swatch: "rounded border"

DatePicker:
  behavior: {}
  bootstrap:
    container: "input-group"
    input: "form-control"
    addon: "input-group-text"
    calendar: "datepicker-dropdown"
    day: "day"
    day_selected: "active"
    day_disabled: "disabled"

DateTimePicker:
  behavior: {}
  bootstrap:
    container: "input-group"
    input: "form-control"
    addon: "input-group-text"

FileUpload:
  behavior: {}
  bootstrap:
    container: "border-2 border-dashed rounded-3 p-4 text-center"
    drop: "border-primary bg-primary-subtle"
    input: "form-control form-control-sm"
    button: "btn btn-primary btn-sm"
    file_list: "list-group mt-3"
    file_item: "list-group-item d-flex justify-content-between"

FormBuilder:
  behavior:
    form_layout: "single_column"
    validation_mode: "on_submit"
    conditional_enabled: false
  bootstrap:
    form: "row g-3"
    field: "col-12"
    two_column: "col-md-6"
    error_summary: "alert alert-danger"
    wizard_step: "card border-bottom"

FormField:
  behavior:
    conditional_enabled: false
  bootstrap:
    container: "mb-3"
    label: "form-label"
    hint: "form-text"
    error: "invalid-feedback"

Input:
  behavior:
    conditional_enabled: false
  bootstrap:
    container: "mb-3"
    input: "form-control"
    label: "form-label"
    error: "is-invalid"
    disabled: "form-control-plaintext"
    readonly: "form-control-plaintext"
    placeholder: "placeholder={hint}"
    sm: "form-control-sm"
    lg: "form-control-lg"

Radio:
  behavior: {}
  bootstrap:
    input: "form-check-input"
    label: "form-check-label"
    group: "d-flex flex-column gap-2"
    inline: "form-check form-check-inline"

RichTextEditor:
  behavior: {}
  bootstrap:
    container: "card"
    toolbar: "card-header d-flex gap-1"
    button: "btn btn-sm btn-outline-secondary"
    content: "card-body min-vh-25"

Select:
  behavior: {}
  bootstrap:
    container: "mb-3"
    select: "form-select"
    label: "form-label"
    multiple: "form-select multiple"
    sm: "form-select-sm"
    lg: "form-select-lg"

Slider:
  behavior: {}
  bootstrap:
    input: "form-range"
    label: "form-label"
    value: "badge bg-primary"

Switch:
  behavior: {}
  bootstrap:
