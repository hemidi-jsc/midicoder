    label: "form-check-label"

Textarea:
  behavior: {}
  bootstrap:
    container: "mb-3"
    textarea: "form-control"
    label: "form-label"
    error: "is-invalid"
    rows: "rows={4}"

Alert:
  behavior: {}
  bootstrap:
    container: "alert"
    info: "alert-info"
    success: "alert-success"
    warning: "alert-warning"
    error: "alert-danger"
