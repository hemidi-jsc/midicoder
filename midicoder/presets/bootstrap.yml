    body: "modal-body"
    footer: "modal-footer justify-content-end"
    sm: "modal-dialog modal-sm"
    md: "modal-dialog"
    lg: "modal-dialog modal-lg"
    xl: "modal-dialog modal-xl"

ProgressBar:
  behavior: {}
  bootstrap:
