    container: "MuiContainer maxWidth={lg}"

PaymentHistory:
  behavior: {}
  material:
    container: "MuiContainer maxWidth={lg}"

PaymentDashboard:
  behavior: {}
  material:
    container: "MuiContainer maxWidth={lg}"

QuotaStatus:
  behavior: {}
  material:
    container: "MuiContainer maxWidth={xl}"

BulkJobDetails:
  behavior: {}
  material:
    container: "MuiContainer maxWidth={lg}"

RetentionPolicy:
  behavior: {}
  material:
    container: "MuiContainer maxWidth={lg}"

RetentionErasure:
