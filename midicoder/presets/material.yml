# ============================================================================
# Material-UI Preset v2 — Component behavior + tokens
# ============================================================================

DataTable:
  behavior:
    sortable: true
    paginated: true
    page_size: 20
    selectable: false
    filterable: true
    searchable: true
    editable: false
    virtual_scroll: false
  material:
    container: "MuiTableContainer"
    table: "MuiTable"
    header: "MuiTableHead"
    header_cell: "MuiTableCell-head"
    body: "MuiTableBody"
    row: "MuiTableRow hover"
    cell: "MuiTableCell-body"
    pagination: "MuiTablePagination"
    empty: "text-gray-500 text-center py-8"

Card:
  behavior: {}
  material:
    container: "MuiCard"
    header: "MuiCardHeader"
    body: "MuiCardContent"
    footer: "MuiCardActions"
    media: "MuiCardMedia"

CardList:
  behavior: {}
  material:
    container: "MuiGrid container spacing={2}"

Avatar:
  behavior: {}
  material:
    component: "MuiAvatar"
    xs: "size={24}"
    sm: "size={32}"
    md: "size={40}"
    lg: "size={56}"
    group: "MuiAvatarGroup"
    fallback: "MuiAvatar colors={{ default: 'default' }}"

Badge:
  behavior: {}
  material:
    component: "MuiBadge"
    dot: "badgeContent=·"
    info: "color={info}"
    success: "color={success}"
    warning: "color={warning}"
    error: "color={error}"
    max: 99

Chip:
  behavior: {}
  material:
    component: "MuiChip"
    outlined: "variant={outlined}"
    filled: "variant={filled}"
    deletable: "deletable onDelete={handleDelete}"
    avatar: "avatar={<Avatar />}"
    clickable: "onClick={handleClick}"
    color: "color={primary}"

DescriptionList:
  behavior: {}
  material:
    container: "MuiList"
    term: "MuiTypography variant={caption} color={text.secondary}"
    detail: "MuiTypography variant={body2}"

List:
  behavior: {}
  material:
    container: "MuiList dense={false}"
    item: "MuiListItem"
    dense: "dense={true}"
    divider: "divider"
    button: "button onClick={handleClick}"

Popover:
  behavior: {}
  material:
    component: "MuiPopover"
    paper: "MuiPaper elevation={2}"
    content: "padding={16}"

Timeline:
  behavior: {}
  material:
    container: "MuiTimeline"
    item: "MuiTimelineItem"
    dot: "MuiTimelineDot"
    content: "MuiTimelineContent"
    connector: "MuiTimelineConnector"

Tooltip:
  behavior: {}
  material:
    component: "MuiTooltip"
    title: "title={tooltipText}"
    placement: "placement={top}"
    arrow: "arrow"
    enter_delay: 300
    leave_delay: 100

Autocomplete:
  behavior:
    filterable: true
    searchable: true
  material:
    component: "MuiAutocomplete"
    free_text: "freeSolo"
    multiple: "multiple chips"
    dropdown: "MuiAutocompleteOptions"
    option: "MuiAutocompleteOption"

Checkbox:
  behavior: {}
  material:
    component: "MuiCheckbox"
    checked: "checked={value}"
    indeterminate: "indeterminate"
    color: "color={primary}"
    disabled: "disabled"

ColorPicker:
  behavior: {}
  material:
    component: "MuiColorPicker"
    format: "format={hex}"
    alpha: "alpha"
    preset_colors: "presetColors={colors}"

DatePicker:
  behavior: {}
  material:
    component: "MuiDatePicker"
    format: "format={MM/DD/YYYY}"
    views: "views={['year', 'month', 'day']}"
    min_date: "minDate={new Date()}"
    max_date: "maxDate={futureDate}"

DateTimePicker:
  behavior: {}
  material:
    component: "MuiDateTimePicker"
    format: "format={MM/DD/YYYY HH:mm}"
    views: "views={['year', 'month', 'day', 'hours', 'minutes']}"
    ampm: "ampm={false}"

FileUpload:
  behavior: {}
  material:
    container: "MuiBox border={2} borderStyle={dashed} borderRadius={2}"
    button: "MuiButton variant={contained}"
    list: "MuiList"
    item: "MuiListItemSecondaryAction"
    dropzone: "onDragOver={handleDragOver} onDrop={handleDrop}"

FormBuilder:
  behavior:
    form_layout: "single_column"
    validation_mode: "on_submit"
    conditional_enabled: false
  material:
    form: "MuiForm layout={vertical}"
    field: "MuiFormControl fullWidth"
    two_column: "MuiGrid container spacing={2}"
    error_summary: "MuiAlert severity={error}"
    wizard: "MuiStepper"

FormField:
  behavior:
    conditional_enabled: false
  material:
    container: "MuiFormControl fullWidth"
    label: "MuiFormLabel"
    hint: "MuiFormHelperText"
    error: "error={true} helperText={errorMessage}"

Input:
  behavior:
    conditional_enabled: false
  material:
    component: "MuiTextField"
    variant: "variant={outlined}"
    label: "label={fieldName}"
    error: "error={true} helperText={errorMessage}"
    disabled: "disabled={true}"
    multiline: "multiline maxRows={4}"
    helper: "helperText={hintText}"

Radio:
  behavior: {}
  material:
    component: "MuiRadio"
    group: "MuiRadioGroup"
    label: "MuiFormControlLabel label={optionLabel}"
    color: "color={primary}"

RichTextEditor:
  behavior: {}
  material:
    container: "MuiPaper elevation={1}"
    toolbar: "MuiToolbar variant={dense}"
    button: "MuiIconButton size={small}"
    content: "contentEditable={true} minHeight={200}"

Select:
  behavior: {}
  material:
    component: "MuiSelect"
    native: "native={false}"
    multiple: "multiple"
    render_value: "renderValue={(selected) => selected.join(', ')}"
    menu: "MenuProps={anchorOrigin}"

Slider:
  behavior: {}
  material:
    component: "MuiSlider"
    marks: "marks"
    value_label: "valueLabelDisplay={true}"
    min: "min={0}"
    max: "max={100}"
    step: "step={1}"

Switch:
  behavior: {}
  material:
    component: "MuiSwitch"
    checked: "checked={value}"
    color: "color={primary}"
    disabled: "disabled"
    size: "size={medium}"

Textarea:
  behavior: {}
  material:
    component: "MuiTextField"
    multiline: "multiline rows={4}"
    max_rows: "maxRows={8}"
    variant: "variant={outlined}"
    label: "label={fieldName}"
    error: "error={true} helperText={errorMessage}"

Alert:
  behavior: {}
  material:
    component: "MuiAlert"
    info: "severity={info}"
    success: "severity={success}"
    warning: "severity={warning}"
    error: "severity={error}"
    dismissible: "action={<IconButton onClick={onClose} />}"

CircularProgress:
  behavior: {}
  material:
    component: "MuiCircularProgress"
    size: "size={40}"
    indeterminate: "indeterminate"
    determined: "value={percentage}"
    color: "color={primary}"

Dialog:
  behavior:
    close_on_backdrop: true
    show_cancel: true
    default_width: "md"
  material:
    component: "MuiDialog"
    full_screen: "fullScreen"
    scroll: "scroll={body}"
    paper: "PaperProps={{ component: 'div', role: 'dialog' }}"
    title: "MuiDialogTitle"
    content: "MuiDialogContent dividers"
    actions: "MuiDialogActions"
    sm: "maxWidth={xs}"
    md: "maxWidth={sm}"
    lg: "maxWidth={md}"
    xl: "maxWidth={lg}"

ErrorBoundary:
  behavior: {}
  material:
    container: "MuiBox display={flex} flexDirection={column} alignItems={center} justifyContent={center} minHeight={200}"
    icon: "MuiIcon color={error} fontSize={large}"
    title: "MuiTypography variant={h6}"
    message: "MuiTypography variant={body2} color={text.secondary}"
    retry: "MuiButton variant={contained} color={primary} sx={{ mt: 2 }}"

LinearProgress:
  behavior: {}
  material:
    component: "MuiLinearProgress"
    indeterminate: "indeterminate"
    determined: "value={percentage}"
    color: "color={primary}"
    variant: "variant={determinate}"

Modal:
  behavior:
    close_on_backdrop: true
    show_cancel: true
    default_width: "lg"
  material:
    component: "MuiDialog"
    overlay: "BackdropProps={{ timeout: 200 }}"
    container: "MuiDialogPaper"
    header: "MuiDialogTitle"
    body: "MuiDialogContent"
    footer: "MuiDialogActions"
    sm: "maxWidth={xs}"
    md: "maxWidth={sm}"
    lg: "maxWidth={md}"
    xl: "maxWidth={lg}"

ProgressBar:
  behavior: {}
  material:
    container: "MuiLinearProgress variant={determinate} value={percentage}"
    primary: "color={primary}"
    success: "color={success}"
    error: "color={error}"
    label: "MuiTypography variant={caption}"

Skeleton:
  behavior: {}
  material:
    component: "MuiSkeleton"
    animation: "animation={wave}"
    variant: "variant={rectangular}"
    text: "variant={text}"
    circle: "variant={circular}"
    rounded: "variant={rounded}"

Snackbar:
  behavior: {}
  material:
    component: "MuiSnackbar"
    anchor: "anchorOrigin={{ vertical: 'bottom', horizontal: 'right' }}"
    auto_hide: "autoHideDuration={6000}"
    message: "MuiSnackbarContent"
    action: "action={<MuiButton size={small} onClick={close} />}"

Spinner:
  behavior: {}
  material:
    component: "MuiCircularProgress"
    sm: "size={16}"
    md: "size={40}"
    lg: "size={64}"
    color: "color={primary}"

Toast:
  behavior: {}
  material:
    component: "MuiSnackbar"
    anchor: "anchorOrigin={{ vertical: 'top', horizontal: 'right' }}"
    success: "MuiAlert severity={success}"
    error: "MuiAlert severity={error}"
    info: "MuiAlert severity={info}"
    warning: "MuiAlert severity={warning}"

Box:
  behavior: {}
  material:
    component: "MuiBox"
    padding: "p={2}"
    margin: "m={2}"
    display: "display={flex}"
    centered: "display={flex} alignItems={center} justifyContent={center}"

Column:
  behavior: {}
  material:
    component: "MuiBox"
    flex: "display={flex} flexDirection={column}"
    gap: "gap={2}"
    center: "alignItems={center}"

Container:
  behavior: {}
  material:
    component: "MuiContainer"
    xs: "maxWidth={xs}"
    sm: "maxWidth={sm}"
    md: "maxWidth={md}"
    lg: "maxWidth={lg}"
    xl: "maxWidth={xl}"
    fluid: "maxWidth={false}"

Divider:
  behavior: {}
  material:
    component: "MuiDivider"
    light: "light"
    inset: "variant={inset}"
    middle: "variant={middle}"
    vertical: "orientation={vertical}"

Flex:
  behavior: {}
  material:
    component: "MuiBox"
    row: "display={flex} flexDirection={row}"
    col: "display={flex} flexDirection={column}"
    wrap: "flexWrap={wrap}"
    center: "display={flex} alignItems={center} justifyContent={center}"
    between: "display={flex} justifyContent={space-between}"
    gap: "gap={2}"

Grid:
  behavior: {}
  material:
    component: "MuiGrid"
    container: "container spacing={2}"
    item_xs: "item xs={12}"
    item_sm: "item sm={6}"
    item_md: "item md={4}"
    item_lg: "item lg={3}"

Row:
  behavior: {}
  material:
    component: "MuiBox"
    flex: "display={flex} flexDirection={row}"
    gap: "gap={2}"
    center: "alignItems={center}"
    between: "justifyContent={space-between}"

Spacer:
  behavior: {}
  material:
    xs: "height={4}"
    sm: "height={8}"
    md: "height={16}"
    lg: "height={32}"
    xl: "height={64}"

Breadcrumbs:
  behavior: {}
  material:
    component: "MuiBreadcrumbs"
    separator: "separator={'/'}"
    link: "MuiLink underline={hover}"
    current: "MuiTypography color={text.primary}"
    max_items: "maxItems={5}"

Menu:
  behavior: {}
  material:
    component: "MuiMenu"
    anchor: "anchorEl={anchorRef}"
    paper: "MuiPaper elevation={8}"
    item: "MuiMenuItem"
    divider: "MuiDivider"
    header: "MuiMenuList subheader"

Navbar:
  behavior: {}
  material:
    component: "MuiAppBar position={sticky}"
    toolbar: "MuiToolbar"
    brand: "MuiTypography variant={h6} component={div}"
    nav: "MuiBox display={flex} gap={2}"
    item: "MuiButton color={inherit}"
    mobile: "MuiBox display={{ xs: 'block', lg: 'none' }}"

Pagination:
  behavior:
    paginated: true
    page_size: 20
  material:
    component: "MuiPagination"
    variant: "variant={outlined}"
    color: "color={primary}"
    shape: "shape={rounded}"
    count: "count={totalPages}"
    sibling_count: "siblingCount={2}"
    boundary_count: "boundaryCount={1}"
    size: "size={medium}"

Sidebar:
  behavior: {}
  material:
    component: "MuiDrawer"
    permanent: "variant={permanent}"
    temporary: "variant={temporary}"
    mini: "variant={permanent} sx={{ width: 72, flexShrink: 0 }}"
    width: "width={256}"
    item: "MuiListItemButton"
    item_active: "selected={true}"
    group: "MuiListSubheader"

Stepper:
  behavior: {}
  material:
    component: "MuiStepper"
    horizontal: "orientation={horizontal}"
    vertical: "orientation={vertical}"
    step: "MuiStep"
    step_label: "MuiStepLabel"
    step_content: "MuiStepContent"
    completed: "completed"
    active: "active"

Tabs:
  behavior: {}
  material:
    component: "MuiTabs"
    value: "value={tabValue}"
    centered: "centered"
    full_width: "variant={fullWidth}"
    scrollable: "variant={scrollable}"
    tab: "MuiTab"
    panel: "MuiTabPanel"

TreeView:
  behavior: {}
  material:
    component: "MuiTreeView"
    node: "MuiTreeItem"
    expand_all: "defaultExpandIcon={<ExpandMoreIcon />}"
    collapse_all: "defaultCollapseIcon={<ChevronRightIcon />}"
    selected: "selected={true}"
    expanded: "expanded={true}"

Accordion:
  behavior: {}
  material:
    component: "MuiAccordion"
    header: "MuiAccordionSummary"
    body: "MuiAccordionDetails"
    expanded: "expanded={true}"
    disabled: "disabled"
    square: "square"
    transition: "TransitionComponent={Collapse}"

Drawer:
  behavior: {}
  material:
    component: "MuiDrawer"
    anchor: "anchor={right}"
    open: "open={isOpen}"
    modal: "ModalProps={{ keepMounted: true }}"
    paper: "PaperProps={{ sx: { width: 320 } }}"
    header: "MuiDialogTitle"
    body: "MuiBox p={2}"

ExpansionPanel:
  behavior: {}
  material:
    component: "MuiAccordion"
    header: "MuiAccordionSummary expandIcon={<ExpandMoreIcon />}"
    body: "MuiAccordionDetails"
    square: "square"
    disabled: "disabled"

BadgeButton:
  behavior: {}
  material:
    component: "MuiBadge"
    button: "MuiButton"
    badge: "badgeContent={count} color={error}"
    dot: "badgeContent=·"

Button:
  behavior: {}
  material:
    component: "MuiButton"
    primary: "variant={contained} color={primary}"
    secondary: "variant={contained} color={secondary}"
    danger: "variant={contained} color={error}"
    outlined: "variant={outlined}"
    text: "variant={text}"
    link: "variant={text} component={a}"
    sm: "size={small}"
    md: "size={medium}"
    lg: "size={large}"
    disabled: "disabled={true}"
    icon: "startIcon={<Icon />}"

IconButton:
  behavior: {}
  material:
    component: "MuiIconButton"
    sm: "size={small}"
    md: "size={medium}"
    lg: "size={large}"
    color: "color={inherit}"
    edge: "edge={end}"

Image:
  behavior: {}
  material:
    component: "img"
    contained: "MuiBox borderRadius={2} overflow={hidden}"
    media: "MuiCardMedia"
    fallback: "MuiSkeleton variant={rectangular}"
    responsive: "width={100%} height={auto}"

ThemeProvider:
  behavior:
    dark_mode: false
  material:
    component: "MuiThemeProvider"
    light: "theme={lightTheme}"
    dark: "theme={darkTheme}"
    palette: "theme.palette.mode = 'dark'"
    css_variables: "theme.palette.mode"

