    active_key: "activeKey={tabKey}"
    type_card: "type={card}"
    type_edit_card: "type={editable-card}"
    size: "size={middle}"
    centered: "centered"
    hide_add: "hideAdd"
    tab: "Tabs.TabPane tab={label} key={key}"
    destroy_inactive: "destroyInactiveTabPane"

TreeView:
  behavior: {}
  antd:
    component: "Tree"
    checked_keys: "checkedKeys={checkedKeys}"
    selected_keys: "selectedKeys={selectedKeys}"
    expanded_keys: "expandedKeys={expandedKeys}"
    tree_data: "treeData={treeData}"
