# Ant Design preset

react:
  Sidebar:
    width: 220px
    width_collapsed: 64px
    background: "#ffffff"
    border_right: "1px solid #f0f0f0"
    display: flex
    flex_direction: column
    position: fixed

  Navbar:
    height: 64px
    background: "#ffffff"
    position: sticky
    z_index: 1000

  Modal:
    width_sm: 400px
    width_md: 520px
    width_lg: 720px
    width_xl: 992px
    background: "#ffffff"
    border_radius: 8px
    z_index: 1000

  Dialog:
    width_sm: 416px
    width_md: 520px
    width_lg: 672px
    background: "#ffffff"
    border_radius: 8px
    z_index: 1000

  Card:
    background: "#ffffff"
    border_radius: 2px
    border: "1px solid #f0f0f0"
    padding: 24px
    overflow: hidden

  DataTable:
    background_header: "#fafafa"
    background_body: "#ffffff"
    background_hover: "#fafafa"
    border: "1px solid #f0f0f0"
    padding_cell: "16px"
    overflow_x: auto

  Button:
    padding_sm: "0 15px"
    padding_md: "0 15px"
    padding_lg: "0 15px"
    font_size_sm: 14px
    font_size_md: 14px
    font_size_lg: 16px
    font_weight: 400
    border_radius: 6px

  Input:
    width: "100%"
    padding: "4px 11px"
    border: "1px solid #d9d9d9"
    border_radius: 6px
    font_size: 14px

  Select:
    width: "100%"
    padding: "4px 11px"
    border: "1px solid #d9d9d9"
    border_radius: 6px
    font_size: 14px

  Badge:
    border_radius: 10px
    font_size: 14px
    padding: "0 7px"

  Avatar:
    size_xs: 16px
    size_sm: 24px
    size_md: 32px
    size_lg: 40px
    border_radius: "50%"
    background: "#8c8c8c"
    text_color: "#ffffff"

  Chip:
    border_radius: 2px
    padding: "0 8px"
    font_size: 14px

  Toast:
    position: fixed
    z_index: 1000
    min_width: 300px
    border_radius: 8px
    box_shadow: "0 3px 6px rgba(0,0,0,0.12)"
    padding: "8px 16px"

  Spinner:
    size: 20px
    border_width: 2px
    border_color_track: "rgba(0,0,0,0.05)"
    border_color_primary: "#1677ff"

  ProgressBar:
    height: 6px
    background_track: "#f5f5f5"
    background_primary: "#1890ff"
    background_success: "#52c41a"
    background_error: "#ff4d4f"
    border_radius: 100px

  Pagination:
    font_size: 14px
    padding_btn: "0 6px"
    border_radius: 6px

  Tabs:
    padding_tab: "12px 0"
    font_size: 14px
    font_weight: 400
    padding_content: 24px

  Accordion:
    border: "1px solid #d9d9d9"
    border_radius: 2px
    padding_header: "12px 16px"
    padding_body: "12px 16px"

  Alert:
    border_radius: 6px
    padding: "8px 15px"
    font_size: 14px

  Skeleton:
    background: "#f2f2f2"
    border_radius_rect: 2px
    default_height: 20px

  Breadcrumbs:
    font_size: 14px

  Drawer:
    width: 378px
    background: "#ffffff"
    z_index: 1000
    padding_body: 24px

  Dropdown:
    width: 180px
    background: "#ffffff"
    border_radius: 2px
    box_shadow: "0 3px 6px rgba(0,0,0,0.12)"
    z_index: 1000
    padding_item: "5px 12px"
    font_size_item: 14px

  Tooltip:
    background_dark: "rgba(0,0,0,0.75)"
    text_color_dark: "#ffffff"
    border_radius: 6px
    padding: "4px 8px"
    font_size: 14px
    z_index: 1000

  Container:
    max_width_xs: 576px
    max_width_sm: 768px
    max_width_md: 992px
    max_width_lg: 1200px
    max_width_xl: 1600px
    padding: "0 24px"

  FacetedSearch:
    sidebar_width: 240px
    card_min_width: 280px

  ProductList:
    sidebar_width: 260px
    container_max_width: 1200px

  ProductDetail:
    container_max_width: 1200px

  ConsentBanner:
    position: fixed
    bottom: 0
    z_index: 1000
    background: "#ffffff"

  ApprovalTimeline:
    container_max_width: 1200px

  BulkDashboard:
    container_max_width: 1400px

  RateLimitDashboard:
    container_max_width: 1400px

  TransactionDashboard:
    container_max_width: 1200px

  ChatWindow:
    container_max_width: 1200px

  WebhookDashboard:
    container_max_width: 1200px

  RetentionDashboard:
    container_max_width: 1200px

