# ============================================================================
# Ant Design Preset v2 — Component behavior + tokens
# ============================================================================

DataTable:
  behavior:
    sortable: true
    paginated: true
    page_size: 20
    selectable: false
    filterable: true
    searchable: true
    editable: false
    virtual_scroll: false
  antd:
    component: "Table"
    scroll: "scroll={{ x: true }}"
    size: "size={middle}"
    bordered: "bordered"
    pagination: "pagination={{ pageSize: 20, showSizeChanger: true }}"
    row_selection: "rowSelection={rowSelection}"
    empty: "locale={{ emptyText: 'No data' }}"
    header_cell: "className={ant-table-cell}"
    body_row: "className={ant-table-row}"
    cell: "className={ant-table-cell}"

Card:
  behavior: {}
  antd:
    component: "Card"
    bordered: "bordered"
    hoverable: "hoverable"
    header: "title={cardTitle}"
    body: "className={ant-card-body}"
    extra: "extra={<Space>actions</Space>}"
    loading: "loading={true}"

CardList:
  behavior: {}
  antd:
    component: "List"
    grid: "grid={{ gutter: 16, column: 3 }}"
    item_layout: "itemLayout='horizontal'"

Avatar:
  behavior: {}
  antd:
    component: "Avatar"
    size_xs: "size={16}"
    size_sm: "size={24}"
    size_md: "size={32}"
    size_lg: "size={40}"
    shape_circle: "shape='circle'"
    shape_square: "shape='square'"
    group: "Avatar.Group"
    icon: "icon={<UserOutlined />}"
    src: "src={imageUrl}"

Badge:
  behavior: {}
  antd:
    component: "Badge"
    count: "count={5}"
    dot: "dot"
    info: "color='blue'"
    success: "color='green'"
    warning: "color='gold'"
    error: "color='red'"
    max: "max={99}"
    ribbon: "ribbon={{ text: 'NEW', color: 'blue' }}"

Chip:
  behavior: {}
  antd:
    component: "Tag"
    closable: "closable"
    icon: "icon={<CheckOutlined />}"
    color: "color='blue'"
    checkable: "checkable"
    bordered: "border"

DescriptionList:
  behavior: {}
  antd:
    component: "Descriptions"
    bordered: "bordered"
    size: "size={middle}"
    column_xs: "column={1}"
    column_md: "column={{ xs: 1, sm: 2 }}"
    label: "Descriptions.Item label={name}"
    content: "Descriptions.Item"

List:
  behavior: {}
  antd:
    component: "List"
    bordered: "bordered"
    item_layout: "itemLayout='horizontal'"
    split: "split={true}"
    loading: "loading={loading}"
    size: "size={middle}"

Popover:
  behavior: {}
  antd:
    component: "Popover"
    content: "content={popoverContent}"
    title: "title={popoverTitle}"
    trigger: "trigger={['hover']}"
    placement: "placement='bottom'"
    overlay_style: "overlayStyle={{ maxWidth: 300 }}"

Timeline:
  behavior: {}
  antd:
    component: "Timeline"
    pending: "pending={true}"
    reverse: "reverse"
    item: "Timeline.Item"
    dot: "Timeline.Item color={green} dot={<ClockCircleOutlined />}"
    label: "Timeline.Item label={date}"

Tooltip:
  behavior: {}
  antd:
    component: "Tooltip"
    title: "title={tooltipText}"
    placement: "placement='top'"
    overlay_style: "overlayStyle={{ maxWidth: 300 }}"
    color: "color={#1d1d1f}"

Autocomplete:
  behavior:
    filterable: true
    searchable: true
  antd:
    component: "AutoComplete"
    options: "options={optionsList}"
    placeholder: "placeholder={Search...}"
    allow_clear: "allowClear"
    not_found_content: "notFoundContent={No results}"

Checkbox:
  behavior: {}
  antd:
    component: "Checkbox"
    checked: "checked={checked}"
    indeterminate: "indeterminate"
    disabled: "disabled"
    group: "Checkbox.Group"
    children: "children={label}"

ColorPicker:
  behavior: {}
  antd:
    component: "ColorPicker"
    show_text: "showText"
    presets: "presets={colorPresets}"
    allow_clear: "allowClear"
    format: "format='hex'"

DatePicker:
  behavior: {}
  antd:
    component: "DatePicker"
    format: "format={YYYY-MM-DD}"
    allow_clear: "allowClear"
    placeholder: "placeholder={Pick a date}"
    disabled_date: "disabledDate={disabledDate}"
    show_time: "showTime"
    range: "DatePicker.RangePicker"

DateTimePicker:
  behavior: {}
  antd:
    component: "DatePicker"
    show_time: "showTime={{ format: 'HH:mm' }}"
    format: "format={YYYY-MM-DD HH:mm}"
    allow_clear: "allowClear"
    placeholder: "placeholder={Pick date & time}"

FileUpload:
  behavior: {}
  antd:
    component: "Upload"
    drag: "Upload.Dragger"
    list_type: "listType='picture'"
    multiple: "multiple"
    before_upload: "beforeUpload={beforeUpload}"
    custom_request: "customRequest={uploadRequest}"

FormBuilder:
  behavior:
    form_layout: "single_column"
    validation_mode: "on_submit"
    conditional_enabled: false
  antd:
    component: "Form"
    layout: "layout={vertical}"
    size: "size={middle}"
    two_column: "Form.Item className={col-span-2}"
    error_summary: "Form.ErrorList"
    required_mark: "requiredMark={optional}"
    colon: "colon={false}"
    validate_trigger: "validateTrigger={onSubmit}"

FormField:
  behavior:
    conditional_enabled: false
  antd:
    component: "Form.Item"
    label: "label={fieldName}"
    help: "help={hintText}"
    error: "validateStatus={error} help={errorMessage}"
    rules: "rules={[{ required: true, message: 'Required' }]}"
    hidden: "hidden={true}"

Input:
  behavior:
    conditional_enabled: false
  antd:
    component: "Input"
    placeholder: "placeholder={Enter text}"
    allow_clear: "allowClear"
    disabled: "disabled"
    addon: "addonAfter={<Button>Add</Button>}"
    prefix: "prefix={<UserOutlined />}"
    suffix: "suffix={<WarningOutlined />}"
    sm: "size={small}"
    md: "size={middle}"
    lg: "size={large}"
    textarea: "Input.TextArea"

Radio:
  behavior: {}
  antd:
    component: "Radio"
    group: "Radio.Group"
    button: "Radio.Group buttonStyle='solid'"
    block: "optionType='button'"
    size: "size={middle}"
    disabled: "disabled"

RichTextEditor:
  behavior: {}
  antd:
    component: "Input.TextArea"
    rows: "rows={8}"
    auto_size: "autoSize={{ minRows: 4, maxRows: 10 }}"

Select:
  behavior: {}
  antd:
    component: "Select"
    mode: "mode={multiple}"
    allow_clear: "allowClear"
    show_search: "showSearch"
    placeholder: "placeholder={Select option}"
    size: "size={middle}"
    disabled: "disabled"
    tags: "mode={tags}"
    max_tag_count: "maxTagCount={3}"

Slider:
  behavior: {}
  antd:
    component: "Slider"
    range: "range"
    marks: "marks={marksObj}"
    dots: "dots"
    min: "min={0}"
    max: "max={100}"
    step: "step={1}"
    tooltip: "tooltip={{ formatter: (v) => v }}"

Switch:
  behavior: {}
  antd:
    component: "Switch"
    checked: "checked={checked}"
    loading: "loading"
    disabled: "disabled"
    size_sm: "size={small}"
    children: "children={checked ? 'ON' : 'OFF'}"

Textarea:
  behavior: {}
  antd:
    component: "Input.TextArea"
    rows: "rows={4}"
    placeholder: "placeholder={Enter text}"
    auto_size: "autoSize={{ minRows: 4, maxRows: 8 }}"
    allow_clear: "allowClear"
    maxLength: "maxLength={500}"
    show_count: "showCount"

Alert:
  behavior: {}
  antd:
    component: "Alert"
    info: "type={info}"
    success: "type={success}"
    warning: "type={warning}"
    error: "type={error}"
    banner: "banner"
    closable: "closable"
    description: "description={detail}"
    action: "action={<Link>Mark as read</Link>}"

CircularProgress:
  behavior: {}
  antd:
    component: "Spin"
    size: "size={default}"
    tip: "tip={Loading...}"
    indicator: "indicator={dotSpin}"

Dialog:
  behavior:
    close_on_backdrop: true
    show_cancel: true
    default_width: "md"
  antd:
    component: "Modal"
    title: "title={dialogTitle}"
    confirm_loading: "confirmLoading"
    closable: "closable"
    mask_closable: "maskClosable={true}"
    destroy_on_close: "destroyOnClose"
    footer: "footer={customFooter}"
    sm: "width={416}"
    md: "width={520}"
    lg: "width={672}"
    xl: "width={992}"
    full_screen: "fullscreen"

ErrorBoundary:
  behavior: {}
  antd:
    component: "Result"
    status: "status={500}"
    title: "title={Something went wrong}"
    description: "description={errorMessage}"
    extra: "extra={<Button type='primary'>Try again</Button>}"

LinearProgress:
  behavior: {}
  antd:
    component: "Progress"
    percent: "percent={percentage}"
    status_active: "status={active}"
    status_success: "status={success}"
    status_exception: "status={exception}"
    type_line: "type={line}"
    stroke_color: "strokeColor={linearGradient}"

Modal:
  behavior:
    close_on_backdrop: true
    show_cancel: true
    default_width: "lg"
  antd:
    component: "Modal"
    title: "title={modalTitle}"
    footer: "footer={[Cancel, Ok]}"
    mask_closable: "maskClosable={true}"
    destroy_on_close: "destroyOnClose"
    force_render: "forceRender"
    sm: "width={400}"
    md: "width={520}"
    lg: "width={720}"
    xl: "width={992}"

ProgressBar:
  behavior: {}
  antd:
    component: "Progress"
    percent: "percent={percentage}"
    type_line: "type={line}"
    type_circle: "type={circle}"
    status_success: "status={success}"
    status_exception: "status={exception}"
    show_info: "showInfo={false}"

Skeleton:
  behavior: {}
  antd:
    component: "Skeleton"
    active: "active"
    avatar: "Skeleton.Avatar"
    button: "Skeleton.Button"
    image: "Skeleton.Image"
    input: "Skeleton.Input"
    title: "Skeleton.Title"
    paragraph: "Skeleton.Paragraph"
    loading: "loading={true}"
    round: "round={true}"

Snackbar:
  behavior: {}
  antd:
    component: "message"
    success: "message.success(text)"
    error: "message.error(text)"
    info: "message.info(text)"
    warning: "message.warning(text)"
    duration: "duration={3}"
    top: "getContainer={() => container}"

Spinner:
  behavior: {}
  antd:
    component: "Spin"
    spinning: "spinning={true}"
    size_sm: "size={small}"
    size_md: "size={default}"
    size_lg: "size={large}"
    delay: "delay={300}"
    tip: "tip={Loading...}"

Toast:
  behavior: {}
  antd:
    component: "notification"
    success: "notification.success({ message, description })"
    error: "notification.error({ message, description })"
    info: "notification.info({ message, description })"
    warning: "notification.warning({ message, description })"
    placement: "placement={topRight}"
    duration: "duration={4.5}"
    max_count: "maxCount={3}"

Box:
  behavior: {}
  antd:
    component: "div"
    padding: "className={p-4}"
    margin: "className={m-4}"
    centered: "className={flex items-center justify-center}"

Column:
  behavior: {}
  antd:
    component: "div"
    flex: "className={flex flex-col}"
    gap: "className={gap-4}"
    center: "className={items-center}"

Container:
  behavior: {}
  antd:
    xs: "style={{ maxWidth: 576 }}"
    sm: "style={{ maxWidth: 768 }}"
    md: "style={{ maxWidth: 992 }}"
    lg: "style={{ maxWidth: 1200 }}"
    xl: "style={{ maxWidth: 1600 }}"
    padding: "className={px-6}"

Divider:
  behavior: {}
  antd:
    component: "Divider"
    orientation_left: "orientation={left}"
    orientation_right: "orientation={right}"
    plain: "plain"
    dashed: "dashed"
    vertical: "type={vertical}"

Flex:
  behavior: {}
  antd:
    component: "Flex"
    gap: "gap={middle}"
    wrap: "wrap"
    center: "justify={center} align={center}"
    between: "justify='space-between'"
    vertical: "vertical"
    horizontal: "horizontal"

Grid:
  behavior: {}
  antd:
    container: "Row"
    cols_1: "Col span={24}"
    cols_2: "Col span={12}"
    cols_3: "Col span={8}"
    cols_4: "Col span={6}"
    cols_6: "Col span={4}"
