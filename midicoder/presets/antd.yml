Accordion:
  behavior: {}
  antd:
    component: "Collapse"
    accordion: "accordion"
    bordered: "bordered"
    ghost: "ghost"
    size_sm: "size={small}"
    size_lg: "size={large}"
    panel: "Collapse.Panel header={label} key={key}"
