    size_lg: "width={720}"

ExpansionPanel:
  behavior: {}
  antd:
    component: "Collapse"
    ghost: "ghost"
    bordered: "bordered={false}"
    accordion: "accordion"
    panel: "Collapse.Panel"

BadgeButton:
  behavior: {}
  antd:
    component: "Button"
    badge: "Badge count={count} children={<Button />}"
    dot: "Badge dot children={<Button />}"

Button:
  behavior: {}
  antd:
    component: "Button"
    primary: "type={primary}"
    default: "type={default}"
    danger: "dangerous"
    dashed: "type={dashed}"
    link: "type={link}"
    text: "type={text}"
    ghost: "ghost"
    sm: "size={small}"
    md: "size={middle}"
    lg: "size={large}"
    disabled: "disabled"
    loading: "loading"
    block: "block"
    icon: "icon={<Icon />}"
    shape_circle: "shape={circle}"
    shape_round: "shape={round}"

IconButton:
  behavior: {}
  antd:
    component: "Button"
    shape: "shape={circle}"
    sm: "size={small} shape={circle}"
    md: "size={middle} shape={circle}"
    lg: "size={large} shape={circle}"
    text: "type={text}"

Image:
  behavior: {}
  antd:
    component: "Image"
    src: "src={imageUrl}"
    fallback: "fallback={fallbackUrl}"
    preview: "preview={true}"
    preview_group: "Image.PreviewGroup"
