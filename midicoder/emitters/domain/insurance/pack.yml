pack:
  id: "DP14"
  name: "Insurance Domain Pack"
  internal_id: "insurance"
  version: "1.0.0"
  status: "stable"
  category: "insurance"
  depends_on: ["CP01", "CP08"]
  file_contributions:
    infrastructure:
      - path: "app/domain/insurance/claims_engine.py"
        file_type: "domain_service"
        template: "domain/insurance/claims_engine.py.jinja2"
        stacks: ["fastapi", "nestjs"]
        context_keys: []
      - path: "app/domain/insurance/policy_engine.py"
        file_type: "domain_service"
        template: "domain/insurance/policy_engine.py.jinja2"
        stacks: ["fastapi", "nestjs"]
        context_keys: []
