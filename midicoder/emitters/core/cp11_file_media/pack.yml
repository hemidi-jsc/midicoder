pack:
  id: "CP11"
  name: "File Storage & Media Processing Generator"
  internal_id: "cp11_file_media"
  version: "1.0.0"
  status: "developing"
  category: "storage"
  depends_on: ["CP07"]
  definitions_count: 3
  obligations_count: 1
  error_codes:
    prefix: "MDC-CP11"
    range: "MDC-CP11-001 to MDC-CP11-010"
  capabilities_provided:
    - file_upload
    - file_download
    - file_storage
    - media_transform
  capabilities:
    - id: "s3_storage"
      emitter: "fastapi, nestjs"
    - id: "local_storage"
      emitter: "fastapi, nestjs"
    - id: "upload_policy"
      emitter: "fastapi, nestjs"
    - id: "media_transform"
      emitter: "fastapi, nestjs"
  definitions:
    - name: "StorageProfile"
      description: "Storage backend configuration (S3, local)"
    - name: "UploadPolicy"
      description: "File size, type, and rate limits"
    - name: "MediaTransform"
      description: "Image/video transformation pipeline"
  obligations:
    - name: "UploadValidation"
      description: "All uploads must validate type, size, and malware"
  frontend_integration:
    angular:
      - FileStorageService
      - FileUploadComponent
    react:
      - useFileStorage
      - FileUpload
