      - path: "src/auth-ui/SessionTimeoutModal.tsx"
        file_type: "session_modal"
        template: "cp21_auth_ui/SessionTimeoutModal.tsx.jinja2"
        stacks: ["react"]
        pack_emitter: null
      - path: "src/auth-ui/useSessionMonitor.ts"
        file_type: "session_hook"
        template: "cp21_auth_ui/useSessionMonitor.ts.jinja2"
        stacks: ["react"]
        pack_emitter: null
      - path: "src/auth-ui/auth-routes.tsx"
        file_type: "auth_routes"
        template: "cp21_auth_ui/auth-routes.tsx.jinja2"
        stacks: ["react"]
        pack_emitter: null
  frontend_integration:
    angular:
      - LoginComponent
      - RegisterComponent
      - ForgotPasswordComponent
      - ResetPasswordComponent
      - MfaVerifyComponent
      - OAuthCallbackComponent
      - RoleGuard
      - PermissionGuard
      - SessionTimeoutModalComponent
      - SessionMonitorService
    react:
      - Login
      - Register
      - ForgotPassword
      - ResetPassword
      - MfaVerify
      - OAuthCallback
      - RoleRoute
      - PermissionRoute
      - SessionTimeoutModal
      - useSessionMonitor
