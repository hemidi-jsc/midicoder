pack:
  id: "CP21"
  name: "Authentication UI Generator"
  internal_id: "cp21_auth_ui"
  version: "1.0.0"
  status: "stable"
  category: "frontend"
  depends_on: ["CP03", "CP18"]
  definitions_count: 1
  obligations_count: 2
  error_codes:
    prefix: "MDC-CP21"
    range: "MDC-CP21-001 to MDC-CP21-005"
  capabilities_provided:
    - login_page
    - register_page
    - password_reset
    - mfa_verify
    - oauth_callback
    - oauth_providers
    - captcha
    - role_guard
    - permission_guard
    - session_monitor
  capabilities:
    - id: "login_page"
      emitter: "angular, react"
    - id: "register_page"
      emitter: "angular, react"
    - id: "password_reset"
      emitter: "angular, react"
    - id: "mfa_verify"
      emitter: "angular, react"
    - id: "oauth_callback"
      emitter: "angular, react"
    - id: "oauth_providers"
      emitter: "angular, react"
    - id: "captcha"
      emitter: "angular, react"
    - id: "role_guard"
      emitter: "angular, react"
    - id: "permission_guard"
      emitter: "angular, react"
    - id: "session_monitor"
      emitter: "angular, react"
  definitions:
    - name: "AuthUIConfig"
      description: "Config chính cho auth UI generation (pages, ui_framework, session_monitor)"
  obligations:
    - name: "UIFrameworkValid"
      description: "UI framework phải là một trong 5 frameworks được hỗ trợ"
    - name: "PageCompleteness"
      description: "Tất cả pages được emit phải có đầy đủ template"
  file_contributions:
    infrastructure:
      # Angular
      - path: "src/app/auth-ui/login.component.ts"
        file_type: "auth_page"
        template: "cp21_auth_ui/login.component.ts.jinja2"
        stacks: ["angular"]
        pack_emitter: null
      - path: "src/app/auth-ui/register.component.ts"
        file_type: "auth_page"
        template: "cp21_auth_ui/register.component.ts.jinja2"
        stacks: ["angular"]
        pack_emitter: null
      - path: "src/app/auth-ui/forgot-password.component.ts"
        file_type: "auth_page"
        template: "cp21_auth_ui/forgot-password.component.ts.jinja2"
        stacks: ["angular"]
        pack_emitter: null
      - path: "src/app/auth-ui/reset-password.component.ts"
        file_type: "auth_page"
        template: "cp21_auth_ui/reset-password.component.ts.jinja2"
        stacks: ["angular"]
        pack_emitter: null
      - path: "src/app/auth-ui/mfa-verify.component.ts"
        file_type: "auth_page"
        template: "cp21_auth_ui/mfa-verify.component.ts.jinja2"
        stacks: ["angular"]
        pack_emitter: null
      - path: "src/app/auth-ui/oauth-callback.component.ts"
        file_type: "auth_page"
        template: "cp21_auth_ui/oauth-callback.component.ts.jinja2"
        stacks: ["angular"]
        pack_emitter: null
      - path: "src/app/auth-ui/oauth-providers.component.ts"
        file_type: "auth_component"
        template: "cp21_auth_ui/oauth-providers.component.ts.jinja2"
        stacks: ["angular"]
        pack_emitter: null
      - path: "src/app/auth-ui/captcha.component.ts"
        file_type: "auth_component"
        template: "cp21_auth_ui/captcha.component.ts.jinja2"
        stacks: ["angular"]
        pack_emitter: null
      - path: "src/app/auth-ui/role.guard.ts"
        file_type: "route_guard"
        template: "cp21_auth_ui/role.guard.ts.jinja2"
        stacks: ["angular"]
        pack_emitter: null
      - path: "src/app/auth-ui/permission.guard.ts"
        file_type: "route_guard"
        template: "cp21_auth_ui/permission.guard.ts.jinja2"
        stacks: ["angular"]
        pack_emitter: null
      - path: "src/app/auth-ui/session-timeout.modal.component.ts"
        file_type: "session_modal"
        template: "cp21_auth_ui/session-timeout.modal.component.ts.jinja2"
        stacks: ["angular"]
        pack_emitter: null
      - path: "src/app/auth-ui/session-monitor.service.ts"
