        stacks: ["angular"]
        pack_emitter: null
      - path: "src/app/auth-ui/auth.routes.ts"
        file_type: "auth_routes"
        template: "cp21_auth_ui/auth.routes.ts.jinja2"
        stacks: ["angular"]
        pack_emitter: null
      - path: "src/app/auth-ui/auth-ui.module.ts"
        file_type: "auth_module"
        template: "cp21_auth_ui/auth-ui.module.ts.jinja2"
        stacks: ["angular"]
        pack_emitter: null
      # React
      - path: "src/auth-ui/login.tsx"
        file_type: "auth_page"
