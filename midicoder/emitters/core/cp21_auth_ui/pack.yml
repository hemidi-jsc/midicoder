      - path: "src/auth-ui/forgot-password.tsx"
        file_type: "auth_page"
        template: "cp21_auth_ui/forgot-password.tsx.jinja2"
        stacks: ["react"]
        pack_emitter: null
      - path: "src/auth-ui/reset-password.tsx"
        file_type: "auth_page"
        template: "cp21_auth_ui/reset-password.tsx.jinja2"
        stacks: ["react"]
        pack_emitter: null
      - path: "src/auth-ui/mfa-verify.tsx"
        file_type: "auth_page"
        template: "cp21_auth_ui/mfa-verify.tsx.jinja2"
        stacks: ["react"]
        pack_emitter: null
      - path: "src/auth-ui/oauth-callback.tsx"
        file_type: "auth_page"
        template: "cp21_auth_ui/oauth-callback.tsx.jinja2"
        stacks: ["react"]
