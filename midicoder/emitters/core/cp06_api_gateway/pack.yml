      emitter: "fastapi, nestjs"
    - id: "graphql_routing"
      emitter: "fastapi, nestjs"
  definitions:
    - name: "GatewayProfile"
      description: "Gateway configuration with routing and upstream binding"
    - name: "RouteSpec"
      description: "Route definition: HTTP, GraphQL, or Webhook"
  obligations: []
