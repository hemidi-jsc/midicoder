pack:
    id: "CP13"
    name: "Background Job & Workflow Generator"
    internal_id: "cp13-workflow-runtime"
    version: "1.0.0"
    phase: "P1"
    category: "runtime"
    status: "stable"
    depends_on: ["CP05"]
    definitions_count: 3
    obligations_count: 1
    error_codes:
        prefix: "JOB"
        range: "MDC-CP13-001~008"
    capabilities_provided:
        - schedule_job
        - background_worker
        - workflow_orchestrate
    templates:
        workflow_orchestrate: "fastapi/workflow_service.py.jinja2"
        schedule_job: "fastapi/job_scheduler.py.jinja2"
        background_worker: "fastapi/worker.py.jinja2"
    frontend_integration:
        angular:
            - WorkflowService
            - JobStatusComponent
        react:
            - useWorkflow
            - useJobStatus
