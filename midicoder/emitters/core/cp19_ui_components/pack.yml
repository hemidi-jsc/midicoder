pack:
  id: "CP19"
  name: "UI Component Generator"
  internal_id: "cp19_ui_components"
  version: "1.0.0"
  status: "stable"
  category: "frontend"
  depends_on: ["CP18"]
  definitions_count: 3
  obligations_count: 1
  error_codes:
    prefix: "MDC-CP19"
    range: "MDC-CP19-001 to MDC-CP19-005"
  capabilities_provided:
    - component_render
    - form_generate
    - table_generate
  capabilities:
    - id: "form_fields"
      emitter: "angular, react, fastapi, nestjs"
    - id: "data_tables"
      emitter: "angular, react"
    - id: "card_lists"
      emitter: "angular, react"
    - id: "dialogs"
      emitter: "angular, react"
  definitions:
    - name: "ComponentSpec"
      description: "Specification for a reusable UI component"
    - name: "FormFieldSpec"
      description: "Form field with type, validation, and binding"
    - name: "TableSpec"
      description: "Data table with columns, sorting, and pagination"
  obligations:
    - name: "ComponentSchemaConsistency"
      description: "Component schemas must match entity field types from CP01"
  frontend_integration:
    angular:
      - FormFieldComponent
      - DataTableComponent
      - CardListComponent
      - DialogComponent
    react:
      - FormField
      - DataTable
      - CardList
      - Dialog
