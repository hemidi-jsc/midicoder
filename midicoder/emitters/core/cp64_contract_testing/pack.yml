# ===========================================================================
# CP64 — API Contract Testing (Pact)
# ===========================================================================
# File contributions declaration cho 2 stacks: FastAPI, NestJS
#
# Capabilities:
# - consumer_driven_contract: Consumer-driven contract testing với Pact
# - provider_verification: Provider verification để đảm bảo backward compatibility
# - pact_broker_integration: Tích hợp Pact Broker để chia sẻ contracts
# - contract_ci_pipeline: CI pipeline cho contract testing
# - contract_compliance_gate: Gate kiểm tra contract compliance
# - interaction_mocking: Mock interactions cho consumer tests
#
# Storage: Pact Broker (self-hosted hoặc PactFlow)
# ===========================================================================

pack:
  id: "CP64"
  name: "API Contract Testing (Pact)"
  internal_id: "cp64_contract_testing"
  version: "1.0.0"
  status: "stable"
  category: "quality"
  depends_on: ["CP01", "CP06", "CP23", "CP55"]
  definitions_count: 6
  obligations_count: 2
  error_codes:
    prefix: "MDC-CP64"
    range: "MDC-CP64-001 to MDC-CP64-010"
  capabilities_provided:
    - consumer_driven_contract
    - provider_verification
    - pact_broker_integration
    - contract_ci_pipeline
    - contract_compliance_gate
    - interaction_mocking
  capabilities:
    - id: "consumer_driven_contract"
      emitter: "fastapi, nestjs"
    - id: "provider_verification"
      emitter: "fastapi, nestjs"
    - id: "pact_broker_integration"
      emitter: "fastapi, nestjs"
    - id: "contract_ci_pipeline"
      emitter: "fastapi, nestjs"
    - id: "contract_compliance_gate"
      emitter: "fastapi, nestjs"
    - id: "interaction_mocking"
      emitter: "fastapi, nestjs"
  definitions:
    - name: "ConsumerSpec"
      description: "Định nghĩa consumer-driven contract với interactions giữa consumer và provider"
    - name: "Interaction"
      description: "Request/response interaction đơn lẻ với match rules và provider state"
    - name: "RequestMatch"
      description: "Request match criteria với method, path, headers, body, và match rules"
    - name: "ResponseStub"
      description: "Response stub cho mocked provider với status, headers, body"
    - name: "ProviderVerifier"
      description: "Cấu hình provider verification với pact broker và consumer version selectors"
    - name: "PactBrokerConfig"
      description: "Cấu hình Pact Broker URL, authentication, và auto-publish settings"
  obligations:
    - name: "ContractTestRequired"
      description: "Mọi API endpoint phải có contract test để đảm bảo backward compatibility"
    - name: "ProviderVerificationPass"
      description: "Provider verification phải pass trước khi deploy để tránh breaking consumers"
  file_contributions:
    infrastructure:
      # ------------------------------------------------------------------
      # FastAPI — Contract Testing
      # ------------------------------------------------------------------
      - path: "app/services/contract_service.py"
        file_type: "contract_service"
        template: "cp64_contract_testing/contract_service.py.jinja2"
        stacks: ["fastapi"]
        pack_emitter: null
        context_keys: ["consumer_specs", "pact_broker"]
      - path: "tests/contract/pact_consumer_test.py"
        file_type: "pact_consumer_test"
        template: "cp64_contract_testing/pact_consumer_test.py.jinja2"
        stacks: ["fastapi"]
        pack_emitter: null
        context_keys: ["consumer_specs", "interactions"]
      - path: "tests/contract/pact_provider_verifier.py"
        file_type: "pact_provider_verifier"
        template: "cp64_contract_testing/pact_provider_verifier.py.jinja2"
        stacks: ["fastapi"]
        pack_emitter: null
        context_keys: ["provider_verifiers", "pact_broker"]
      - path: "app/api/contract_router.py"
        file_type: "contract_router"
        template: "cp64_contract_testing/contract_router.py.jinja2"
        stacks: ["fastapi"]
        pack_emitter: null
        context_keys: ["consumer_specs"]
      # ------------------------------------------------------------------
      # NestJS — Contract Testing
      # ------------------------------------------------------------------
      - path: "src/contract/contract.module.ts"
        file_type: "contract_module"
        template: "cp64_contract_testing/contract.module.ts.jinja2"
        stacks: ["nestjs"]
        pack_emitter: null
        context_keys: ["consumer_specs", "pact_broker"]
      - path: "src/contract/pact-consumer.service.ts"
        file_type: "pact_consumer_service"
        template: "cp64_contract_testing/pact-consumer.service.ts.jinja2"
        stacks: ["nestjs"]
        pack_emitter: null
        context_keys: ["consumer_specs", "interactions"]
      - path: "src/contract/pact-provider.service.ts"
        file_type: "pact_provider_service"
        template: "cp64_contract_testing/pact-provider.service.ts.jinja2"
        stacks: ["nestjs"]
        pack_emitter: null
        context_keys: ["provider_verifiers", "pact_broker"]
      - path: "src/contract/contract.controller.ts"
        file_type: "contract_controller"
        template: "cp64_contract_testing/contract.controller.ts.jinja2"
        stacks: ["nestjs"]
        pack_emitter: null
        context_keys: ["consumer_specs"]
  recipes:
    - basic_contract_recipe
    - full_pact_flow_recipe
    - multi_consumer_recipe
