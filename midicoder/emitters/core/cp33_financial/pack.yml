pack:
  id: "CP33"
  name: "Financial Engine"
  internal_id: "cp33_financial"
  version: "1.0.0"
  status: "stable"
  category: "financial"
  depends_on: ["CP01", "CP08", "CP14"]
  definitions_count: 5
  obligations_count: 2
  error_codes:
    prefix: "MDC-CP33"
    range: "MDC-CP33-001 to MDC-CP33-015"
  capabilities_provided:
    - multi_currency_calc
    - fx_rate_convert
    - double_entry_ledger
    - rounding_apply
  capabilities:
    - id: "multi_currency_calc"
      emitter: "fastapi, nestjs"
    - id: "fx_rate_convert"
      emitter: "fastapi, nestjs"
    - id: "double_entry_ledger"
      emitter: "fastapi, nestjs, angular, react"
    - id: "rounding_apply"
      emitter: "fastapi, nestjs"
  definitions:
    - name: "Currency"
      description: "Multi-currency definition with ISO 4217 code, decimals, symbol, name"
    - name: "FXRate"
      description: "Foreign exchange rate with currency pair, effective date range, active status"
    - name: "Account"
      description: "Financial account with type (asset, liability, equity, revenue, expense), parent hierarchy"
    - name: "LedgerEntry"
      description: "Immutable ledger entry with hash chain for tamper detection"
    - name: "FinancialTransaction"
      description: "Double-entry financial transaction with debit/credit entries and balance validation"
  obligations:
    - name: "DoubleEntryBalanced"
      description: "All double-entry transactions must have equal total debits and credits"
    - name: "LedgerImmutable"
      description: "Posted ledger entries cannot be modified or deleted (hash chain integrity)"
  file_contributions:
    infrastructure:
      # FastAPI
      - path: "app/financial/currency_model.py"
        file_type: "model"
        template: "cp33_financial/currency_model.py.jinja2"
        stacks: ["fastapi"]
        pack_emitter: null
        context_keys: ["currencies", "base_currency"]
      - path: "app/financial/account_model.py"
        file_type: "model"
        template: "cp33_financial/account_model.py.jinja2"
        stacks: ["fastapi"]
        pack_emitter: null
        context_keys: ["accounts"]
      - path: "app/financial/ledger_service.py"
        file_type: "service"
        template: "cp33_financial/ledger_service.py.jinja2"
        stacks: ["fastapi"]
        pack_emitter: null
        context_keys: ["currencies", "accounts", "base_currency"]
      - path: "app/financial/fx_service.py"
        file_type: "service"
        template: "cp33_financial/fx_service.py.jinja2"
        stacks: ["fastapi"]
        pack_emitter: null
        context_keys: ["fx_rates"]
      # NestJS
      - path: "src/financial/currency-model.ts"
        file_type: "model"
        template: "cp33_financial/currency-model.ts.jinja2"
        stacks: ["nestjs"]
        pack_emitter: null
        context_keys: ["currencies", "base_currency"]
      - path: "src/financial/account-model.ts"
        file_type: "model"
        template: "cp33_financial/account-model.ts.jinja2"
        stacks: ["nestjs"]
        pack_emitter: null
        context_keys: ["accounts"]
      - path: "src/financial/ledger-service.ts"
        file_type: "service"
        template: "cp33_financial/ledger-service.ts.jinja2"
        stacks: ["nestjs"]
        pack_emitter: null
        context_keys: ["currencies", "accounts", "base_currency"]
      - path: "src/financial/fx-service.ts"
        file_type: "service"
        template: "cp33_financial/fx-service.ts.jinja2"
        stacks: ["nestjs"]
        pack_emitter: null
        context_keys: ["fx_rates"]
      # Angular
      - path: "src/app/financial/ledger-dashboard/ledger-dashboard.component.ts"
        file_type: "component"
        template: "cp33_financial/ledger-dashboard.component.ts.jinja2"
        stacks: ["angular"]
        pack_emitter: null
        context_keys: ["accounts", "transactions"]
      - path: "src/app/financial/transaction-detail/transaction-detail.component.ts"
        file_type: "component"
        template: "cp33_financial/transaction-detail.component.ts.jinja2"
        stacks: ["angular"]
        pack_emitter: null
        context_keys: ["transactions"]
      # Angular — Transaction Dashboard (B27 addin)
      - path: "src/app/financial/transaction-dashboard/transaction-dashboard.component.ts"
        file_type: "component"
        template: "cp33_financial/transaction-dashboard.component.ts.jinja2"
        stacks: ["angular"]
        pack_emitter: null
        context_keys: ["accounts", "transactions"]
      # React
      - path: "src/pages/financial/LedgerDashboard.tsx"
        file_type: "component"
        template: "cp33_financial/LedgerDashboard.tsx.jinja2"
        stacks: ["react"]
        pack_emitter: null
        context_keys: ["accounts", "transactions"]
      - path: "src/pages/financial/TransactionDetail.tsx"
        file_type: "component"
        template: "cp33_financial/TransactionDetail.tsx.jinja2"
        stacks: ["react"]
        pack_emitter: null
        context_keys: ["transactions"]
      # React — Transaction Dashboard (B27 addin)
      - path: "src/pages/financial/TransactionDashboard.tsx"
        file_type: "component"
        template: "cp33_financial/TransactionDashboard.tsx.jinja2"
        stacks: ["react"]
        pack_emitter: null
        context_keys: ["accounts", "transactions"]
  frontend_integration:
    angular:
      - LedgerDashboard
      - TransactionDetail
      - TransactionDashboard
    react:
      - LedgerDashboard
      - TransactionDetail
      - TransactionDashboard
