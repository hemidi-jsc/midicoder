# ===========================================================================
# CP38 — Data Import/Export/ETL
# ===========================================================================
# File contributions declaration cho 4 stacks: FastAPI, NestJS, Angular, React
#
# Capabilities:
# - csv_import: Import dữ liệu từ file CSV
# - json_import: Import dữ liệu từ file JSON
# - data_migrate: Data migration với ETL mappings
# - bulk_operation: Bulk operation với chunking và retry
# - etl_pipeline: ETL pipeline với extract/transform/load
# - data_export: Export dữ liệu từ entity ra file
#
# Storage: Database (SQLite/PostgreSQL) + File System
# ===========================================================================

pack:
  id: "CP38"
  name: "Data Import/Export/ETL"
  internal_id: "cp38_data_etl"
  version: "1.0.0"
  status: "stable"
  category: "data"
  depends_on: ["CP01", "CP08", "CP13", "CP14"]
  definitions_count: 5
  obligations_count: 2
  error_codes:
    prefix: "MDC-CP38"
    range: "MDC-CP38-001 to MDC-CP38-018"
  capabilities_provided:
    - csv_import
    - json_import
    - data_migrate
    - bulk_operation
    - etl_pipeline
    - data_export
  capabilities:
    - id: "csv_import"
      emitter: "fastapi, nestjs, angular, react"
    - id: "json_import"
      emitter: "fastapi, nestjs, angular, react"
    - id: "data_migrate"
      emitter: "fastapi, nestjs"
    - id: "bulk_operation"
      emitter: "fastapi, nestjs, angular, react"
    - id: "etl_pipeline"
      emitter: "fastapi, nestjs"
    - id: "data_export"
      emitter: "fastapi, nestjs, angular, react"
  definitions:
    - name: "ImportJob"
      description: "Job import dữ liệu từ file CSV/JSON vào entity với tracking progress và error handling"
    - name: "ExportJob"
      description: "Job export dữ liệu từ entity ra file với filter và format hỗ trợ"
    - name: "ETLJob"
      description: "ETL pipeline hoàn chỉnh với extract/transform/load steps"
    - name: "ETLMapping"
      description: "Ánh xạ cột source sang field target với transform (map/filter/aggregate/convert/rename)"
    - name: "BulkConfig"
      description: "Cấu hình bulk operation với chunking, retry, và rollback threshold"
  obligations:
    - name: "ImportDataIntegrity"
      description: "Tất cả import jobs phải đảm bảo data integrity với transaction rollback khi lỗi vượt quá threshold"
    - name: "AuditTrailRequired"
      description: "Tất cả import/export/ETL jobs phải được audit log qua CP14 với job status và kết quả"
