# Pack Definition — CP32: State Machine Engine
#
# Pack này cung cấp entity lifecycle state machine: lightweight FSM
# cho quản lý trạng thái của một entity đơn lẻ.
#
# Boundary: CP32 = 1 entity FSM. CP13 = workflow orchestration (nhiều entities)

pack:
  id: "CP32"
  name: "State Machine Engine"
  internal_id: "cp32_state_machine"
  version: "1.0.0"
  phase: "P1"
  depends_on:
    - "CP01"
    - "CP05"
    - "CP14"

capabilities_provided:
  - "state_transition"
  - "state_validate"
  - "lifecycle_manage"

file_contributions:
  infrastructure:
    # FastAPI — core engine
    - path: "app/state_machine/state_machine.py"
      file_type: "state_machine"
      template: "cp32_state_machine/state_machine.py.jinja2"
      stacks: ["fastapi"]
      pack_emitter: null
      context_keys: ["state_machines"]

    - path: "app/state_machine/state_registry.py"
      file_type: "state_machine"
      template: "cp32_state_machine/state_registry.py.jinja2"
      stacks: ["fastapi"]
      pack_emitter: null
      context_keys: ["state_machines"]

    # FastAPI — transition handler (guard + effect)
    - path: "app/state_machine/state_transition_handler.py"
      file_type: "state_machine"
      template: "cp32_state_machine/state_transition_handler.py.jinja2"
      stacks: ["fastapi"]
      pack_emitter: null
      context_keys: ["state_machines"]

    # FastAPI — lifecycle emitter
    - path: "app/state_machine/state_lifecycle_emitter.py"
      file_type: "state_machine"
      template: "cp32_state_machine/state_lifecycle_emitter.py.jinja2"
      stacks: ["fastapi"]
      pack_emitter: null
      context_keys: ["state_machines"]

    # NestJS — core engine
    - path: "src/state-machine/state-machine.service.ts"
      file_type: "state_machine"
      template: "cp32_state_machine/state-machine.service.ts.jinja2"
      stacks: ["nestjs"]
      pack_emitter: null
      context_keys: ["state_machines"]

    - path: "src/state-machine/state-registry.service.ts"
      file_type: "state_machine"
      template: "cp32_state_machine/state-registry.service.ts.jinja2"
      stacks: ["nestjs"]
      pack_emitter: null
      context_keys: ["state_machines"]

    # NestJS — transition handler (guard + effect)
    - path: "src/state-machine/state-transition-handler.service.ts"
      file_type: "state_machine"
      template: "cp32_state_machine/state-transition-handler.service.ts.jinja2"
      stacks: ["nestjs"]
      pack_emitter: null
      context_keys: ["state_machines"]

    # NestJS — lifecycle emitter
    - path: "src/state-machine/state-lifecycle-emitter.service.ts"
      file_type: "state_machine"
      template: "cp32_state_machine/state-lifecycle-emitter.service.ts.jinja2"
      stacks: ["nestjs"]
      pack_emitter: null
      context_keys: ["state_machines"]
