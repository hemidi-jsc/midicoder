pack:
  id: "CP04"
  name: "RBAC & Policy Engine"
  internal_id: "cp04_rbac"
  version: "1.0.0"
  status: "stable"
  category: "security"
  depends_on: ["CP02", "CP03"]
  definitions_count: 4
  obligations_count: 1
  error_codes:
    prefix: "MDC-CP04"
    range: "MDC-CP04-001 to MDC-CP04-008"
  capabilities_provided:
    - authorize_role
    - check_policy
  capabilities:
    - id: "role_check"
      emitter: "fastapi, nestjs, angular, react"
    - id: "policy_evaluation"
      emitter: "fastapi, nestjs, angular, react"
    - id: "role_hierarchy"
      emitter: "fastapi, nestjs"
    - id: "abac_engine"
      emitter: "fastapi, nestjs"
  definitions:
    - name: "Role"
      description: "Named set of permissions with hierarchical inheritance"
    - name: "Permission"
      description: "Atomic access right on a resource"
    - name: "PolicyRule"
      description: "Conditional access rule with effects"
    - name: "PolicyDecision"
      description: "Result of policy evaluation (allow/deny)"
  obligations:
    - name: "RoleHierarchy"
      description: "Role assignments must respect hierarchical ordering"
  frontend_integration:
    angular:
      - RbacService
      - RoleGuard
      - PermissionDirective
    react:
      - useRbac
      - ProtectedRoute
      - WithPermission
