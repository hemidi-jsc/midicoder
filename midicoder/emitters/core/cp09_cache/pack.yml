pack:
  id: "CP09"
  name: "Caching & Performance Layer Generator"
  internal_id: "cp09_cache"
  version: "1.1.0"
  status: "developing"
  category: "performance"
  depends_on: ["CP08"]
  definitions_count: 14
  obligations_count: 5
  error_codes:
    prefix: "MDC-CP09"
    range: "MDC-CP09-001 to MDC-CP09-005"
  capabilities_provided:
    - cache_get
    - cache_set
    - cache_invalidate
    - cache_warm
    - cdn_cache
    - stampede_prevention
    - multi_tier_cache
    - tag_invalidation
    - distributed_lock
  capabilities:
    - id: "redis"
      emitter: "fastapi, nestjs"
    - id: "memory"
      emitter: "fastapi, nestjs"
    - id: "memcached"
      emitter: "fastapi, nestjs"
    - id: "tenant_aware"
      emitter: "fastapi, nestjs"
    - id: "invalidation"
      emitter: "fastapi, nestjs"
    - id: "cdn"
      emitter: "fastapi, nestjs"
    - id: "stampede_prevention"
      emitter: "fastapi, nestjs"
    - id: "multi_tier"
      emitter: "fastapi, nestjs"
    - id: "cache_warmup"
      emitter: "fastapi, nestjs"
  definitions:
    - name: "CacheProfile"
      description: "Cache backend, TTL, và eviction strategy"
    - name: "CacheBinding"
      description: "Binding giữa query patterns và cache keys"
    - name: "InvalidationStrategy"
      description: "Quy tắc cache invalidation (pattern, tag, event)"
    - name: "CDNCacheLayer"
      description: "CDN edge cache với origin shield, purge API, cache-control headers"
    - name: "StampedePrevention"
      description: "Ngăn thundering-herd (mutex, early-update, probabilistic)"
    - name: "CacheTier"
      description: "Multi-tier cache (L1=memory, L2=Redis, L3=database)"
    - name: "CacheWarmupConfig"
      description: "Cache warmup strategy (scheduled, on_demand, background, on_startup)"
    - name: "CacheMetrics"
      description: "Cache performance metrics (hit_rate, miss_rate, eviction_rate, latency)"
    - name: "CacheStrategy"
      description: "Strategy caching (read_through, write_through, cache_aside)"
    - name: "CacheInvalidationRule"
      description: "Quy tắc cho cache invalidation"
    - name: "CacheWarmConfig"
      description: "Cấu hình warm-up cache"
    - name: "CDNCacheControlDirective"
      description: "Cache-Control directives cho CDN responses"
    - name: "StampedePreventionStrategy"
      description: "Chiến lược ngăn cache stampede"
    - name: "CacheWarmupStrategy"
      description: "Chiến lược cache warmup"
  obligations:
    - name: "CacheConsistency"
      description: "Cache phải được invalidate khi data mutation tương ứng"
    - name: "TenantAware"
      description: "Cache keys phải bao gồm tenant isolation"
    - name: "StampedeProtection"
      description: "Cache miss đồng thời không được gây thundering herd"
    - name: "CDNCacheControl"
      description: "CDN responses phải có Cache-Control headers rõ ràng"
    - name: "MultiTierConsistency"
      description: "Multi-tier cache phải đồng bộ khi invalidate"
  file_contributions:
    infrastructure:
      # FastAPI infrastructure
      - path: "app/cache/redis.py"
        file_type: "redis_client"
        template: "cp09_cache/redis.py.jinja2"
        stacks: ["fastapi"]
        pack_emitter: null
      - path: "app/cache/cache_decorators.py"
