pack:
  id: "CP15"
  name: "Observability Stack Generator"
  internal_id: "cp15_observability"
  version: "1.0.0"
  status: "stable"
  category: "observability"
  depends_on: ["CP07"]
  definitions_count: 3
  obligations_count: 2
  error_codes:
    prefix: "MDC-CP15"
    range: "MDC-CP15-001 to MDC-CP15-010"
  capabilities_provided:
    - emit_metric
    - structured_logging
    - distributed_tracing
  capabilities:
    - id: "metrics"
      emitter: "fastapi, nestjs"
    - id: "structured_logging"
      emitter: "fastapi, nestjs"
    - id: "tracing"
      emitter: "fastapi, nestjs"
  definitions:
    - name: "MetricProfile"
      description: "Metric type, granularity, and retention policy"
    - name: "StructuredLogConfig"
      description: "Log format, level, and output destination"
    - name: "TraceConfig"
      description: "Trace sampling, propagation, and exporter settings"
  obligations:
    - name: "LogStructured"
      description: "All logs must be structured JSON with correlation IDs"
    - name: "TracePropagation"
      description: "Trace context must propagate across service boundaries"
  frontend_integration:
    angular:
      - LoggingService
      - LogViewerComponent
    react:
      - useLogging
      - LogViewer
