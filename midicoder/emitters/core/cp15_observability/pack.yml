pack:
  id: "CP15"
  name: "Observability Stack Generator"
  internal_id: "cp15_observability"
  version: "1.0.0"
  status: "stable"
  category: "observability"
  depends_on: ["CP07"]
  definitions_count: 9
  obligations_count: 5
  error_codes:
    prefix: "MDC-CP15"
    range: "MDC-CP15-001 to MDC-CP15-010"
  capabilities_provided:
    - emit_metric
    - structured_logging
    - distributed_tracing
    - opentelemetry_export
    - log_shipping
    - span_propagation
  capabilities:
    - id: "metrics"
      emitter: "fastapi, nestjs"
    - id: "structured_logging"
      emitter: "fastapi, nestjs"
    - id: "tracing"
      emitter: "fastapi, nestjs"
    - id: "opentelemetry"
      emitter: "fastapi, nestjs"
    - id: "log_shipping"
      emitter: "fastapi, nestjs"
    - id: "span_propagation"
      emitter: "fastapi, nestjs"
  definitions:
    - name: "MetricProfile"
      description: "Metric type, granularity, and retention policy"
    - name: "StructuredLogConfig"
      description: "Log format, level, and output destination"
    - name: "TraceConfig"
      description: "Trace sampling, propagation, and exporter settings"
    - name: "OpenTelemetryConfig"
      description: "Unified OTel SDK config (traces/metrics/logs) with sampler"
    - name: "OTelExporterConfig"
      description: "OTLP exporter (gRPC, HTTP/JSON, HTTP/Protobuf) with batching"
    - name: "LogShippingConfig"
      description: "Ship logs to Loki, CloudWatch, Datadog, ES, Splunk"
    - name: "LogShippingDestination"
      description: "Individual log destination with labels, compression, filter"
    - name: "SamplerType"
      description: "Trace sampler (always_on/off, traceid_ratio, parent_based)"
    - name: "SpanKind"
      description: "Span classification (internal, server, client, producer, consumer)"
  obligations:
    - name: "LogStructured"
      description: "All logs must be structured JSON with correlation IDs"
    - name: "TracePropagation"
      description: "Trace context must propagate across service boundaries"
    - name: "OTLPExporterConfigured"
      description: "OTLP exporter must have valid endpoint and protocol"
    - name: "LogDestinationValid"
      description: "Each log shipping destination must have valid endpoint"
    - name: "SamplingRateValid"
      description: "Sampler rate must be in [0.0, 1.0] range"
  file_contributions:
    infrastructure:
      - path: "app/observability/observability_service.py"
        file_type: "observability_service"
        template: "cp15_observability/observability_service.py.jinja2"
        stacks: ["fastapi", "nestjs"]
        pack_emitter: null
      - path: "app/observability/observability_middleware.py"
        file_type: "observability_middleware"
        template: "cp15_observability/observability_middleware.py.jinja2"
        stacks: ["fastapi"]
        pack_emitter: null
      - path: "src/observability/observability.module.ts"
        file_type: "observability_module"
        template: "cp15_observability/observability.module.ts.jinja2"
        stacks: ["nestjs"]
        pack_emitter: null
      - path: "src/observability/observability.service.ts"
        file_type: "observability_service"
        template: "cp15_observability/observability.service.ts.jinja2"
        stacks: ["nestjs"]
        pack_emitter: null
      - path: "src/observability/observability.interceptor.ts"
        file_type: "observability_interceptor"
        template: "cp15_observability/observability.interceptor.ts.jinja2"
        stacks: ["nestjs"]
        pack_emitter: null
      - path: "src/app/core/observability/logging.service.ts"
        file_type: "logging_service"
        template: "cp15_observability/logging_service.ts.jinja2"
        stacks: ["angular"]
        pack_emitter: null
      - path: "src/app/shared/components/log-viewer/log-viewer.component.ts"
        file_type: "log_viewer_component"
        template: "cp15_observability/log_viewer.component.ts.jinja2"
        stacks: ["angular"]
        pack_emitter: null
      - path: "src/observability/LogViewer.tsx"
        file_type: "log_viewer_component"
        template: "cp15_observability/LogViewer.tsx.jinja2"
        stacks: ["react"]
        pack_emitter: null
      - path: "src/observability/useLogging.ts"
        file_type: "logging_hook"
        template: "cp15_observability/useLogging.ts.jinja2"
        stacks: ["react"]
        pack_emitter: null
      - path: "src/observability/types.ts"
        file_type: "observability_types"
        template: "cp15_observability/types.ts.jinja2"
        stacks: ["react"]
        pack_emitter: null
  frontend_integration:
    angular:
      - LoggingService
      - LogViewerComponent
    react:
      - useLogging
      - LogViewer
