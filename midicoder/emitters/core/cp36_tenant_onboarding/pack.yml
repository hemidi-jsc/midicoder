pack:
  id: "CP36"
  name: "Tenant Onboarding & Subscription"
  internal_id: "cp36_tenant_onboarding"
  version: "1.1.0"
  status: "stable"
  category: "tenant-management"
  depends_on:
    - "CP02"
    - "CP03"
    - "CP12"
    - "CP33"
  definitions_count: 7
  obligations_count: 2
  recipes_count: 2
  error_codes:
    prefix: "MDC-CP36"
    range: "MDC-CP36-001 to MDC-CP36-022"
  capabilities_provided:
    - tenant_register
    - tenant_verify
    - trial_manage
    - subscription_manage
  capabilities:
    - id: "tenant_register"
      emitter: "fastapi, nestjs, react, angular"
    - id: "tenant_verify"
      emitter: "fastapi, nestjs, react, angular"
    - id: "trial_manage"
      emitter: "fastapi, nestjs, react, angular"
    - id: "subscription_manage"
      emitter: "fastapi, nestjs, react, angular"
  definitions:
    - name: "SubscriptionPlan"
      description: "Enum các bậc gói subscription (free, starter, professional, enterprise)"
    - name: "RegistrationStatus"
      description: "Enum trạng thái đăng ký (pending, verified, rejected, cancelled)"
    - name: "SubscriptionStatus"
      description: "Enum trạng thái subscription (trial, active, past_due, cancelled, expired)"
    - name: "BillingCycle"
      description: "Enum chu kỳ thanh toán (monthly, yearly)"
    - name: "TenantRegistration"
      description: "Entity đăng ký tenant mới"
    - name: "TenantSubscription"
      description: "Entity quản lý subscription"
    - name: "OnboardingIR"
      description: "Intermediate Representation cho CP36"
  recipes:
    - name: "self_service_saas_recipe"
      description: "Self-service SaaS: email verify auto, trial 14 ngày, self-serve"
    - name: "enterprise_b2b_recipe"
      description: "Enterprise B2B: admin approve required, no trial, sales-led"
  obligations:
    - name: "RegistrationVerification"
      description: "Mọi đăng ký tenant phải được xác minh trước khi cấp quyền truy cập"
    - name: "TrialExpiration"
      description: "Trial period phải có ngày hết hạn rõ ràng và không thể vô hạn"
