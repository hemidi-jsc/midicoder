pack:
  id: "CP16"
  name: "API & System Monitoring Generator"
  internal_id: "cp16_monitoring"
  version: "1.0.0"
  status: "stable"
  category: "observability"
  depends_on: ["CP15"]
  definitions_count: 3
  obligations_count: 1
  error_codes:
    prefix: "MDC-CP16"
    range: "MDC-CP16-001 to MDC-CP16-010"
  capabilities_provided:
    - dashboard_create
    - alert_define
    - sli_monitor
  capabilities:
    - id: "dashboard"
      emitter: "fastapi, nestjs"
    - id: "alert_engine"
      emitter: "fastapi, nestjs"
    - id: "sli_tracker"
      emitter: "fastapi, nestjs"
  definitions:
    - name: "DashboardProfile"
      description: "Dashboard layout, widgets, and data sources"
    - name: "AlertRule"
      description: "Threshold-based alert with notification channel"
    - name: "SLIDefinition"
      description: "Service Level Indicator with target and measurement"
  obligations:
    - name: "AlertNotification"
      description: "Alerts must route to configured notification channels"
  file_contributions:
    infrastructure:
      - path: "app/monitoring/monitoring_service.py"
        file_type: "monitoring_service"
        template: "cp16_monitoring/monitoring_service.py.jinja2"
        stacks: ["fastapi", "nestjs"]
        pack_emitter: null
      - path: "app/monitoring/monitoring_router.py"
        file_type: "monitoring_router"
        template: "cp16_monitoring/monitoring_router.py.jinja2"
        stacks: ["fastapi"]
        pack_emitter: null
      - path: "src/monitoring/monitoring.module.ts"
        file_type: "monitoring_module"
        template: "cp16_monitoring/monitoring.module.ts.jinja2"
        stacks: ["nestjs"]
        pack_emitter: null
      - path: "src/monitoring/monitoring.service.ts"
        file_type: "monitoring_service"
        template: "cp16_monitoring/monitoring.service.ts.jinja2"
        stacks: ["nestjs"]
        pack_emitter: null
      - path: "src/monitoring/monitoring.controller.ts"
        file_type: "monitoring_controller"
        template: "cp16_monitoring/monitoring.controller.ts.jinja2"
        stacks: ["nestjs"]
        pack_emitter: null
      - path: "src/app/shared/components/alert-panel/alert-panel.component.ts"
        file_type: "alert_component"
        template: "cp16_monitoring/alert_panel.component.ts.jinja2"
        stacks: ["angular"]
        pack_emitter: null
      - path: "src/app/shared/components/dashboard-widget/dashboard-widget.component.ts"
        file_type: "dashboard_component"
        template: "cp16_monitoring/dashboard_widget.component.ts.jinja2"
        stacks: ["angular"]
        pack_emitter: null
      - path: "src/monitoring/AlertBanner.tsx"
        file_type: "alert_component"
        template: "cp16_monitoring/AlertBanner.tsx.jinja2"
        stacks: ["react"]
        pack_emitter: null
      - path: "src/monitoring/DashboardPanel.tsx"
        file_type: "dashboard_component"
        template: "cp16_monitoring/DashboardPanel.tsx.jinja2"
        stacks: ["react"]
        pack_emitter: null
      - path: "src/monitoring/types.ts"
        file_type: "monitoring_types"
        template: "cp16_monitoring/types.ts.jinja2"
        stacks: ["react"]
        pack_emitter: null
  frontend_integration:
    angular:
      - DashboardWidget
      - AlertPanel
    react:
      - DashboardPanel
      - AlertBanner
