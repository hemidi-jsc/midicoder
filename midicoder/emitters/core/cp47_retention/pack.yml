# ===========================================================================
# CP47 — Data Retention & Lifecycle Management
# ===========================================================================
# File contributions declaration cho 4 stacks: FastAPI, NestJS, Angular, React
#
# Capabilities:
# - retention_policy: Quản lý retention policies (CRUD, status, exemptions)
# - data_archival: Archive records sang cold storage với restore
# - data_purge: Xóa records theo policy (soft/hard delete)
# - gdpr_erasure: Yêu cầu xóa dữ liệu PII (GDPR Right to Erasure)
#
# Storage: SQLite + Cold Storage (separate table/storage)
# ===========================================================================

pack:
  id: "CP47"
  name: "Data Retention & Lifecycle Management"
  internal_id: "cp47_retention"
  version: "1.0.0"
  status: "stable"
  category: "compliance"
  depends_on: ["CP01", "CP08", "CP13", "CP14"]
  definitions_count: 4
  obligations_count: 2
  error_codes:
    prefix: "MDC-CP47"
    range: "MDC-CP47-001 to MDC-CP47-010"
  capabilities_provided:
    - retention_policy
    - data_archival
    - data_purge
    - gdpr_erasure
  capabilities:
    - id: "retention_policy"
      emitter: "fastapi, nestjs, angular, react"
    - id: "data_archival"
      emitter: "fastapi, nestjs"
    - id: "data_purge"
      emitter: "fastapi, nestjs"
    - id: "gdpr_erasure"
      emitter: "fastapi, nestjs, angular, react"
  definitions:
    - name: "RetentionPolicy"
      description: "Chính sách retention cho entity type (time/event/status based)"
    - name: "ArchivedRecord"
      description: "Record đã archive sang cold storage với snapshot"
    - name: "ErasureRequest"
      description: "Yêu cầu xóa dữ liệu PII (GDPR Right to Erasure)"
    - name: "RetentionEngine"
      description: "Engine xử lý retention operations (policy, archive, purge, erasure)"
  obligations:
    - name: "AuditTrail"
      description: "Ghi audit log cho mọi retention/archival/purge/erasure action (CP14 integration)"
    - name: "ExemptionProtection"
      description: "Audit records (CP14) và version history (CP43) không bị purge"
  file_contributions:
    infrastructure:
      # ------------------------------------------------------------------
      # FastAPI — Backend
      # ------------------------------------------------------------------
      - path: "app/models/retention_models.py"
        file_type: "retention_models"
        template: "cp47_retention/retention_models.py.jinja2"
        stacks: ["fastapi"]
        pack_emitter: null
        context_keys: ["policies"]
      - path: "app/schemas/retention_schemas.py"
        file_type: "retention_schemas"
        template: "cp47_retention/retention_schemas.py.jinja2"
        stacks: ["fastapi"]
        pack_emitter: null
        context_keys: ["policies"]
      - path: "app/services/retention_service.py"
        file_type: "retention_service"
        template: "cp47_retention/retention_service.py.jinja2"
        stacks: ["fastapi"]
        pack_emitter: null
        context_keys: ["policies", "enable_archival", "enable_purge", "enable_erasure"]
      - path: "app/api/retention_router.py"
        file_type: "retention_router"
        template: "cp47_retention/retention_router.py.jinja2"
        stacks: ["fastapi"]
        pack_emitter: null
        context_keys: []
      - path: "app/api/retention_webhook.py"
