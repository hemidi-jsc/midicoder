pack:
  id: "CP20"
  name: "API Client & Integration Generator"
  internal_id: "cp20_api_client"
  version: "1.0.0"
  status: "stable"
  category: "frontend"
  depends_on: ["CP06", "CP18"]
  definitions_count: 3
  obligations_count: 3
  error_codes:
    prefix: "MDC-CP20"
    range: "MDC-CP20-001 to MDC-CP20-005"
  capabilities_provided:
    - api_client_generate
    - realtime_bridge
    - openapi_bind
  capabilities:
    - id: "typed_client"
      emitter: "angular, react"
    - id: "websocket_bridge"
      emitter: "angular, react"
    - id: "sse_bridge"
      emitter: "angular, react"
    - id: "openapi_binding"
      emitter: "angular, react, fastapi, nestjs"
  definitions:
    - name: "ApiSpec"
      description: "API specification with endpoints and types"
    - name: "ClientBinding"
      description: "Binding between backend routes and frontend client methods"
    - name: "RealtimeBridgeSpec"
      description: "WebSocket/SSE bridge configuration"
  obligations:
    - name: "TypeSafety"
      description: "Client types must match backend route types exactly"
    - name: "ErrorMapping"
      description: "Backend errors must be mapped to client-side error types"
    - name: "AuthInjection"
      description: "Each request must automatically attach auth token"
  frontend_integration:
    angular:
      - ApiClientService
      - RealtimeBridgeService
      - OpenApiBindModule
    react:
      - useApiClient
      - useRealtime
      - ApiTypes
