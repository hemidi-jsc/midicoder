# ===========================================================================
# CP42 — Approval Workflow Engine
# ===========================================================================
# File contributions declaration cho 4 stacks: FastAPI, NestJS, Angular, React
#
# Capabilities:
# - approval_chain: Chuỗi phê duyệt đa cấp với multi-level approvers
# - approval_matrix: Ma trận phê duyệt dựa trên role, department, threshold
# - delegation: Giao quyền phê duyệt cho người khác
# - escalation: Tự động nâng cấp khi timeout hoặc từ chối
#
# Storage: SQLite + Redis pub/sub
# ===========================================================================

pack:
  id: "CP42"
  name: "Approval Workflow Engine"
  internal_id: "cp42_approval"
  version: "1.0.0"
  status: "stable"
  category: "runtime"
  depends_on: ["CP01", "CP04", "CP05", "CP12", "CP13"]
  definitions_count: 4
  obligations_count: 2
  error_codes:
    prefix: "MDC-CP42"
    range: "MDC-CP42-001 to MDC-CP42-010"
  capabilities_provided:
    - approval_chain
    - approval_matrix
    - delegation
    - escalation
  capabilities:
    - id: "approval_chain"
      emitter: "fastapi, nestjs, angular, react"
    - id: "approval_matrix"
      emitter: "fastapi, nestjs, angular, react"
    - id: "delegation"
      emitter: "fastapi, nestjs, angular, react"
    - id: "escalation"
      emitter: "fastapi, nestjs, angular, react"
  definitions:
    - name: "ApprovalRequest"
      description: "Yêu cầu phê duyệt với multi-level chain"
    - name: "ApprovalStep"
      description: "Bước phê duyệt với approver và deadline"
    - name: "EscalationRule"
      description: "Quy tắc tự động nâng cấp khi timeout"
    - name: "DelegationRecord"
      description: "Ghi chép giao quyền phê duyệt"
  obligations:
    - name: "RBACValidation"
      description: "Kiểm tra role trước khi quyết định phê duyệt"
    - name: "AuditTrail"
      description: "Ghi log mọi quyết định phê duyệt"
  file_contributions:
    infrastructure:
      # ------------------------------------------------------------------
      # FastAPI — Backend
      # ------------------------------------------------------------------
      - path: "app/approval/models.py"
        file_type: "approval_models"
        template: "cp42_approval/approval_models.py.jinja2"
        stacks: ["fastapi"]
        pack_emitter: null
        context_keys: ["approval_requests", "approval_types"]
      - path: "app/approval/schemas.py"
