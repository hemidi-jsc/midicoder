pack:
  id: "CP07"
  name: "Infrastructure as Code Generator"
  internal_id: "cp07_iac"
  version: "1.0.0"
  status: "stable"
  category: "infrastructure"
  depends_on: []
  definitions_count: 2
  obligations_count: 1
  error_codes:
    prefix: "MDC-CP07"
    range: "MDC-CP07-001 to MDC-CP07-005"
  capabilities_provided:
    - emit_iac_docker
    - emit_iac_aws
  capabilities:
    - id: "docker_compose"
      emitter: "fastapi, nestjs"
    - id: "terraform_aws"
      emitter: "fastapi, nestjs"
  definitions:
    - name: "IacProfile"
      description: "Infrastructure profile (local/docker, aws, gcp)"
    - name: "ServiceConfig"
      description: "Service-specific infrastructure configuration"
  obligations:
    - name: "EnvParity"
      description: "Local and production infrastructure must maintain parity"
  file_contributions:
    infrastructure:
      - path: "docker-compose.yml"
        file_type: "docker_compose"
        template: "cp07_iac/docker-compose.yml.jinja2"
        stacks: ["fastapi"]
        pack_emitter: null
      - path: "Dockerfile.api"
        file_type: "dockerfile"
        template: "cp07_iac/Dockerfile.api.jinja2"
        stacks: ["fastapi", "nestjs"]
        pack_emitter: null
