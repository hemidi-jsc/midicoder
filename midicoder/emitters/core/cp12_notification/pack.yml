pack:
  id: "CP12"
  name: "Notification & Communication Generator"
  internal_id: "cp12_notification"
  version: "1.0.0"
  status: "stable"
  category: "communication"
  depends_on: ["CP05"]
  definitions_count: 8
  obligations_count: 4
  error_codes:
    prefix: "MDC-CP12"
    range: "MDC-CP12-001 to MDC-CP12-007"
  capabilities_provided:
    - send_notification
    - email_dispatch
    - sms_dispatch
    - push_notification
    - webhook_dispatch
    - chat_integration
  capabilities:
    - id: "email"
      emitter: "fastapi, nestjs"
    - id: "sms"
      emitter: "fastapi, nestjs"
    - id: "push"
      emitter: "fastapi, nestjs, angular, react"
    - id: "template_engine"
      emitter: "fastapi, nestjs"
    - id: "webhook"
      emitter: "fastapi, nestjs"
    - id: "chat_integration"
      emitter: "fastapi, nestjs"
  definitions:
    - name: "NotificationChannel"
      description: "Channel type: email, sms, push, in_app"
    - name: "NotificationTemplate"
      description: "Parameterized message template per channel"
    - name: "DispatchConfig"
      description: "Routing and retry settings for notification delivery"
    - name: "WebhookConfig"
      description: "Webhook channel with auth, retry, payload template"
    - name: "WebhookDelivery"
      description: "Webhook delivery record with attempts and response tracking"
    - name: "ChatIntegrationConfig"
      description: "Slack, Teams, Discord, MS Teams, Webex integration"
    - name: "ChatPlatform"
      description: "Chat platform enum (slack, teams, discord, msteams, webex)"
    - name: "WebhookAuthType"
      description: "Webhook auth (none, basic, bearer, hmac)"
  obligations:
    - name: "TemplateValidation"
      description: "Notification templates must have required variables"
    - name: "FallbackChannel"
      description: "Failed dispatch must retry on fallback channel"
    - name: "WebhookReliability"
      description: "Webhook deliveries must retry with backoff on failure"
    - name: "ChatSecurity"
      description: "Chat bot tokens must be stored securely, never in source code"
  file_contributions:
    infrastructure:
      - path: "app/notifications/email_service.py"
        file_type: "email_service"
        template: "cp12_notification/email_service.py.jinja2"
        stacks: ["fastapi", "nestjs"]
        pack_emitter: null
      - path: "app/notifications/notification_service.py"
        file_type: "notification_service"
        template: "cp12_notification/notification_service.py.jinja2"
        stacks: ["fastapi"]
        pack_emitter: null
      - path: "src/notifications/email.service.ts"
        file_type: "email_service"
        template: "cp12_notification/email.service.ts.jinja2"
        stacks: ["nestjs"]
        pack_emitter: null
      - path: "src/notifications/notification.module.ts"
        file_type: "notification_module"
        template: "cp12_notification/notification.module.ts.jinja2"
        stacks: ["nestjs"]
        pack_emitter: null
      - path: "src/app/core/notification/notification.service.ts"
        file_type: "notification_service"
        template: "cp12_notification/notification.service.ts.jinja2"
        stacks: ["angular"]
        pack_emitter: null
      - path: "src/app/shared/components/notification-toast/notification-toast.component.ts"
        file_type: "notification_component"
        template: "cp12_notification/notification-toast.component.ts.jinja2"
        stacks: ["angular"]
        pack_emitter: null
      - path: "src/notifications/NotificationContext.tsx"
        file_type: "notification_context"
        template: "cp12_notification/NotificationContext.tsx.jinja2"
        stacks: ["react"]
        pack_emitter: null
      - path: "src/notifications/useNotification.ts"
        file_type: "notification_hook"
        template: "cp12_notification/useNotification.ts.jinja2"
        stacks: ["react"]
        pack_emitter: null
      - path: "src/notifications/types.ts"
        file_type: "notification_types"
        template: "cp12_notification/types.ts.jinja2"
        stacks: ["react"]
        pack_emitter: null
  frontend_integration:
    angular:
      - NotificationService
      - NotificationToastComponent
    react:
      - useNotification
      - NotificationContext
