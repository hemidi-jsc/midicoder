pack:
  id: "CP12"
  name: "Notification & Communication Generator"
  internal_id: "cp12_notification"
  version: "2.0.0"
  status: "stable"
  category: "communication"
  depends_on: ["CP05"]
  definitions_count: 15
  obligations_count: 6
  error_codes:
    prefix: "MDC-CP12"
    range: "MDC-CP12-001 to MDC-CP12-007"
  scope_note: >
    CP12 treats webhook as one notification delivery channel among many
    (email, sms, push, in-app). It provides a simple "send payload to URL"
    service for notification dispatch only.
    For webhook subscription management, event-driven dispatch, retry
    policies with queue workers, tenant isolation, and dashboard UI —
    use CP40 (Webhook & Outbound Integration Hub).
    In short: CP12 = notification channels; CP40 = webhook event hub.
  capabilities_provided:
    - send_notification
    - email_dispatch
    - sms_dispatch
    - push_notification
    - delivery_tracking
    - ab_testing
  capabilities:
    - id: "email"
      emitter: "fastapi, nestjs"
    - id: "sms"
      emitter: "fastapi, nestjs"
    - id: "push"
      emitter: "fastapi, nestjs, angular, react"
    - id: "template_engine"
      emitter: "fastapi, nestjs"
    # NOTE: webhook here is a notification delivery channel (simple send-to-URL),
    # NOT the full webhook hub. For subscription management, event-driven dispatch,
    # retry queues, and dashboard — use CP40 (Webhook & Outbound Integration Hub).
    - id: "webhook"
      emitter: "fastapi, nestjs"
    - id: "delivery_tracking"
      emitter: "fastapi, nestjs"
    - id: "ab_testing"
      emitter: "fastapi, nestjs"
  definitions:
    - name: "NotificationChannel"
      description: "Channel type: email, sms, push, in_app, webhook"
    - name: "NotificationTemplate"
      description: "Parameterized message template per channel"
    - name: "DispatchConfig"
      description: "Routing and retry settings for notification delivery"
    # Webhook definitions below are for notification-channel dispatch only.
    # For subscription/event-driven webhook hub, see CP40.
    - name: "WebhookConfig"
      description: "Webhook channel with auth, retry, payload template"
    - name: "WebhookDelivery"
      description: "Webhook delivery record with attempts and response tracking"
    - name: "ChatIntegrationConfig"
      description: "Slack, Teams, Discord, MS Teams, Webex integration"
    - name: "ChatPlatform"
      description: "Chat platform enum (slack, teams, discord, msteams, webex)"
    - name: "WebhookAuthType"
      description: "Webhook auth (none, basic, bearer, hmac)"
    - name: "DeliveryStatus"
      description: "Delivery status enum (pending, sent, delivered, failed, bounced, opened, clicked)"
    - name: "DeliveryAttempt"
      description: "Single delivery attempt record"
    - name: "DeliveryTracking"
      description: "End-to-end delivery tracking with lifecycle events"
    - name: "ABTestVariant"
      description: "A/B test variant with weight"
    - name: "ABTestConfig"
      description: "A/B test configuration with multiple variants"
    - name: "TwilioSmsGateway"
      description: "Twilio SMS provider with signature verification"
    - name: "WebhookGatewayImpl"
      description: "HTTP webhook provider with auth and retry"
  obligations:
    - name: "TemplateValidation"
      description: "Notification templates must have required variables"
    - name: "FallbackChannel"
      description: "Failed dispatch must retry on fallback channel"
    # NOTE: WebhookReliability here covers notification-channel dispatch only.
    # For full retry policies with queue workers, see CP40.
    - name: "WebhookReliability"
      description: "Webhook deliveries must retry with backoff on failure"
    - name: "ChatSecurity"
      description: "Chat bot tokens must be stored securely, never in source code"
    - name: "DeliveryTracking"
      description: "All dispatches must have tracking records"
    - name: "ABTestIntegrity"
      description: "A/B test variants must sum to 100% weight"
  file_contributions:
    infrastructure:
      # FastAPI backend
      - path: "app/notifications/email_service.py"
        file_type: "email_service"
        template: "cp12_notification/email_service.py.jinja2"
        stacks: ["fastapi"]
        pack_emitter: null
      - path: "app/notifications/notification_service.py"
        file_type: "notification_service"
        template: "cp12_notification/notification_service.py.jinja2"
        stacks: ["fastapi"]
        pack_emitter: null
      - path: "app/notifications/webhook_service.py"
        file_type: "webhook_service"
        template: "cp12_notification/webhook_service.py.jinja2"
        stacks: ["fastapi"]
        pack_emitter: null
      - path: "app/notifications/delivery_tracker.py"
        file_type: "delivery_tracker"
        template: "cp12_notification/delivery_tracker.py.jinja2"
        stacks: ["fastapi"]
        pack_emitter: null
      # NestJS backend
      - path: "src/notifications/email.service.ts"
        file_type: "email_service"
        template: "cp12_notification/email.service.ts.jinja2"
        stacks: ["nestjs"]
        pack_emitter: null
      - path: "src/notifications/notification.module.ts"
        file_type: "notification_module"
        template: "cp12_notification/notification.module.ts.jinja2"
        stacks: ["nestjs"]
        pack_emitter: null
      - path: "src/notifications/webhook.service.ts"
        file_type: "webhook_service"
        template: "cp12_notification/webhook.service.ts.jinja2"
        stacks: ["nestjs"]
        pack_emitter: null
      - path: "src/notifications/delivery-tracker.service.ts"
        file_type: "delivery_tracker"
        template: "cp12_notification/delivery-tracker.service.ts.jinja2"
        stacks: ["nestjs"]
        pack_emitter: null
      # Angular frontend
      - path: "src/app/core/notification/notification.service.ts"
        file_type: "notification_service"
        template: "cp12_notification/notification.service.ts.jinja2"
        stacks: ["angular"]
        pack_emitter: null
      - path: "src/app/shared/components/notification-toast/notification-toast.component.ts"
        file_type: "notification_component"
        template: "cp12_notification/notification-toast.component.ts.jinja2"
        stacks: ["angular"]
        pack_emitter: null
      - path: "src/app/core/notification/types.ts"
        file_type: "notification_types"
        template: "cp12_notification/types.ts.jinja2"
        stacks: ["angular"]
        pack_emitter: null
      # React frontend
      - path: "src/notifications/NotificationContext.tsx"
        file_type: "notification_context"
        template: "cp12_notification/NotificationContext.tsx.jinja2"
        stacks: ["react"]
        pack_emitter: null
      - path: "src/notifications/useNotification.ts"
        file_type: "notification_hook"
        template: "cp12_notification/useNotification.ts.jinja2"
        stacks: ["react"]
        pack_emitter: null
      - path: "src/notifications/types.ts"
        file_type: "notification_types"
        template: "cp12_notification/types.ts.jinja2"
        stacks: ["react"]
        pack_emitter: null
  frontend_integration:
    angular:
      - NotificationService
      - NotificationToastComponent
      - NotificationTypes
    react:
      - useNotification
      - NotificationContext
      - NotificationTypes
