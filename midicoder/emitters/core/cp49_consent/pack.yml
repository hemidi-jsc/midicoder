# ===========================================================================
# CP49 — Consent & Preference Management
# ===========================================================================
# File contributions declaration cho 4 stacks: FastAPI, NestJS, Angular, React
#
# Capabilities:
# - cookie_consent: Quản lý đồng ý cookie của user
# - data_consent: Quản lý đồng ý xử lý dữ liệu
# - comm_preference: Sở thích truyền thông marketing
# - privacy_center: Trung tâm quyền riêng tư
# - marketing_opt_out: Từ chối marketing
#
# Lưu ý: gdpr_erasure delegate đến CP47 (Data Retention & Lifecycle Management)
#
# Storage: SQLite + Redis pub/sub
# ===========================================================================

pack:
  id: "CP49"
  name: "Consent & Preference Management"
  internal_id: "cp49_consent"
  version: "1.0.0"
  status: "stable"
  category: "privacy"
  depends_on: ["CP01", "CP02", "CP03", "CP14", "CP47"]
  definitions_count: 4
  obligations_count: 2
  error_codes:
    prefix: "MDC-CP49"
    range: "MDC-CP49-001 to MDC-CP49-008"
  capabilities_provided:
    - cookie_consent
    - data_consent
    - comm_preference
    - privacy_center
    - preference_center
    - marketing_opt_out
  capabilities:
    - id: "cookie_consent"
      emitter: "fastapi, nestjs, angular, react"
    - id: "data_consent"
      emitter: "fastapi, nestjs, angular, react"
    - id: "comm_preference"
      emitter: "fastapi, nestjs, angular, react"
    - id: "privacy_center"
      emitter: "angular, react"
    - id: "preference_center"
      emitter: "angular, react"
    - id: "marketing_opt_out"
      emitter: "fastapi, nestjs, angular, react"
  definitions:
    - name: "ConsentRecord"
      description: "Bản ghi consent của user"
    - name: "ConsentPolicy"
      description: "Chính sách consent của tenant"
    - name: "CookiePreference"
      description: "Sở thích cookie của user"
    - name: "CommunicationPreference"
      description: "Sở thích truyền thông của user"
  obligations:
    - name: "AuditTrail"
      description: "Ghi audit log cho mọi consent action (CP14)"
    - name: "TenantIsolation"
      description: "Tất cả consent records enforce tenant scope"
  file_contributions:
    infrastructure:
      # ------------------------------------------------------------------
      # FastAPI — Backend
      # ------------------------------------------------------------------
      - path: "app/consent/models.py"
        file_type: "consent_models"
        template: "cp49_consent/consent_models.py.jinja2"
        stacks: ["fastapi"]
        pack_emitter: null
        context_keys: ["consent_policies", "consent_records"]
      - path: "app/consent/schemas.py"
        file_type: "consent_schemas"
        template: "cp49_consent/consent_schemas.py.jinja2"
        stacks: ["fastapi"]
        pack_emitter: null
        context_keys: ["consent_policies"]
      - path: "app/consent/services/consent_service.py"
        file_type: "consent_service"
        template: "cp49_consent/consent_service.py.jinja2"
        stacks: ["fastapi"]
        pack_emitter: null
        context_keys: ["consent_policies", "consent_records"]
      - path: "app/consent/routers/consent_router.py"
