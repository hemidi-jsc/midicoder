# Pack Definition — CP31: Scheduler & Cron Engine
#
# Pack này cung cấp scheduling intelligence: cron expression parser,
# calendar/holiday engine, timezone-aware scheduling.
#
# Boundary: CP13 = job execution, CP31 = khi nào chạy

pack:
  id: "CP31"
  name: "Scheduler & Cron Engine"
  internal_id: "cp31_scheduler"
  version: "1.0.0"
  phase: "P1"
  depends_on:
    - "CP05"
    - "CP13"
    - "CP14"

capabilities_provided:
  - "cron_schedule"
  - "recurring_job"
  - "calendar_schedule"

file_contributions:
  infrastructure:
    # FastAPI
    - path: "app/scheduler/cron_parser.py"
      file_type: "scheduler"
      template: "cp31_scheduler/cron_parser.py.jinja2"
      stacks: ["fastapi"]
      pack_emitter: null
      context_keys: ["schedules"]

    - path: "app/scheduler/calendar_engine.py"
      file_type: "scheduler"
      template: "cp31_scheduler/calendar_engine.py.jinja2"
      stacks: ["fastapi"]
      pack_emitter: null
      context_keys: ["schedules"]

    - path: "app/scheduler/scheduler_service.py"
      file_type: "scheduler"
      template: "cp31_scheduler/scheduler_service.py.jinja2"
      stacks: ["fastapi"]
      pack_emitter: null
      context_keys: ["schedules"]

    - path: "app/scheduler/scheduler_router.py"
      file_type: "scheduler"
      template: "cp31_scheduler/scheduler_router.py.jinja2"
      stacks: ["fastapi"]
      pack_emitter: null
      context_keys: ["schedules"]

    # NestJS
    - path: "src/scheduler/cron-parser.service.ts"
      file_type: "scheduler"
      template: "cp31_scheduler/cron-parser.service.ts.jinja2"
      stacks: ["nestjs"]
      pack_emitter: null
      context_keys: ["schedules"]

    - path: "src/scheduler/calendar-engine.service.ts"
      file_type: "scheduler"
      template: "cp31_scheduler/calendar-engine.service.ts.jinja2"
      stacks: ["nestjs"]
      pack_emitter: null
      context_keys: ["schedules"]

    - path: "src/scheduler/scheduler.service.ts"
      file_type: "scheduler"
      template: "cp31_scheduler/scheduler.service.ts.jinja2"
      stacks: ["nestjs"]
      pack_emitter: null
      context_keys: ["schedules"]

    - path: "src/scheduler/scheduler.controller.ts"
      file_type: "scheduler"
      template: "cp31_scheduler/scheduler.controller.ts.jinja2"
      stacks: ["nestjs"]
      pack_emitter: null
      context_keys: ["schedules"]
