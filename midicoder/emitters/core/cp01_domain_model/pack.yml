pack:
  id: "CP01"
  name: "Domain Model DSL & IR Builder"
  internal_id: "cp01_domain_model"
  version: "1.0.0"
  status: "stable"
  category: "domain-modeling"
  depends_on: []
  definitions_count: 6
  obligations_count: 2
  error_codes:
    prefix: "MDC-CP01"
    range: "MDC-CP01-001 to MDC-CP01-005"
  capabilities_provided:
    - dsl_parsing
    - projection_tree_build
    - ir_build
  capabilities:
    - id: "entity_modeling"
      emitter: "fastapi, nestjs"
    - id: "command_query_separation"
      emitter: "fastapi, nestjs"
    - id: "value_object"
      emitter: "fastapi, nestjs"
  definitions:
    - name: "Entity"
      description: "Core domain entity with identity and lifecycle"
    - name: "Command"
      description: "Intent-carrying operation with validation and guards"
    - name: "Query"
      description: "Read-side operation with pagination and projection"
    - name: "ValueObject"
      description: "Immutable, equality-by-value domain primitive"
    - name: "AggregateRoot"
      description: "Consistency boundary for entity clusters"
    - name: "DomainEvent"
      description: "Immutable record of something that happened"
  obligations:
    - name: "EntityIdentity"
      description: "Every entity must have unique, non-null identifier"
    - name: "CommandValidation"
      description: "All commands must be validated before execution"
