pack:
  id: "CP01"
  name: "Domain Model DSL & IR Builder"
  internal_id: "cp01_domain_model"
  version: "1.0.0"
  status: "stable"
  category: "domain-modeling"
  depends_on: []
  definitions_count: 14
  obligations_count: 4
  recipes_count: 10
  error_codes:
    prefix: "MDC-CP01"
    range: "MDC-CP01-001 to MDC-CP01-099"
  capabilities_provided:
    - dsl_parsing
    - projection_tree_build
    - ir_build
    - domain_model_recipes
    - cqrs_recipes
    - event_sourcing_recipes
  capabilities:
    - id: "entity_modeling"
      emitter: "fastapi, nestjs"
    - id: "command_query_separation"
      emitter: "fastapi, nestjs"
    - id: "value_object"
      emitter: "fastapi, nestjs"
    - id: "aggregate_root"
      emitter: "fastapi, nestjs"
    - id: "domain_events"
      emitter: "fastapi, nestjs"
    - id: "cqrs_projection"
      emitter: "fastapi, nestjs"
    - id: "event_sourcing"
      emitter: "fastapi, nestjs"
    - id: "temporal_entity"
      emitter: "fastapi, nestjs"
    - id: "polymorphic_entity"
      emitter: "fastapi, nestjs"
    - id: "saga"
      emitter: "fastapi, nestjs"
    - id: "recipes"
      emitter: "fastapi, nestjs"
  definitions:
    - name: "Entity"
      description: "Core domain entity with identity and lifecycle"
    - name: "Command"
      description: "Intent-carrying operation with validation and guards"
    - name: "Query"
      description: "Read-side operation with pagination and projection"
    - name: "ValueObject"
      description: "Immutable, equality-by-value domain primitive"
    - name: "AggregateRoot"
      description: "Consistency boundary for entity clusters"
    - name: "DomainEvent"
      description: "Immutable record of something that happened"
    - name: "Projection"
      description: "CQRS read model derived from domain events"
    - name: "EventSourcedAggregate"
      description: "Aggregate that reconstructs state from event log"
    - name: "TemporalEntity"
      description: "Entity with valid-from/valid-to time-bounded state"
    - name: "PolymorphicEntity"
      description: "Entity with subtype inheritance (STI/CTI/JTI)"
    - name: "Saga"
      description: "Long-running transaction across multiple aggregates"
    - name: "SagaStep"
      description: "Individual step with compensating action in saga"
    - name: "AggregationQuery"
      description: "Query with group-by, having, and aggregate functions"
    - name: "FilterGroup"
      description: "Nested filter expressions with AND/OR logic"
  recipes:
    - name: "SimpleEntityRecipe"
      description: "CRUD entity with UUID, tenant_id, timestamps, lifecycle hooks"
    - name: "AggregateRootRecipe"
      description: "Consistency boundary with strict eventual relaxed options"
    - name: "TemporalEntityRecipe"
      description: "SCD Type 2 with valid_from/valid_to, range query index"
    - name: "CQRSCommandRecipe"
      description: "Write operation with auth + tenant guards + transaction"
    - name: "CQRSQueryRecipe"
      description: "Read operation with auth + tenant guards + pagination + sort"
    - name: "EventSourcedAggregateRecipe"
      description: "Event-sourced aggregate with snapshot strategy + versioned OCC"
    - name: "SagaRecipe"
      description: "Long-running transaction with compensating steps (orchestration)"
    - name: "PolymorphicEntityRecipe"
      description: "Subtype inheritance with discriminator column (STI/CTI/JTI)"
    - name: "ProjectionRecipe"
      description: "CQRS read model subscribing to domain events"
    - name: "ValueObjectRecipe"
      description: "Immutable, equality-by-value domain primitive"
  obligations:
    - name: "EntityIdentity"
      description: "Every entity must have unique, non-null identifier"
    - name: "CommandValidation"
      description: "All commands must be validated before execution"
    - name: "AggregateBoundary"
      description: "Only aggregate root may be accessed directly from outside"
    - name: "EventImmutability"
      description: "Domain events must be immutable once emitted"
  file_contributions:
    infrastructure:
      - path: "app/models/__init__.py"
        file_type: "init"
        template: "cp01_domain_model/__init__.py.jinja2"
        stacks: ["fastapi"]
        pack_emitter: null
      - path: "src/domain/index.ts"
        file_type: "init"
        template: "cp01_domain_model/index.ts.jinja2"
        stacks: ["nestjs"]
        pack_emitter: null
      - path: "src/domain/commands/command.module.ts"
        file_type: "command_module"
        template: "cp01_domain_model/command.module.ts.jinja2"
        stacks: ["nestjs"]
        pack_emitter: null
    per_entity:
      - path_pattern: "app/models/{entity_snake}.py"
        file_type: "entity"
        template: "cp01_domain_model/entity.py.jinja2"
        stacks: ["fastapi"]
        pack_emitter: null
      - path_pattern: "src/entities/{entity_snake}.entity.ts"
        file_type: "entity"
        template: "cp01_domain_model/entity.ts.jinja2"
        stacks: ["nestjs"]
        pack_emitter: null
      - path_pattern: "app/commands/{command_snake}.py"
        file_type: "command"
        template: "cp01_domain_model/command.py.jinja2"
        stacks: ["fastapi"]
        pack_emitter: null
      - path_pattern: "app/commands/{command_snake}_handler.py"
        file_type: "command_handler"
        template: "cp01_domain_model/command_handler.py.jinja2"
        stacks: ["fastapi"]
        pack_emitter: null
      - path_pattern: "app/commands/{command_snake}_validator.py"
        file_type: "command_validator"
        template: "cp01_domain_model/command_validator.py.jinja2"
        stacks: ["fastapi"]
        pack_emitter: null
      - path_pattern: "app/commands/{command_snake}_guards.py"
        file_type: "command_guards"
        template: "cp01_domain_model/command_guards.py.jinja2"
        stacks: ["fastapi"]
        pack_emitter: null
      - path_pattern: "app/commands/{command_snake}_effects.py"
        file_type: "command_effects"
