        pack_emitter: null
      - path_pattern: "app/queries/{query_snake}_handler.py"
        file_type: "query_handler"
        template: "cp01_domain_model/query_handler.py.jinja2"
        stacks: ["fastapi"]
        pack_emitter: null
      - path_pattern: "app/queries/{query_snake}_validator.py"
        file_type: "query_validator"
        template: "cp01_domain_model/query_validator.py.jinja2"
