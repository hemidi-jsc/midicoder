pack:
  id: "CP27"
  name: "Plugin System Generator"
  internal_id: "cp27_plugin_system"
  version: "1.0.0"
  status: "stable"
  category: "extensibility"
  metadata:
    absorbed_packs:
      - "cp28_custom_code"
  depends_on: ["CP01"]
  definitions_count: 3
  obligations_count: 1
  error_codes:
    prefix: "MDC-CP27"
    range: "MDC-CP27-001 to MDC-CP27-018"
  capabilities_provided:
    - plugin_slot_define
    - plugin_contract
    - plugin_policy
    - custom_code_inject
    - hook_define
    - patch_apply
  capabilities:
    - id: "plugin_slot_define"
      emitter: "fastapi, nestjs, angular, react"
    - id: "plugin_contract"
      emitter: "fastapi, nestjs, angular, react"
    - id: "plugin_policy"
      emitter: "fastapi, nestjs"
    - id: "custom_code_inject"
      emitter: "fastapi, nestjs, angular, react"
    - id: "hook_define"
      emitter: "fastapi, nestjs, angular, react"
    - id: "patch_apply"
      emitter: "fastapi, nestjs, angular, react"
  definitions:
    - name: "PluginSlot"
      description: "Điểm móc nối lifecycle mà plugin có thể hook vào"
    - name: "PluginContract"
      description: "Interface/Protocol mà plugin bắt buộc phải implement"
    - name: "PluginPolicy"
      description: "Chính sách bảo mật và versioning cho plugin system"
  obligations:
    - name: "PluginIsolation"
      description: "Plugin crash không làm crash toàn bộ ứng dụng"
  file_contributions:
    infrastructure:
      # FastAPI
      - path: "app/plugins/__init__.py"
        file_type: "plugin_init"
        template: "cp27_plugin_system/__init__.py.jinja2"
        stacks: ["fastapi"]
        pack_emitter: null
        context_keys: []
      - path: "app/plugins/slots.py"
        file_type: "plugin_slots"
