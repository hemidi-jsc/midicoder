pack:
  id: "CP30"
  name: "AI-Assisted Development Generator"
  internal_id: "cp30_ai_assisted"
  version: "1.0.0"
  status: "stable"
  category: "ai-assisted"
  depends_on: ["CP01"]
  definitions_count: 3
  obligations_count: 2
  error_codes:
    prefix: "MDC-CP30"
    range: "MDC-CP30-001 to MDC-CP30-014"
  capabilities_provided:
    - ai_review
    - ai_suggest
    - prompt_template
  capabilities:
    - id: "ai_review"
      emitter: "fastapi, nestjs"
    - id: "ai_suggest"
      emitter: "fastapi, nestjs, angular, react"
    - id: "prompt_template"
      emitter: "fastapi, nestjs, angular, react"
  definitions:
    - name: "ReviewPolicy"
      description: "Chính sách AI code review với severity, category, và prompt template ref"
    - name: "PromptTemplate"
      description: "Template prompt AI với variables cho code review, suggestion, generation, testing"
    - name: "AIAssistantConfig"
      description: "Cấu hình tổng thể AI assistant (model, token, timeout, enabled policies)"
  obligations:
    - name: "ConfigDriven"
      description: "Không hardcode LLM provider hay API key — mọi thứ qua config file"
    - name: "Standalone"
      description: "Generated code không import module từ midicoder — fully self-contained"
  file_contributions:
    infrastructure:
      # FastAPI
      - path: "app/ai_assistant/__init__.py"
        file_type: "ai_assistant_init"
        template: "cp30_ai_assisted/__init__.py.jinja2"
        stacks: ["fastapi"]
        pack_emitter: null
        context_keys: []
      - path: "app/ai_assistant/models.py"
