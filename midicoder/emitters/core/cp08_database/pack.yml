pack:
  id: "CP08"
  name: "Database & Data Access Layer Generator"
  internal_id: "cp08_database"
  version: "1.2.0"
  status: "developing"
  category: "persistence"
  depends_on: ["CP01"]
  definitions_count: 24
  obligations_count: 3
  error_codes:
    prefix: "MDC-CP08"
    range: "MDC-CP08-001 to MDC-CP08-010"
  capabilities_provided:
    - create_record
    - update_record
    - delete_record
    - query_records
    - load_entity
    - begin_transaction
    - commit_transaction
  capabilities:
    - id: "datasource"
      emitter: "fastapi, nestjs"
    - id: "entity_generation"
      emitter: "fastapi, nestjs"
    - id: "repository_pattern"
      emitter: "fastapi, nestjs"
    - id: "migration"
      emitter: "fastapi, nestjs"
    - id: "spatial"
      emitter: "fastapi, nestjs"
    - id: "time_series"
      emitter: "fastapi, nestjs"
    - id: "cqrs_read_model"
      emitter: "fastapi, nestjs"
    - id: "distributed_transaction"
      emitter: "fastapi, nestjs"
    - id: "jsonb"
      emitter: "fastapi, nestjs"
  definitions:
    - name: "Datasource"
      description: "Database connection configuration and profile"
    - name: "ColumnDef"
      description: "Column type, constraints, and defaults"
    - name: "Repository"
      description: "CRUD interface over a data source"
    - name: "Transaction"
      description: "ACID transaction boundary"
    - name: "Migration"
      description: "Schema versioning and migration script"
    - name: "SpatialColumn"
      description: "Column for geospatial data (POINT, POLYGON, GEOMETRY)"
    - name: "SpatialIndex"
      description: "GiST/SP-GiST/BRIN index for spatial queries"
    - name: "TimeSeriesModel"
      description: "Partitioned model for time-series data with retention policy"
    - name: "ReadModel"
      description: "CQRS read model (materialized view, denormalized table, search index)"
    - name: "DistributedTransaction"
      description: "Cross-datasource transaction (2PC, saga, outbox, TCC)"
    - name: "JSONBColumn"
      description: "Binary JSON column with GIN indexing and schema validation"
    - name: "ReplicaConfig"
      description: "Read replica with weighted load balancing"
    - name: "RetentionPolicy"
      description: "Auto-cleanup policy for time-series data"
    - name: "DataModel"
      description: "Complete model with columns, relationships, indexes"
    - name: "DataModelCollection"
      description: "Collection of all models and datasources"
    - name: "Relationship"
      description: "Relationship between models (FK, back_ref, cascade)"
    - name: "IndexDef"
      description: "Index definition for columns"
    - name: "TransactionParticipant"
      description: "Participant in distributed transaction"
    - name: "JSONBIndex"
      description: "GIN/B-tree index on JSONB column"
    - name: "SpatialType"
      description: "Spatial data type enum (POINT, POLYGON, GEOMETRY, GEOGRAPHY)"
    - name: "SpatialIndexType"
      description: "Spatial index type enum (GIST, SPGIST, GIN, BRIN)"
    - name: "TimeSeriesGranularity"
      description: "Time-series granularity level (SECOND, MINUTE, HOUR, DAY, WEEK, MONTH)"
    - name: "RetentionPolicyType"
      description: "Retention policy type (TIME_BASED, COUNT_BASED, SIZE_BASED, PARTITION_BASED)"
    - name: "DistributedTxProtocol"
      description: "Distributed transaction protocol (TWO_PHASE_COMMIT, SAGA, OUTBOX, TCC)"
  obligations:
    - name: "TenantScope"
      description: "All queries must enforce tenant scope automatically"
    - name: "DistributedTxConsistency"
      description: "Distributed transactions must ensure eventual consistency across participants"
    - name: "SpatialSRID"
      description: "All spatial columns must declare explicit SRID (default: 4326 WGS84)"
  recipes:
    - name: "postgres_datasource"
      description: "PostgreSQL DataSource with asyncpg driver"
    - name: "mysql_datasource"
      description: "MySQL DataSource with aiomysql driver"
    - name: "time_series_model_from_entity"
      description: "Time-series model with default retention policy"
  file_contributions:
    infrastructure:
      - path: "app/database.py"
        file_type: "database"
        template: "cp08_database/database.py.jinja2"
        stacks: ["fastapi", "nestjs"]
        pack_emitter: null
      - path: "app/models/base_model.py"
        file_type: "base_model"
        template: "cp08_database/base_model.py.jinja2"
        stacks: ["fastapi", "nestjs"]
        pack_emitter: null
      - path: "app/repositories/base_repository.py"
        file_type: "base_repository"
        template: "cp08_database/base_repository.py.jinja2"
        stacks: ["fastapi"]
        pack_emitter: null
      - path: "app/models/audit_mixin.py"
        file_type: "audit_mixin"
        template: "cp08_database/audit_mixin.py.jinja2"
        stacks: ["fastapi"]
        pack_emitter: null
      - path: "app/models/tenant_mixin.py"
        file_type: "tenant_mixin"
        template: "cp08_database/tenant_mixin.py.jinja2"
        stacks: ["fastapi"]
        pack_emitter: null
      - path: "app/migrations/env.py"
        file_type: "migration_env"
        template: "cp08_database/migrations/env.py.jinja2"
        stacks: ["fastapi"]
        pack_emitter: null
      - path: "src/database/database.module.ts"
        file_type: "database_module"
        template: "cp08_database/database.module.ts.jinja2"
        stacks: ["nestjs"]
        pack_emitter: null
      - path: "src/database/base.entity.ts"
        file_type: "base_entity"
        template: "cp08_database/base.entity.ts.jinja2"
        stacks: ["nestjs"]
        pack_emitter: null
      - path: "src/database/base.repository.ts"
        file_type: "base_repository"
        template: "cp08_database/base.repository.ts.jinja2"
        stacks: ["nestjs"]
        pack_emitter: null
      - path: "src/database/audit.decorator.ts"
        file_type: "audit_decorator"
        template: "cp08_database/audit.decorator.ts.jinja2"
        stacks: ["nestjs"]
        pack_emitter: null
      - path: "src/database/tenant.decorators.ts"
        file_type: "tenant_decorator"
        template: "cp08_database/tenant.decorators.ts.jinja2"
        stacks: ["nestjs"]
        pack_emitter: null
    per_entity:
      - path_pattern: "app/repositories/{entity_snake}_repo.py"
        file_type: "repository"
        template: "cp08_database/repository.py.jinja2"
        stacks: ["fastapi", "nestjs"]
        pack_emitter: null
    advanced_capabilities:
      spatial:
        - path: "app/spatial/spatial_helpers.py"
          file_type: "spatial_helpers"
          template: "cp08_database/spatial_helpers.py.jinja2"
          stacks: ["fastapi"]
          pack_emitter: null
        - path: "app/spatial/spatial_indexes.py"
          file_type: "spatial_indexes"
          template: "cp08_database/spatial_indexes.py.jinja2"
          stacks: ["fastapi"]
          pack_emitter: null
        - path: "src/database/spatial.decorators.ts"
          file_type: "spatial_decorators"
          template: "cp08_database/spatial.decorators.ts.jinja2"
          stacks: ["nestjs"]
          pack_emitter: null
        - path: "src/database/migrations/spatial-indexes.ts"
          file_type: "spatial_index_migration"
          template: "cp08_database/spatial-indexes.ts.jinja2"
          stacks: ["nestjs"]
          pack_emitter: null
      time_series:
        - path_pattern: "app/time_series/{model_snake}.py"
          file_type: "time_series_model"
          template: "cp08_database/time_series_model.py.jinja2"
          stacks: ["fastapi"]
          pack_emitter: null
        - path_pattern: "src/entities/time_series/{model_kebab}.entity.ts"
          file_type: "time_series_entity"
          template: "cp08_database/time_series.entity.ts.jinja2"
          stacks: ["nestjs"]
          pack_emitter: null
      cqrs_read_model:
        - path_pattern: "app/read_models/{model_snake}.py"
          file_type: "read_model"
          template: "cp08_database/read_model.py.jinja2"
          stacks: ["fastapi"]
          pack_emitter: null
        - path_pattern: "src/entities/read_models/{model_kebab}.entity.ts"
          file_type: "read_model_entity"
          template: "cp08_database/read_model.entity.ts.jinja2"
          stacks: ["nestjs"]
          pack_emitter: null
      distributed_transaction:
        - path_pattern: "app/transactions/{tx_snake}.py"
          file_type: "distributed_transaction"
          template: "cp08_database/distributed_transaction.py.jinja2"
          stacks: ["fastapi"]
          pack_emitter: null
        - path_pattern: "src/transactions/{tx_kebab}.ts"
          file_type: "distributed_transaction_service"
          template: "cp08_database/distributed_transaction.ts.jinja2"
          stacks: ["nestjs"]
          pack_emitter: null
      jsonb:
        - path: "app/jsonb/jsonb_helpers.py"
          file_type: "jsonb_helpers"
          template: "cp08_database/jsonb_helpers.py.jinja2"
          stacks: ["fastapi"]
          pack_emitter: null
        - path: "src/database/jsonb.decorators.ts"
          file_type: "jsonb_decorators"
          template: "cp08_database/jsonb.decorators.ts.jinja2"
          stacks: ["nestjs"]
          pack_emitter: null
