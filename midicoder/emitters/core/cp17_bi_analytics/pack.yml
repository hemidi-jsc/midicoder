pack:
  id: "CP17"
  name: "Business Intelligence & Analytics Generator"
  internal_id: "cp17_bi_analytics"
  version: "1.0.0"
  status: "stable"
  category: "analytics"
  depends_on: ["CP08", "CP15"]
  definitions_count: 9
  obligations_count: 6
  error_codes:
    prefix: "MDC-CP17"
    range: "MDC-CP17-001 to MDC-CP17-015"
  capabilities_provided:
    - analytics_query
    - dashboard_build
    - report_schedule
  capabilities:
    - id: "analytics_query_engine"
      emitter: "fastapi, nestjs"
    - id: "dashboard_builder"
      emitter: "fastapi, nestjs"
    - id: "report_scheduler"
      emitter: "fastapi, nestjs"
  definitions:
    - name: "AnalyticsSourceType"
      description: "Enum for analytics data source (metric_registry, database, external_api)"
    - name: "AggregationType"
      description: "Enum for aggregation operations (sum, average, count, max, min)"
    - name: "VisualizationType"
      description: "Enum for chart types (line_chart, bar_chart, pie_chart, gauge, table)"
    - name: "ReportFrequency"
      description: "Enum for report schedule frequency (hourly, daily, weekly, monthly)"
    - name: "ReportFormat"
      description: "Enum for report output format (json, csv, pdf, html, markdown)"
    - name: "SchedulePolicy"
      description: "Enum for schedule policy (once, hourly, daily, weekly, monthly)"
    - name: "AnalyticsModel"
      description: "Aggregation model with metrics, filters, and aggregations"
    - name: "DashboardDefinition"
      description: "Visual dashboard with widgets and refresh interval"
    - name: "ScheduledReport"
      description: "Report with schedule, format, and delivery channel"
  obligations:
    - name: "ModelNameRequired"
      description: "AnalyticsModel.name must be non-empty"
    - name: "DataFreshness"
      description: "AnalyticsModel.max_stale_seconds must be >= 1"
    - name: "DashboardNameRequired"
      description: "DashboardDefinition.name must be non-empty"
    - name: "RefreshIntervalMinimum"
      description: "DashboardDefinition.refresh_interval_seconds must be >= 5"
    - name: "ReportNameRequired"
      description: "ScheduledReport.name must be non-empty"
    - name: "ReportNextRunAuto"
      description: "ScheduledReport.next_run auto-assigned when None"
  file_contributions:
    infrastructure:
      - path: "app/analytics/analytics_service.py"
        file_type: "analytics_service"
        template: "cp17_bi_analytics/analytics_service.py.jinja2"
        stacks: ["fastapi", "nestjs"]
        pack_emitter: null
      - path: "app/analytics/analytics_router.py"
        file_type: "analytics_router"
        template: "cp17_bi_analytics/analytics_router.py.jinja2"
        stacks: ["fastapi"]
        pack_emitter: null
      - path: "src/analytics/analytics.module.ts"
        file_type: "analytics_module"
        template: "cp17_bi_analytics/analytics.module.ts.jinja2"
        stacks: ["nestjs"]
        pack_emitter: null
      - path: "src/analytics/analytics.service.ts"
        file_type: "analytics_service"
        template: "cp17_bi_analytics/analytics.service.ts.jinja2"
        stacks: ["nestjs"]
        pack_emitter: null
      - path: "src/analytics/analytics.controller.ts"
        file_type: "analytics_controller"
        template: "cp17_bi_analytics/analytics.controller.ts.jinja2"
        stacks: ["nestjs"]
        pack_emitter: null
      - path: "src/app/shared/components/analytics-widget/analytics-widget.component.ts"
        file_type: "analytics_component"
        template: "cp17_bi_analytics/analytics_widget.component.ts.jinja2"
        stacks: ["angular"]
        pack_emitter: null
      - path: "src/app/shared/components/report-viewer/report-viewer.component.ts"
        file_type: "report_viewer_component"
        template: "cp17_bi_analytics/report_viewer.component.ts.jinja2"
        stacks: ["angular"]
        pack_emitter: null
      - path: "src/analytics/AnalyticsChart.tsx"
        file_type: "analytics_component"
        template: "cp17_bi_analytics/AnalyticsChart.tsx.jinja2"
        stacks: ["react"]
        pack_emitter: null
      - path: "src/analytics/ReportTable.tsx"
        file_type: "report_component"
        template: "cp17_bi_analytics/ReportTable.tsx.jinja2"
        stacks: ["react"]
        pack_emitter: null
      - path: "src/analytics/types.ts"
        file_type: "analytics_types"
        template: "cp17_bi_analytics/types.ts.jinja2"
        stacks: ["react"]
        pack_emitter: null
  frontend_integration:
    angular:
      - AnalyticsWidget
      - ReportViewer
    react:
      - AnalyticsChart
      - ReportTable
