        template: "cp45_payment/PaymentDashboard.tsx.jinja2"
        stacks: ["react"]
        pack_emitter: null
        context_keys: ["gateways"]
      - path: "src/payment/PaymentMethods.tsx"
        file_type: "payment_methods"
        template: "cp45_payment/PaymentMethods.tsx.jinja2"
        stacks: ["react"]
        pack_emitter: null
        context_keys: []
      - path: "src/payment/PaymentHistory.tsx"
        file_type: "payment_history"
        template: "cp45_payment/PaymentHistory.tsx.jinja2"
        stacks: ["react"]
        pack_emitter: null
        context_keys: []
      - path: "src/payment/PaymentProgress.tsx"
        file_type: "payment_progress"
        template: "cp45_payment/PaymentProgress.tsx.jinja2"
        stacks: ["react"]
