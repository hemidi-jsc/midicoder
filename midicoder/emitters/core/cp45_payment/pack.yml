      - path: "src/app/core/payment/payment.service.ts"
        file_type: "payment_service"
        template: "cp45_payment/payment.service.ts.jinja2"
        stacks: ["angular"]
        pack_emitter: null
        context_keys: []
      - path: "src/app/core/payment/payment.store.ts"
        file_type: "payment_store"
        template: "cp45_payment/payment.store.ts.jinja2"
        stacks: ["angular"]
        pack_emitter: null
        context_keys: []
      - path: "src/app/core/payment/payment-types.ts"
        file_type: "payment_types"
