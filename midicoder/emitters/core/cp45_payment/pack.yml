        context_keys: []
      - path: "src/payment/PaymentProvider.tsx"
        file_type: "payment_provider"
        template: "cp45_payment/PaymentProvider.tsx.jinja2"
        stacks: ["react"]
        pack_emitter: null
        context_keys: []
  frontend_integration:
    react:
      - PaymentDashboard
      - PaymentMethods
      - PaymentHistory
      - PaymentProgress
    angular:
      - PaymentDashboardComponent
      - PaymentMethodsComponent
      - PaymentHistoryComponent
  recipes:
    - basic_payment_recipe
    - full_payment_recipe
