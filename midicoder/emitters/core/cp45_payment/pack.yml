# ===========================================================================
# CP45 — Payment Gateway Abstraction
# ===========================================================================
# File contributions declaration cho 4 stacks: FastAPI, NestJS, Angular, React
#
# Capabilities:
# - payment_process: Xử lý thanh toán qua payment gateway (strategy pattern)
# - payment_method_manage: Quản lý payment methods (CRUD, default, status)
# - transaction_flow: Giao dịch thanh toán với idempotency + state machine
# - refund_process: Hoàn tiền với refund state machine riêng
#
# Storage: SQLite + Payment Gateway APIs (Stripe, VNPay, MoMo)
# ===========================================================================

pack:
  id: "CP45"
  name: "Payment Gateway Abstraction"
  internal_id: "cp45_payment"
  version: "1.0.0"
  status: "stable"
  category: "financial"
  depends_on: ["CP01", "CP05", "CP14", "CP33", "CP40"]
  definitions_count: 4
  obligations_count: 2
  error_codes:
    prefix: "MDC-CP45"
    range: "MDC-CP45-001 to MDC-CP45-010"
  capabilities_provided:
    - payment_process
    - payment_method_manage
    - transaction_flow
    - refund_process
  capabilities:
    - id: "payment_process"
      emitter: "fastapi, nestjs, angular, react"
    - id: "payment_method_manage"
      emitter: "fastapi, nestjs, angular, react"
    - id: "transaction_flow"
      emitter: "fastapi, nestjs"
    - id: "refund_process"
      emitter: "fastapi, nestjs, angular, react"
  definitions:
    - name: "PaymentTransaction"
      description: "Giao dịch thanh toán với idempotency key và state machine"
    - name: "PaymentMethod"
      description: "Phương thức thanh toán của user (credit_card, bank_transfer, ewallet, qr_code)"
    - name: "PaymentRefund"
      description: "Yêu cầu hoàn tiền cho giao dịch đã thành công"
    - name: "PaymentGatewayConfig"
      description: "Cấu hình payment gateway provider (Stripe, VNPay, MoMo)"
  obligations:
    - name: "IdempotencyProtection"
      description: "Mọi payment request có idempotency key để deduplicate"
    - name: "AuditTrail"
      description: "Ghi audit log cho mọi payment action (CP14 integration)"
  file_contributions:
    infrastructure:
      # ------------------------------------------------------------------
      # FastAPI — Backend
      # ------------------------------------------------------------------
      - path: "app/models/payment_models.py"
        file_type: "payment_models"
        template: "cp45_payment/payment_models.py.jinja2"
        stacks: ["fastapi"]
        pack_emitter: null
        context_keys: ["gateways"]
      - path: "app/schemas/payment_schemas.py"
        file_type: "payment_schemas"
        template: "cp45_payment/payment_schemas.py.jinja2"
        stacks: ["fastapi"]
        pack_emitter: null
        context_keys: ["gateways"]
      - path: "app/services/payment_service.py"
        file_type: "payment_service"
        template: "cp45_payment/payment_service.py.jinja2"
        stacks: ["fastapi"]
        pack_emitter: null
        context_keys: ["gateways", "enable_idempotency"]
      - path: "app/api/payment_router.py"
        file_type: "payment_router"
        template: "cp45_payment/payment_router.py.jinja2"
        stacks: ["fastapi"]
        pack_emitter: null
        context_keys: []
      - path: "app/api/payment_webhook.py"
        file_type: "payment_webhook"
        template: "cp45_payment/payment_webhook.py.jinja2"
        stacks: ["fastapi"]
        pack_emitter: null
        context_keys: ["gateways"]
      - path: "app/services/payment_events.py"
        file_type: "payment_events"
        template: "cp45_payment/payment_events.py.jinja2"
        stacks: ["fastapi"]
        pack_emitter: null
        context_keys: []
      # ------------------------------------------------------------------
      # NestJS — Backend
      # ------------------------------------------------------------------
      - path: "src/payment/entities/payment.entity.ts"
        file_type: "payment_entity"
        template: "cp45_payment/payment.entity.ts.jinja2"
        stacks: ["nestjs"]
        pack_emitter: null
        context_keys: ["gateways"]
      - path: "src/payment/dtos/payment.dto.ts"
        file_type: "payment_dto"
        template: "cp45_payment/payment.dto.ts.jinja2"
        stacks: ["nestjs"]
        pack_emitter: null
        context_keys: ["gateways"]
      - path: "src/payment/services/payment.service.ts"
        file_type: "payment_service"
        template: "cp45_payment/payment.service.ts.jinja2"
        stacks: ["nestjs"]
        pack_emitter: null
        context_keys: ["gateways"]
      - path: "src/payment/controllers/payment.controller.ts"
        file_type: "payment_controller"
        template: "cp45_payment/payment.controller.ts.jinja2"
        stacks: ["nestjs"]
        pack_emitter: null
        context_keys: []
      - path: "src/payment/controllers/payment-webhook.controller.ts"
        file_type: "payment_webhook_controller"
        template: "cp45_payment/payment-webhook.controller.ts.jinja2"
        stacks: ["nestjs"]
        pack_emitter: null
        context_keys: ["gateways"]
      - path: "src/payment/payment.module.ts"
        file_type: "payment_module"
        template: "cp45_payment/payment.module.ts.jinja2"
        stacks: ["nestjs"]
        pack_emitter: null
        context_keys: []
      # ------------------------------------------------------------------
