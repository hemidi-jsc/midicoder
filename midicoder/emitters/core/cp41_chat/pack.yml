# ===========================================================================
# CP41 — Chat & Messaging
# ===========================================================================
# File contributions declaration cho 4 stacks: FastAPI, NestJS, Angular, React
#
# Capabilities:
# - chat_message: Gửi/nhận tin nhắn realtime với nhiều loại nội dung
# - realtime_messaging: WebSocket/SSE delivery cho message broadcast
# - support_ticket: Hệ thống hỗ trợ ticket tích hợp chat
# - notification_center: Thông báo trong hệ thống chat
#
# Storage: SQLite + Redis pub/sub
# ===========================================================================

pack:
  id: "CP41"
  name: "Chat & Messaging"
  internal_id: "cp41_chat"
  version: "1.0.0"
  status: "stable"
  category: "communication"
  depends_on: ["CP01", "CP05", "CP22"]
  definitions_count: 4
  obligations_count: 2
  error_codes:
    prefix: "MDC-CP41"
    range: "MDC-CP41-001 to MDC-CP41-010"
  capabilities_provided:
    - chat_message
    - realtime_messaging
    - support_ticket
    - notification_center
  capabilities:
    - id: "chat_message"
      emitter: "fastapi, nestjs, angular, react"
    - id: "realtime_messaging"
      emitter: "fastapi, nestjs, angular, react"
    - id: "support_ticket"
      emitter: "fastapi, nestjs, angular, react"
    - id: "notification_center"
      emitter: "fastapi, nestjs, angular, react"
  definitions:
    - name: "Conversation"
      description: "Phòng chat, hỗ trợ direct/group/support/broadcast"
    - name: "ChatMessage"
      description: "Tin nhắn, hỗ trợ nhiều loại (text/image/video/file/reaction)"
    - name: "ReadReceipt"
      description: "Xác nhận đọc"
    - name: "Notification"
      description: "Thông báo trong hệ thống chat"
  obligations:
    - name: "MessageValidation"
      description: "Validate message content trước khi broadcast"
    - name: "RealtimeDelivery"
      description: "Đảm bảo message được giao qua WebSocket/SSE"
  file_contributions:
    infrastructure:
      # ------------------------------------------------------------------
      # FastAPI — Backend
      # ------------------------------------------------------------------
      - path: "app/chat/models.py"
        file_type: "chat_models"
        template: "cp41_chat/chat_models.py.jinja2"
        stacks: ["fastapi"]
        pack_emitter: null
        context_keys: ["conversations", "message_types"]
      - path: "app/chat/schemas.py"
