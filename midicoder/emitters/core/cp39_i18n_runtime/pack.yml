# ===========================================================================
# CP39 — i18n/L10n Runtime
# ===========================================================================
# File contributions declaration cho 4 stacks: FastAPI, NestJS, Angular, React
#
# Capabilities:
# - locale_format: Date/number/currency formatting theo locale
# - translation_manage: CRUD translation entries với tenant isolation
# - language_switch: Real-time language switch qua WebSocket/SSE
#
# Storage: Database (SQLite/PostgreSQL) + Redis cache
# ===========================================================================

pack:
  id: "CP39"
  name: "i18n/L10n Runtime"
  internal_id: "cp39_i18n_runtime"
  version: "1.0.0"
  status: "stable"
  category: "internationalization"
  depends_on: ["CP01", "CP02", "CP29"]
  definitions_count: 4
  obligations_count: 2
  error_codes:
    prefix: "MDC-CP39"
    range: "MDC-CP39-001 to MDC-CP39-015"
  capabilities_provided:
    - locale_format
    - translation_manage
    - language_switch
  capabilities:
    - id: "locale_format"
      emitter: "fastapi, nestjs, angular, react"
    - id: "translation_manage"
      emitter: "fastapi, nestjs"
    - id: "language_switch"
      emitter: "fastapi, nestjs, angular, react"
  definitions:
    - name: "LocaleConfig"
      description: "Cấu hình locale (BCP 47 code, date/number/currency format)"
    - name: "TranslationEntry"
      description: "Bản ghi translation với key, namespace, locale, tenant scope"
    - name: "TranslationStore"
      description: "Abstract storage interface cho translation backend (SQLite/PostgreSQL)"
    - name: "LocaleFormatter"
      description: "Engine format date/number/currency/relative time theo locale"
  obligations:
    - name: "TranslationFallbackChain"
      description: "Translation resolution phải theo chain: cache → tenant → global → fallback locale → raw key"
    - name: "TenantTranslationIsolation"
      description: "Tenant translations phải được isolate và có fallback về global"
  file_contributions:
    infrastructure:
      # ------------------------------------------------------------------
      # FastAPI — Backend
      # ------------------------------------------------------------------
      - path: "app/i18n/models.py"
        file_type: "i18n_models"
        template: "cp39_i18n_runtime/i18n_models.py.jinja2"
        stacks: ["fastapi"]
        pack_emitter: null
        context_keys: ["locales", "translations"]
      - path: "app/i18n/schemas.py"
        file_type: "i18n_schemas"
        template: "cp39_i18n_runtime/i18n_schemas.py.jinja2"
