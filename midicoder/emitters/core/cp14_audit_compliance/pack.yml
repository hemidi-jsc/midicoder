pack:
  id: "CP14"
  name: "Audit Trail & Compliance Generator"
  internal_id: "cp14_audit_compliance"
  version: "1.0.0"
  status: "stable"
  category: "compliance"
  depends_on: ["CP01"]
  definitions_count: 17
  obligations_count: 4
  error_codes:
    prefix: "MDC-CP14"
    range: "MDC-CP14-001 to MDC-CP14-010"
  capabilities_provided:
    - write_audit_log
    - audit_query
    - compliance_report
    - immutable_ledger
    - compliance_reporting
    - tamper_detection
    - audit_export
  capabilities:
    - id: "audit_logger"
      emitter: "fastapi, nestjs, angular, react"
    - id: "audit_middleware"
      emitter: "fastapi"
    - id: "audit_module"
      emitter: "nestjs"
    - id: "audit_api_routes"
      emitter: "fastapi, nestjs"
    - id: "immutable_ledger"
      emitter: "fastapi, nestjs"
    - id: "compliance_report"
      emitter: "fastapi, nestjs"
    - id: "audit_frontend"
      emitter: "angular, react"
  definitions:
    - name: "AuditTrail"
      description: "Immutable record of user action with timestamp and context"
    - name: "AuditRule"
      description: "Policy defining which actions require audit logging"
    - name: "ComplianceControl"
      description: "Regulatory control with enforcement level"
    - name: "AuditComplianceCollection"
      description: "Collection chứa rules và controls"
    - name: "LedgerEntry"
      description: "Chained hash entry in immutable audit ledger"
    - name: "ImmutableLedgerConfig"
      description: "Immutable ledger with hash chain, merkle tree, digital signature"
    - name: "ComplianceReportConfig"
      description: "Report generation (PDF/CSV/JSON/HTML/XLSX) for SOC2/GDPR/HIPAA/PCI-DSS"
    - name: "ReportSummary"
      description: "Summary stats (events_by_action, violations, ledger verification)"
    - name: "AuditActionType"
      description: "Enum: CREATE, UPDATE, DELETE, READ, LOGIN, LOGOUT, EXPORT, APPROVE, REJECT, CUSTOM"
    - name: "AuditLevel"
      description: "Enum: BASIC, DETAILED"
    - name: "ControlType"
      description: "Enum: PREVENTIVE, DETECTIVE, CORRECTIVE"
    - name: "EnforcementLevel"
      description: "Enum: COMPILE, RUNTIME, BOTH"
    - name: "StandardType"
      description: "Enum: SOX, HIPAA, GDPR, PCI_DSS, CUSTOM"
    - name: "LedgerStorageBackend"
      description: "Enum: DATABASE, BLOCKCHAIN, APPEND_ONLY_STORE, SIGNED_CHAIN"
    - name: "LedgerVerificationMode"
      description: "Enum: HASH_CHAIN, MERKLE_TREE, DIGITAL_SIGNATURE, COMBINED"
    - name: "ReportFormat"
      description: "Enum: PDF, CSV, JSON, HTML, XLSX"
    - name: "ReportScope"
      description: "Enum: ALL, ENTITY, ACTOR, TIME_RANGE, TENANT, ACTION"
    - name: "ComplianceStandard"
      description: "Enum: SOC2, GDPR, HIPAA, PCI_DSS, ISO27001, SOX, CUSTOM"
  obligations:
    - name: "AuditImmutability"
      description: "Audit logs must be append-only and tamper-proof"
    - name: "LedgerChainIntegrity"
      description: "Ledger hash chain must be verified on read; breaks must be alerted"
    - name: "ComplianceEvidence"
      description: "Compliance reports must include evidence (old/new values)"
    - name: "SensitiveDataMasking"
      description: "Sensitive fields must be masked in audit logs"
  file_contributions:
    infrastructure:
      - path: "app/audit/audit_logger.py"
        file_type: "audit_logger"
        template: "cp14_audit_compliance/audit_logger.py.jinja2"
        stacks: ["fastapi"]
        pack_emitter: null
        context_keys: ["collection", "entities"]
      - path: "app/audit/audit_middleware.py"
        file_type: "audit_middleware"
        template: "cp14_audit_compliance/audit_middleware.py.jinja2"
        stacks: ["fastapi"]
        pack_emitter: null
        context_keys: []
      - path: "app/audit/api.py"
        file_type: "audit_api"
        template: "cp14_audit_compliance/audit_api.py.jinja2"
        stacks: ["fastapi"]
        pack_emitter: null
        context_keys: []
      - path: "src/audit/audit.module.ts"
        file_type: "audit_module"
        template: "cp14_audit_compliance/audit.module.ts.jinja2"
        stacks: ["nestjs"]
        pack_emitter: null
        context_keys: []
      - path: "src/audit/audit-logger.service.ts"
        file_type: "audit_logger"
        template: "cp14_audit_compliance/audit_logger_service.ts.jinja2"
        stacks: ["nestjs"]
        pack_emitter: null
        context_keys: []
      - path: "src/app/core/audit/audit-logger.service.ts"
        file_type: "audit_logger"
        template: "cp14_audit_compliance/audit_logger_service.ts.jinja2"
        stacks: ["angular"]
        pack_emitter: null
        context_keys: []
      - path: "src/app/shared/components/audit-log/audit-log.component.ts"
        file_type: "audit_log_component"
        template: "cp14_audit_compliance/audit_log_list.component.ts.jinja2"
        stacks: ["angular"]
        pack_emitter: null
        context_keys: []
      - path: "src/audit/AuditLogList.tsx"
        file_type: "audit_log_component"
        template: "cp14_audit_compliance/AuditLogList.tsx.jinja2"
        stacks: ["react"]
        pack_emitter: null
        context_keys: []
      - path: "src/audit/useAudit.ts"
        file_type: "audit_hook"
        template: "cp14_audit_compliance/useAudit.ts.jinja2"
        stacks: ["react"]
        pack_emitter: null
        context_keys: []
      - path: "src/audit/types.ts"
        file_type: "audit_types"
        template: "cp14_audit_compliance/types.ts.jinja2"
        stacks: ["react"]
        pack_emitter: null
        context_keys: []
  frontend_integration:
    angular:
      - AuditLoggerService
      - AuditLogListComponent
    react:
      - useAudit
      - AuditLogList
  recipes:
    - basic_audit_recipe
    - immutable_ledger_recipe
    - gdpr_compliance_recipe
    - hipaa_compliance_recipe
    - sox_compliance_recipe
    - pci_dss_compliance_recipe
    - generate_compliance_report_config
