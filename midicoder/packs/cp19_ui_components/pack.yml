pack:
  id: "CP19"
  name: "UI Component Generator"
  internal_id: "cp19_ui_components"
  version: "1.0.0"
  status: "stable"
  category: "frontend"
  depends_on: ["CP18"]
  definitions_count: 6
  obligations_count: 1
  error_codes:
    prefix: "MDC-CP19"
    range: "MDC-CP19-001 to MDC-CP19-005"
  capabilities_provided:
    - component_render
    - form_generate
    - table_generate
  capabilities:
    - id: "form_fields"
      emitter: "angular, react, fastapi, nestjs"
    - id: "data_tables"
      emitter: "angular, react"
    - id: "card_lists"
      emitter: "angular, react"
    - id: "dialogs"
      emitter: "angular, react"
  definitions:
    - name: "ComponentSpec"
      description: "Specification for a reusable UI component"
    - name: "FormFieldSpec"
      description: "Form field with type, validation, and binding"
    - name: "TableSpec"
      description: "Data table with columns, sorting, and pagination"
    - name: "FormBuilderSpec"
      description: "Dynamic form builder with conditional fields"
    - name: "ConditionalRule"
      description: "Conditional visibility/validation rule for form fields"
    - name: "ThemeSpec"
      description: "Theme and design token configuration"
  obligations:
    - name: "ComponentSchemaConsistency"
      description: "Component schemas must match entity field types from CP01"
  file_contributions:
    infrastructure:
      # ── FastAPI (backend: form validation) ──
      - path: "app/validation/form_validation_service.py"
        file_type: "form_validation"
        template: "cp19_ui_components/form_validation_service.py.jinja2"
        stacks: ["fastapi"]
        pack_emitter: "cp19.fastapi"
        context_keys: ["components"]
      # ── NestJS (backend: DTO + validation pipe) ──
      - path: "src/shared/validations/form-validation.dto.ts"
        file_type: "form_dto"
        template: "cp19_ui_components/form-validation.dto.ts.jinja2"
        stacks: ["nestjs"]
        pack_emitter: "cp19.nestjs"
        context_keys: ["components"]
      - path: "src/shared/pipes/form-validation.pipe.ts"
        file_type: "form_pipe"
        template: "cp19_ui_components/form-validation.pipe.ts.jinja2"
        stacks: ["nestjs"]
        pack_emitter: "cp19.nestjs"
        context_keys: ["components"]
      # ── React: Phase 2 — Theme & Design System ──
      - path: "src/ui/ThemeProvider.tsx"
        file_type: "theme_provider"
        template: "cp19_ui_components/utility/ThemeProvider.tsx.jinja2"
        stacks: ["react"]
        pack_emitter: null
        context_keys: []
      - path: "src/ui/DesignTokens.ts"
        file_type: "design_tokens"
        template: "cp19_ui_components/utility/DesignTokens.ts.jinja2"
        stacks: ["react"]
        pack_emitter: null
        context_keys: []
      - path: "src/ui/ThemeConfig.ts"
        file_type: "theme_config"
        template: "cp19_ui_components/utility/ThemeConfig.ts.jinja2"
        stacks: ["react"]
        pack_emitter: null
        context_keys: []
      # ── Angular: Phase 2 — Theme & Design System ──
      - path: "src/app/shared/ui/theme-provider.component.ts"
        file_type: "theme_provider"
        template: "cp19_ui_components/utility/theme-provider.component.ts.jinja2"
        stacks: ["angular"]
        pack_emitter: null
        context_keys: []
      - path: "src/app/shared/ui/design-tokens.scss"
        file_type: "design_tokens"
        template: "cp19_ui_components/utility/design-tokens.scss.jinja2"
        stacks: ["angular"]
        pack_emitter: null
        context_keys: []
      - path: "src/app/shared/ui/theme.config.ts"
        file_type: "theme_config"
        template: "cp19_ui_components/utility/theme.config.ts.jinja2"
        stacks: ["angular"]
        pack_emitter: null
        context_keys: []
      # ── B30: Dark Mode Support ──
      - path: "src/app/shared/ui/dark-mode.service.ts"
        file_type: "dark_mode_service"
        template: "cp19_ui_components/dark-mode.service.ts.jinja2"
        stacks: ["angular"]
        pack_emitter: null
        context_keys: []
      # ── React: Phase 3 — FormBuilder (dynamic from JSON schema) ──
      - path: "src/components/ui/FormBuilder.tsx"
        file_type: "form_builder"
        template: "cp19_ui_components/data-input/FormBuilder.tsx.jinja2"
        stacks: ["react"]
        pack_emitter: null
        context_keys: []
      # ── Angular: Phase 3 — FormBuilder (dynamic from JSON schema) ──
      - path: "src/app/shared/components/form-builder.component.ts"
        file_type: "form_builder"
        template: "cp19_ui_components/data-input/form-builder.component.ts.jinja2"
        stacks: ["angular"]
        pack_emitter: null
        context_keys: []
      # ── React: Phase 4 — API hooks (useQuery, useMutation) ──
      - path: "src/services/use-api.ts"
        file_type: "api_hooks"
        template: "cp19_ui_components/service/use-api.ts.jinja2"
        stacks: ["react"]
        pack_emitter: null
        context_keys: []
      # ── Angular: Phase 4 — HttpClient + Interceptors ──
      - path: "src/app/shared/services/http-client.service.ts"
        file_type: "http_client"
        template: "cp19_ui_components/service/http-client.service.ts.jinja2"
        stacks: ["angular"]
        pack_emitter: null
        context_keys: []
      - path: "src/app/shared/services/api-interceptors.service.ts"
        file_type: "api_interceptors"
        template: "cp19_ui_components/service/api-interceptors.service.ts.jinja2"
        stacks: ["angular"]
        pack_emitter: null
        context_keys: []
      # ── React: Phase 5 — Barrel exports + Route config ──
      - path: "src/routes/app-routes.tsx"
        file_type: "app_routing"
        template: "cp19_ui_components/module/app-routes.tsx.jinja2"
        stacks: ["react"]
        pack_emitter: null
        context_keys: []
      # ── Angular: Phase 5 — SharedModule + Routing + AuthGuard ──
      - path: "src/app/shared/shared.module.ts"
        file_type: "shared_module"
        template: "cp19_ui_components/module/shared.module.ts.jinja2"
        stacks: ["angular"]
        pack_emitter: null
        context_keys: []
      - path: "src/app/app-routing.module.ts"
        file_type: "app_routing"
        template: "cp19_ui_components/module/app-routing.module.ts.jinja2"
        stacks: ["angular"]
        pack_emitter: null
        context_keys: []
      - path: "src/app/guards/auth.guard.ts"
        file_type: "auth_guard"
        template: "cp19_ui_components/module/auth.guard.ts.jinja2"
        stacks: ["angular"]
        pack_emitter: null
        context_keys: []

    # ── PER ENTITY × COMPONENT TYPE — generates UI components per entity ──
    per_ui_component:
      # ── Angular: Form Field ──
      - path_pattern: "src/app/shared/components/{entity_pascal}/form-{entity_snake}.component.ts"
        file_type: "form_field_component"
        template: "cp19_ui_components/data-input/form-field.component.ts.jinja2"
        stacks: ["angular"]
        pack_emitter: "cp19.angular"
        component_types: ["form_field"]
        context_keys: ["entity"]
      # ── Angular: Data Table ──
      - path_pattern: "src/app/shared/components/{entity_pascal}/table-{entity_snake}.component.ts"
        file_type: "data_table_component"
        template: "cp19_ui_components/data-display/data-table.component.ts.jinja2"
        stacks: ["angular"]
        pack_emitter: "cp19.angular"
        component_types: ["data_table"]
        context_keys: ["entity"]
      # ── Angular: Card List ──
      - path_pattern: "src/app/shared/components/{entity_pascal}/card-list-{entity_snake}.component.ts"
        file_type: "card_list_component"
        template: "cp19_ui_components/data-display/card-list.component.ts.jinja2"
        stacks: ["angular"]
        pack_emitter: "cp19.angular"
        component_types: ["card_list"]
        context_keys: ["entity"]
      # ── Angular: Dialog ──
      - path_pattern: "src/app/shared/components/{entity_pascal}/dialog-{entity_snake}.component.ts"
        file_type: "dialog_component"
        template: "cp19_ui_components/feedback/dialog.component.ts.jinja2"
        stacks: ["angular"]
        pack_emitter: "cp19.angular"
        component_types: ["dialog"]
        context_keys: ["entity"]

      # ── React: Form Field ──
      - path_pattern: "src/components/{entity_pascal}/Form{entity_pascal}.tsx"
        file_type: "form_field_component"
        template: "cp19_ui_components/data-input/FormField.tsx.jinja2"
        stacks: ["react"]
        pack_emitter: "cp19.react"
        component_types: ["form_field"]
        context_keys: ["entity"]
      # ── React: Data Table ──
      - path_pattern: "src/components/{entity_pascal}/Table{entity_pascal}.tsx"
        file_type: "data_table_component"
        template: "cp19_ui_components/data-display/DataTable.tsx.jinja2"
        stacks: ["react"]
        pack_emitter: "cp19.react"
        component_types: ["data_table"]
        context_keys: ["entity"]
      # ── React: Card List ──
      - path_pattern: "src/components/{entity_pascal}/CardList{entity_pascal}.tsx"
        file_type: "card_list_component"
        template: "cp19_ui_components/data-display/CardList.tsx.jinja2"
        stacks: ["react"]
        pack_emitter: "cp19.react"
        component_types: ["card_list"]
        context_keys: ["entity"]
      # ── React: Dialog ──
      - path_pattern: "src/components/{entity_pascal}/Dialog{entity_pascal}.tsx"
        file_type: "dialog_component"
        template: "cp19_ui_components/feedback/Dialog.tsx.jinja2"
        stacks: ["react"]
        pack_emitter: "cp19.react"
        component_types: ["dialog"]
        context_keys: ["entity"]
  frontend_integration:
    angular:
      - FormFieldComponent
      - DataTableComponent
      - CardListComponent
      - DialogComponent
    react:
      - FormField
      - DataTable
      - CardList
      - Dialog
