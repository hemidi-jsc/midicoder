pack:
  id: F01
  name: Authentication & Authorization Framework
  internal_id: cp_full_auth
  version: 2.0.0
  status: stable
  category: security
  depends_on:
  - B01
  - C01
  - F07
  definitions_count: 19
  obligations_count: 10
  error_codes:
    prefix: MDC-F01
    range: MDC-CP03-001 to MDC-CP03-006
  capabilities_provided:
  - authorize_permission
  - authenticate_user
  capabilities:
  - id: jwt_auth
    emitter: fastapi, nestjs, angular, react
  - id: oauth2_auth
    emitter: fastapi, nestjs, angular, react
  - id: saml_sso
    emitter: fastapi, nestjs
  - id: ldap_auth
    emitter: fastapi, nestjs
  - id: mtls_auth
    emitter: fastapi, nestjs
  - id: stateful_session
    emitter: fastapi, nestjs
  - id: session_management
    emitter: fastapi, nestjs
  - id: permission_authorization
    emitter: fastapi, nestjs, angular, react
  - id: rate_limiting
    emitter: fastapi, nestjs
  definitions:
  - name: AuthProviderType
    description: Authentication provider type enum (JWT, OAuth2, SAML, LDAP, mTLS,
      Session)
  - name: JWTAuthConfig
    description: JWT authentication configuration
  - name: OAuth2AuthConfig
    description: OAuth2 authentication configuration
  - name: SAMLAuthConfig
    description: SAML 2.0 enterprise SSO configuration (IdP metadata, SP entity, signing)
  - name: LDAPOAuthConfig
    description: LDAP/Active Directory authentication (server, bind DN, search filters)
  - name: MTLSAuthConfig
    description: Mutual TLS authentication for machine-to-machine (CA, certs, verification)
  - name: StatefulSessionConfig
    description: Stateful session with configurable store (database, Redis, Memcached)
  - name: SessionConfig
    description: Cookie-based session management configuration
  - name: RateLimitConfig
    description: Rate limiting configuration (sliding window, token bucket, fixed
      window)
  - name: TOTPConfig
    description: Time-based One-Time Password configuration (RFC 6238)
  - name: WebAuthnConfig
    description: WebAuthn/FIDO2 passkey configuration
  - name: MFAPolicy
    description: Multi-factor authentication policy (required, optional, grace period)
  - name: AuthProvider
    description: Authentication provider with type and config union
  - name: Permission
    description: Fine-grained permission with resource and action
  - name: AuthIR
    description: Complete authentication intermediate representation
  - name: AuthProviderType
    description: Enum of auth provider types
  - name: RateLimitStrategyType
    description: Enum of rate limiting strategies
  - name: MFAProviderType
    description: Enum of MFA provider types (TOTP, WebAuthn, SMS, Email OTP)
  - name: TOTPAlgorithm
    description: Enum of TOTP hash algorithms (SHA1, SHA256, SHA512)
  obligations:
  - name: AuthRequired
    description: All protected endpoints must enforce authentication
  - name: TokenExpiry
    description: Auth tokens must have configurable expiration
  - name: SAMLSignatureValidation
    description: SAML assertions must be signature-verified before trust
  - name: LDAPSecureBind
    description: LDAP connections must use LDAPS or StartTLS
  - name: mTlsCaRequired
    description: mTLS provider must have CA certificate path
  - name: SessionTTLPositive
    description: Stateful session TTL must be positive
  - name: RateLimitPositive
    description: Rate limit max_requests and window must be positive
  - name: TOTPDigitCount
    description: TOTP digit count must be 6 or 8
  - name: WebAuthnOriginRequired
    description: WebAuthn must specify relying party ID, name, and origins
  - name: MFAMandatoryProviders
    description: MFA required must have at least one provider
  file_contributions:
    infrastructure:
    - path: app/auth/__init__.py
      file_type: init
      template: cp_full_auth/__init__.py.jinja2
      stacks:
      - fastapi
      pack_emitter: null
    - path: app/auth/jwt_auth.py
      file_type: jwt_auth
      template: cp_full_auth/jwt_auth.py.jinja2
      stacks:
      - fastapi
      pack_emitter: null
    - path: app/auth/oauth2_provider.py
