# ===========================================================================
# CP63 — Search & Recommendation Engine
# ===========================================================================
# File contributions declaration cho 2 stacks: FastAPI, NestJS
#
# Capabilities:
# - collaborative_filtering: User-user/item-item collaborative filtering
# - content_based_recommender: Content-based recommendation với item features
# - hybrid_recommendation: Hybrid kết hợp collaborative + content-based
# - popularity_fallback: Popularity-based fallback recommendation
# - recommendation_ab_test: A/B test cho recommendation strategies
#
# Storage: In-memory + Redis cache
# ===========================================================================

pack:
  id: "CP63"
  name: "Search & Recommendation Engine"
  internal_id: "cp63_recommendation"
  version: "1.0.0"
  status: "stable"
  category: "performance"
  depends_on: ["CP01", "CP08", "CP09"]
  definitions_count: 5
  obligations_count: 2
  error_codes:
    prefix: "MDC-CP63"
    range: "MDC-CP63-001 to MDC-CP63-010"
  capabilities_provided:
    - collaborative_filtering
    - content_based_recommender
    - hybrid_recommendation
    - popularity_fallback
    - recommendation_ab_test
  capabilities:
    - id: "collaborative_filtering"
      emitter: "fastapi, nestjs"
    - id: "content_based_recommender"
      emitter: "fastapi, nestjs"
    - id: "hybrid_recommendation"
      emitter: "fastapi, nestjs"
    - id: "popularity_fallback"
      emitter: "fastapi, nestjs"
    - id: "recommendation_ab_test"
      emitter: "fastapi, nestjs"
  definitions:
    - name: "RecommendationConfig"
      description: "Cấu hình recommendation engine với algorithm và tham số"
    - name: "ItemEmbedding"
      description: "Embedding vector cho items để tính toán độ tương đồng"
    - name: "UserPreference"
      description: "Sở thích người dùng với weight và history window"
    - name: "RecommendationCache"
      description: "Cache kết quả recommendation để giảm độ trễ"
    - name: "ABTestConfig"
      description: "Cấu hình A/B test cho multiple recommendation strategies"
  obligations:
    - name: "CacheInvalidation"
      description: "Tự động invalidate cache khi item/user data thay đổi"
    - name: "ColdStartFallback"
      description: "Fallback sang popularity/random khi không đủ training data"
  file_contributions:
    infrastructure:
      # ------------------------------------------------------------------
      # FastAPI — Backend
      # ------------------------------------------------------------------
      - path: "app/services/recommendation_service.py"
        file_type: "recommendation_service"
        template: "cp63_recommendation/recommendation_service.py.jinja2"
        stacks: ["fastapi"]
        pack_emitter: null
        context_keys: ["configs", "enable_cache"]
      - path: "app/services/collaborative_engine.py"
        file_type: "collaborative_engine"
        template: "cp63_recommendation/collaborative_engine.py.jinja2"
        stacks: ["fastapi"]
        pack_emitter: null
        context_keys: ["configs"]
      - path: "app/services/content_scorer.py"
        file_type: "content_scorer"
        template: "cp63_recommendation/content_scorer.py.jinja2"
        stacks: ["fastapi"]
        pack_emitter: null
        context_keys: ["embeddings"]
      - path: "app/api/recommendation_router.py"
        file_type: "recommendation_router"
        template: "cp63_recommendation/recommendation_router.py.jinja2"
        stacks: ["fastapi"]
        pack_emitter: null
        context_keys: ["ab_tests", "enable_ab_testing"]
      # ------------------------------------------------------------------
      # NestJS — Backend
      # ------------------------------------------------------------------
      - path: "src/recommendation/recommendation.module.ts"
        file_type: "recommendation_module"
        template: "cp63_recommendation/recommendation.module.ts.jinja2"
        stacks: ["nestjs"]
        pack_emitter: null
        context_keys: ["configs"]
      - path: "src/recommendation/recommendation.service.ts"
        file_type: "recommendation_service"
        template: "cp63_recommendation/recommendation.service.ts.jinja2"
        stacks: ["nestjs"]
        pack_emitter: null
        context_keys: ["configs", "enable_cache"]
      - path: "src/recommendation/ab-test-routing.service.ts"
        file_type: "ab_test_service"
        template: "cp63_recommendation/ab-test-routing.service.ts.jinja2"
        stacks: ["nestjs"]
        pack_emitter: null
        context_keys: ["ab_tests"]
      - path: "src/recommendation/recommendation.controller.ts"
        file_type: "recommendation_controller"
        template: "cp63_recommendation/recommendation.controller.ts.jinja2"
        stacks: ["nestjs"]
        pack_emitter: null
        context_keys: ["enable_ab_testing"]
  recipes:
    - collaborative_filtering_recipe
    - content_based_recipe
    - hybrid_recipe
    - popularity_recipe
    - ab_test_recipe
