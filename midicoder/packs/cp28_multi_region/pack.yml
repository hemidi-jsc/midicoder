# ===========================================================================
# CP28 — Multi-Region & Geo-Replication
# ===========================================================================
# File contributions declaration cho infrastructure stack
#
# Capabilities:
# - multi_region_deploy: Triển khai workload đa region trên cloud
# - cross_region_replication: Replication dữ liệu cross-region (sync/async)
# - latency_based_routing: Routing traffic dựa trên độ trễ đến region gần nhất
# - failover_management: Quản lý failover tự động với RTO/RPO
# - data_residency_enforce: Thực thi data residency theo regulation (GDPR, CCPA)
# - geo_health_check: Health check per region để phát hiện sự cố
#
# Storage: Cloud Provider APIs (DynamoDB Global Tables, RDS Multi-AZ, v.v.)
# ===========================================================================

pack:
  id: "CP28"
  name: "Multi-Region & Geo-Replication"
  internal_id: "cp28_multi_region"
  version: "1.0.0"
  status: "stable"
  category: "infrastructure"
  depends_on: ["CP02", "CP06", "CP08", "CP14", "CP15", "CP54", "CP56"]
  definitions_count: 6
  obligations_count: 2
  error_codes:
    prefix: "MDC-CP28"
    range: "MDC-CP28-001 to MDC-CP28-010"
  capabilities_provided:
    - multi_region_deploy
    - cross_region_replication
    - latency_based_routing
    - failover_management
    - data_residency_enforce
    - geo_health_check
  capabilities:
    - id: "multi_region_deploy"
      emitter: "fastapi, nestjs, infrastructure"
    - id: "cross_region_replication"
      emitter: "fastapi, nestjs"
    - id: "latency_based_routing"
      emitter: "fastapi, nestjs, infrastructure"
    - id: "failover_management"
      emitter: "fastapi, nestjs"
    - id: "data_residency_enforce"
      emitter: "fastapi, nestjs"
    - id: "geo_health_check"
      emitter: "fastapi, nestjs"
  definitions:
    - name: "RegionConfig"
      description: "Định nghĩa region với cloud provider, availability zones, và endpoint"
    - name: "ReplicationPolicy"
      description: "Chính sách replication cross-region (sync/async) với conflict resolution"
    - name: "GeoRoutingRule"
      description: "Quy tắc routing dựa trên độ trễ hoặc vị trí địa lý"
    - name: "FailoverPolicy"
      description: "Chính sách failover với RTO/RPO và tự động chuyển region"
    - name: "DataResidencyRule"
      description: "Quy tắc data residency per region/tenant theo regulation"
    - name: "RegionHealthCheck"
      description: "Health check per region với auto-failover threshold"
  obligations:
    - name: "FailoverPlanRequired"
      description: "Mọi multi-region deployment phải có failover plan với RTO/RPO xác định"
    - name: "DataResidencyEnforced"
      description: "Data residency rules phải được enforce để đảm bảo compliance với GDPR/CCPA"
  file_contributions:
    infrastructure:
      # ------------------------------------------------------------------
      # Infrastructure — Multi-Region Deployment
      # ------------------------------------------------------------------
      - path: "multi-region/deployment-multi-region.yaml"
        file_type: "multi_region_deployment"
        template: "multi-region/deployment-multi-region.yaml.jinja2"
        stacks: ["infrastructure"]
        pack_emitter: "cp28.multi_region.infrastructure"
        context_keys: ["regions"]
      - path: "multi-region/route53-geo-routing.yaml"
        file_type: "geo_routing_dns"
        template: "multi-region/route53-geo-routing.yaml.jinja2"
        stacks: ["infrastructure"]
        pack_emitter: "cp28.multi_region.infrastructure"
        context_keys: ["geo_routing_rules"]
      - path: "multi-region/failover-lambda.py"
        file_type: "failover_script"
        template: "multi-region/failover-lambda.py.jinja2"
        stacks: ["infrastructure"]
        pack_emitter: "cp28.multi_region.infrastructure"
        context_keys: ["failover_policies", "regions"]
      - path: "multi-region/cross-region-vpc.tf"
        file_type: "cross_region_vpc"
        template: "multi-region/cross-region-vpc.tf.jinja2"
        stacks: ["infrastructure"]
        pack_emitter: "cp28.multi_region.infrastructure"
        context_keys: ["regions"]
      - path: "multi-region/multi-cluster-k8s.yaml"
        file_type: "multi_cluster_k8s"
        template: "multi-cluster/multi-cluster-k8s.yaml.jinja2"
        stacks: ["infrastructure"]
        pack_emitter: "cp28.multi_region.infrastructure"
        context_keys: ["regions"]
  recipes:
    - basic_multi_region_recipe
    - full_geo_replication_recipe
    - data_residency_recipe
