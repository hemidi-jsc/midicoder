pack:
  id: F32
  name: API Rate Limiting & Quota Management
  internal_id: cp_full_rate_limit
  version: 2.0.0
  status: stable
  category: integration
  depends_on:
  - F01
  - F03
  - F07
  definitions_count: 4
  obligations_count: 2
  error_codes:
    prefix: MDC-F32
    range: MDC-CP48-001 to MDC-CP48-010
  capabilities_provided:
  - rate_limiting
  - quota_management
  - throttling
  - rate_limit_middleware
  capabilities:
  - id: rate_limiting
    emitter: fastapi, nestjs
  - id: quota_management
    emitter: fastapi, nestjs, angular, react
  - id: throttling
    emitter: fastapi, nestjs
  - id: rate_limit_middleware
    emitter: fastapi, nestjs
  definitions:
  - name: RateLimitStrategy
    description: Chiến lược rate limiting enum (FIXED_WINDOW, SLIDING_WINDOW, TOKEN_BUCKET)
  - name: QuotaLevel
    description: Cấp độ quota enum (USER, TENANT, ENDPOINT, GLOBAL)
  - name: RateLimitPolicy
    description: Chính sách rate limit với cấu hình chiến lược
  - name: QuotaConfig
    description: Cấu hình quota cho cấp độ và chu kỳ cụ thể
  obligations:
  - name: TenantIsolation
    description: Tất cả rate limit/quota enforce tenant scope từ CP03
  - name: GracefulDegradation
    description: Redis down phải fallback sang in-memory mà không crash API
