pack:
  id: F24
  name: Webhook & Outbound Integration Hub
  internal_id: cp_full_webhook
  version: 2.0.0
  status: stable
  category: integration
  depends_on:
  - C02
  - F08
  - F14
  - F07
  scope_note: 'CP40 is the webhook event hub: subscription management (CRUD with tenant
    isolation), event-driven fan-out dispatch to multiple endpoints, configurable
    retry policies with queue workers, HMAC signature verification, and dashboard
    UI for monitoring deliveries. CP12 (Notification) uses webhook only as one of
    many notification delivery channels (email, sms, push, in-app, webhook) for simple
    "send payload to URL" operations. In short: CP40 = webhook event hub; CP12 = notification
    channels.

    '
  definitions_count: 4
  obligations_count: 2
  error_codes:
    prefix: MDC-F24
    range: MDC-CP40-001 to MDC-CP40-010
  capabilities_provided:
  - webhook_manage
  - event_deliver
  - retry_policy
  - outbound_api
  capabilities:
  - id: webhook_manage
    emitter: fastapi, nestjs, angular, react
  - id: event_deliver
    emitter: fastapi, nestjs
  - id: retry_policy
    emitter: fastapi, nestjs
  - id: outbound_api
    emitter: fastapi, nestjs
  definitions:
  - name: WebhookSubscription
    description: Đăng ký webhook endpoint (event_type → URL + auth + retry)
  - name: WebhookDispatch
    description: Bản ghi dispatch (subscription → payload → delivery tracking)
  - name: WebhookDispatcher
    description: Engine dispatch webhook (subscribe → render → dispatch → audit)
  - name: RetryPolicy
    description: Chính sách retry exponential backoff (max_retries, base_delay, max_delay)
  obligations:
  - name: DispatchReliability
    description: Mỗi dispatch phải được retry theo policy và ghi audit trail
  - name: SubscriptionIsolation
    description: Webhook subscriptions phải được isolate theo tenant
  file_contributions:
