pack:
  id: C03
  name: Observability Stack
  internal_id: cp_core_observability
  version: 2.0.0
  status: stable
  category: core
  type: core
  old_ids:
  - CP15
  - CP61
  depends_on:
  - I01
  render_context_support: true
  definitions_count: 14
  obligations_count: 7
  error_codes:
    prefix: MDC-C03
    range: MDC-CP15-001 to MDC-CP15-010
  capabilities_provided:
  - emit_metric
  - structured_logging
  - distributed_tracing
  - opentelemetry_export
  - log_shipping
  - span_propagation
  - correlation_id
  - trace_export
  - log_trace_correlation
  capabilities:
  - id: metrics
    emitter: fastapi, nestjs
  - id: structured_logging
    emitter: fastapi, nestjs
  - id: tracing
    emitter: fastapi, nestjs
  - id: opentelemetry
    emitter: fastapi, nestjs
  - id: log_shipping
    emitter: fastapi, nestjs
  - id: span_propagation
    emitter: fastapi, nestjs
  - id: correlation_id
    emitter: fastapi, nestjs
  - id: trace_export
    emitter: fastapi, nestjs
  - id: log_trace_correlation
    emitter: fastapi, nestjs
  definitions:
  - name: MetricProfile
    description: Metric type, granularity, and retention policy
  - name: StructuredLogConfig
    description: Log format, level, and output destination
  - name: TraceConfig
    description: Trace sampling, propagation, and exporter settings
  - name: OpenTelemetryConfig
    description: Unified OTel SDK config (traces/metrics/logs) with sampler
  - name: OTelExporterConfig
    description: OTLP exporter (gRPC, HTTP/JSON, HTTP/Protobuf) with batching
  - name: LogShippingConfig
    description: Ship logs to Loki, CloudWatch, Datadog, ES, Splunk
  - name: LogShippingDestination
    description: Individual log destination with labels, compression, filter
  - name: SamplerType
    description: Trace sampler (always_on/off, traceid_ratio, parent_based)
  - name: SpanKind
    description: Span classification (internal, server, client, producer, consumer)
  - name: CorrelationField
    description: Correlation ID header and propagation between services
  - name: SpanDefinition
    description: Span definition for operations (server/client/producer/consumer)
  - name: TraceExporter
    description: Trace exporter config (Jaeger, Zipkin, OTel Collector, Datadog)
  - name: LogCorrelationConfig
    description: Inject trace_id/span_id into logs for correlation
  obligations:
  - name: LogStructured
    description: All logs must be structured JSON with correlation IDs
  - name: TracePropagation
    description: Trace context must propagate across service boundaries
  - name: OTLPExporterConfigured
    description: OTLP exporter must have valid endpoint and protocol
  - name: LogDestinationValid
    description: Each log shipping destination must have valid endpoint
  - name: SamplingRateValid
    description: Sampler rate must be in [0.0, 1.0] range
  - name: TraceContextPropagation
    description: All requests must propagate trace context via HTTP headers (W3C/B3/Jaeger)
  - name: LogTraceCorrelation
    description: Logs must contain trace_id and span_id for correlation with distributed
      traces
