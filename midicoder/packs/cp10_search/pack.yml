pack:
  id: "CP10"
  name: "Search & Indexing Generator"
  internal_id: "cp10_search"
  version: "1.0.0"
  status: "developing"
  category: "performance"
  depends_on: ["CP08"]
  definitions_count: 9
  obligations_count: 3
  error_codes:
    prefix: "MDC-CP10"
    range: "MDC-CP10-001 to MDC-CP10-005"
  capabilities_provided:
    - search_index
    - search_query
    - fulltext_search
    - vector_search
    - geo_search
    - faceted_aggregation
  capabilities:
    - id: "elasticsearch"
      emitter: "fastapi, nestjs"
    - id: "meilisearch"
      emitter: "fastapi, nestjs"
    - id: "tenant_aware"
      emitter: "fastapi, nestjs"
    - id: "fulltext"
      emitter: "fastapi, nestjs"
    - id: "vector_similarity"
      emitter: "fastapi, nestjs"
    - id: "geospatial_search"
      emitter: "fastapi, nestjs"
    - id: "faceted_aggregation"
      emitter: "fastapi, nestjs"
  definitions:
    - name: "SearchIndex"
      description: "Search index with field mappings and analyzers"
    - name: "SearchQuery"
      description: "Query binding to search backend"
    - name: "SyncStrategy"
      description: "Index synchronization with source data"
    - name: "VectorSearchIndex"
      description: "Vector similarity search index (HNSW, IVF, cosine/euclidean/dot_product)"
    - name: "VectorIndexColumn"
      description: "Column containing embedding vectors with similarity metric"
    - name: "GeoSearchIndex"
      description: "Geospatial search index (circle, bounding_box, polygon, distance)"
    - name: "FacetedSearchIndex"
      description: "Search index with faceted aggregation for explore/filter"
    - name: "Facet"
      description: "Aggregation facet (term, range, histogram, date_histogram, geo_distance)"
    - name: "GeoSearchColumn"
      description: "Geospatial data column (point, polygon, line) with CRS"
  obligations:
    - name: "IndexSync"
      description: "Search index must stay in sync with source data"
    - name: "TenantAware"
      description: "Search results must respect tenant boundaries"
    - name: "VectorDimensionMatch"
      description: "Query vector dimensions must match index vector dimensions"
  file_contributions:
    infrastructure:
      - path: "app/search/elasticsearch.py"
        file_type: "elasticsearch_client"
        template: "cp10_search/elasticsearch.py.jinja2"
        stacks: ["fastapi"]
        pack_emitter: "cp10.search.fastapi"
      - path: "app/search/index_manager.py"
        file_type: "index_manager"
        template: "cp10_search/index_manager.py.jinja2"
        stacks: ["fastapi"]
        pack_emitter: "cp10.search.fastapi"
      - path: "app/search/search_service.py"
        file_type: "search_service"
        template: "cp10_search/search_service.py.jinja2"
        stacks: ["fastapi"]
        pack_emitter: "cp10.search.fastapi"
      - path: "app/search/faceted_search.py"
        file_type: "faceted_search"
        template: "cp10_search/faceted_search.py.jinja2"
        stacks: ["fastapi"]
        pack_emitter: "cp10.search.fastapi"
      - path: "app/search/geo_search.py"
        file_type: "geo_search"
        template: "cp10_search/geo_search.py.jinja2"
        stacks: ["fastapi"]
        pack_emitter: "cp10.search.fastapi"
      - path: "app/search/vector_search.py"
        file_type: "vector_search"
        template: "cp10_search/vector_search.py.jinja2"
        stacks: ["fastapi"]
        pack_emitter: "cp10.search.fastapi"
      - path: "src/search/search.module.ts"
        file_type: "search_module"
        template: "cp10_search/search.module.ts.jinja2"
        stacks: ["nestjs"]
        pack_emitter: "cp10.search.nestjs"
      - path: "src/search/search.service.ts"
        file_type: "search_service"
        template: "cp10_search/search.service.ts.jinja2"
        stacks: ["nestjs"]
        pack_emitter: "cp10.search.nestjs"
      - path: "src/search/search.decorators.ts"
        file_type: "search_decorator"
        template: "cp10_search/search.decorators.ts.jinja2"
        stacks: ["nestjs"]
        pack_emitter: "cp10.search.nestjs"
      - path: "src/search/geo-search.service.ts"
        file_type: "geo_search"
        template: "cp10_search/geo-search.service.ts.jinja2"
        stacks: ["nestjs"]
        pack_emitter: "cp10.search.nestjs"
      - path: "src/search/vector-search.service.ts"
        file_type: "vector_search"
        template: "cp10_search/vector-search.service.ts.jinja2"
        stacks: ["nestjs"]
        pack_emitter: "cp10.search.nestjs"
      - path: "src/app/core/search/search.module.ts"
        file_type: "search_module"
        template: "cp10_search/search.module.ts.jinja2"
        stacks: ["angular"]
        pack_emitter: "cp10.search.angular"
      - path: "src/app/core/search/search.service.ts"
        file_type: "search_service"
        template: "cp10_search/search.service.ts.jinja2"
        stacks: ["angular"]
        pack_emitter: "cp10.search.angular"
      - path: "src/app/core/search/geo-search.service.ts"
        file_type: "geo_search"
        template: "cp10_search/geo-search.service.ts.jinja2"
        stacks: ["angular"]
        pack_emitter: "cp10.search.angular"
      - path: "src/app/core/search/vector-search.service.ts"
        file_type: "vector_search"
        template: "cp10_search/vector-search.service.ts.jinja2"
        stacks: ["angular"]
        pack_emitter: "cp10.search.angular"
      - path: "src/search/SearchProvider.tsx"
        file_type: "search_provider"
        template: "cp10_search/SearchProvider.tsx.jinja2"
        stacks: ["react"]
        pack_emitter: "cp10.search.react"
      - path: "src/search/useSearch.ts"
        file_type: "search_hook"
        template: "cp10_search/useSearch.ts.jinja2"
        stacks: ["react"]
        pack_emitter: "cp10.search.react"
      - path: "src/search/useGeoSearch.ts"
        file_type: "geo_search_hook"
        template: "cp10_search/useGeoSearch.ts.jinja2"
        stacks: ["react"]
        pack_emitter: "cp10.search.react"
      - path: "src/search/useVectorSearch.ts"
        file_type: "vector_search_hook"
        template: "cp10_search/useVectorSearch.ts.jinja2"
        stacks: ["react"]
        pack_emitter: "cp10.search.react"
      # Angular — Faceted Search (B28 addin)
      - path: "src/app/search/components/faceted-search.component.ts"
        file_type: "component"
        template: "cp10_search/faceted-search.component.ts.jinja2"
        stacks: ["angular"]
        pack_emitter: null
        context_keys: ["facets"]
      # React — Faceted Search (B28 addin)
      - path: "src/search/FacetedSearch.tsx"
        file_type: "component"
        template: "cp10_search/FacetedSearch.tsx.jinja2"
        stacks: ["react"]
        pack_emitter: null
        context_keys: ["facets"]
  frontend_integration:
    angular:
      - SearchService
      - SearchComponent
      - FacetedSearchComponent
    react:
      - useSearch
      - SearchProvider
      - FacetedSearch
