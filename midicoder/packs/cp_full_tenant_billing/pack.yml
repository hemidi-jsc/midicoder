pack:
  id: F36
  name: Tenant Billing & Invoicing
  internal_id: cp_full_tenant_billing
  version: 2.0.0
  status: stable
  category: financial
  depends_on:
  - B01
  - C01
  - C02
  - F08
  - F14
  - F17
  - F29
  - F07
  definitions_count: 4
  obligations_count: 2
  error_codes:
    prefix: MDC-F36
    range: MDC-CP59-001 to MDC-CP59-010
  capabilities_provided:
  - billing_plan_manage
  - billing_cycle_manage
  - usage_meter_track
  - invoice_generate
  capabilities:
  - id: billing_plan_manage
    emitter: fastapi, nestjs
  - id: billing_cycle_manage
    emitter: fastapi, nestjs
  - id: usage_meter_track
    emitter: fastapi, nestjs
  - id: invoice_generate
    emitter: fastapi, nestjs
  definitions:
  - name: BillingPlan
    description: Kế hoạch thanh toán với tier, giá cả, features, usage limits
  - name: BillingCycle
    description: Chu kỳ thanh toán (tháng, quý, năm) với auto-renew
  - name: InvoiceConfig
    description: Cấu hình hóa đơn với line items, currency, state machine
  - name: UsageMeter
    description: Thiết bị đo lường sử dụng (API calls, storage, users, bandwidth)
  obligations:
  - name: BillingAuditTrail
    description: Ghi audit log cho mọi billing action (CP14 integration)
  - name: UsageThresholdAlerting
    description: Cảnh báo khi usage đạt ngưỡng threshold (CP12 integration)
