pack:
  id: F27
  name: Versioning & History Generator
  internal_id: cp_full_versioning
  version: 2.0.0
  status: stable
  category: data
  depends_on:
  - B01
  - BE01
  - F14
  - F07
  definitions_count: 4
  obligations_count: 2
  error_codes:
    prefix: MDC-F27
    range: MDC-CP43-001 to MDC-CP43-010
  capabilities_provided:
  - entity_version
  - timetravel_query
  - soft_delete
  - history_audit
  capabilities:
  - id: entity_version
    emitter: fastapi, nestjs
  - id: timetravel_query
    emitter: fastapi, nestjs, angular, react
  - id: soft_delete
    emitter: fastapi, nestjs, angular, react
  - id: history_audit
    emitter: fastapi, nestjs
  definitions:
  - name: VersionConfig
    description: Cấu hình versioning cho entity (enable_versioning, enable_soft_delete,
      enable_history, max_versions)
  - name: HistoryRecord
    description: Snapshot của entity tại một version cụ thể (entity_type, entity_id,
      version, snapshot, operation)
  - name: OperationType
    description: 'Enum: CREATE, UPDATE, DELETE, RESTORE, HARD_DELETE'
  - name: VersioningCollection
    description: Collection chứa versioning configs cho nhiều entity
  obligations:
  - name: VersionImmutability
    description: History records phải là immutable sau khi insert
  - name: AuditIntegration
    description: Mỗi version change phải emit audit event tới CP14
  file_contributions:
    infrastructure:
    - path: app/models/mixins/version_mixin.py
      file_type: version_mixin
      template: cp_full_versioning/version_mixin.py.jinja2
      stacks:
      - fastapi
