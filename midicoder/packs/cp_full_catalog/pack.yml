pack:
  id: F34
  name: Catalog & Taxonomy Engine
  internal_id: cp_full_catalog
  version: 2.0.0
  status: stable
  category: commerce
  depends_on:
  - B01
  - BE01
  - F22
  - F07
  definitions_count: 5
  obligations_count: 2
  error_codes:
    prefix: MDC-F34
    range: MDC-CP50-001 to MDC-CP50-010
  capabilities_provided:
  - catalog_manage
  - taxonomy_hierarchy
  - faceted_search
  - attribute_manage
  - variant_manage
  capabilities:
  - id: catalog_manage
    emitter: fastapi, nestjs, angular, react
  - id: taxonomy_hierarchy
    emitter: fastapi, nestjs, angular, react
  - id: faceted_search
    emitter: fastapi, nestjs, angular, react
  - id: attribute_manage
    emitter: fastapi, nestjs, angular, react
  - id: variant_manage
    emitter: fastapi, nestjs, angular, react
  definitions:
  - name: Product
    description: Sản phẩm trong catalog
  - name: Category
    description: Phân loại sản phẩm (hierarchical)
  - name: ProductVariant
    description: Biến thể sản phẩm (SKU)
  - name: AttributeDefinition
    description: Định nghĩa thuộc tính động
  - name: AttributeValue
    description: Giá trị thuộc tính cho product/variant
  obligations:
  - name: SoftDelete
    description: Product được soft delete, không xóa vật lý
  - name: UniqueSKU
    description: SKU duy nhất trong tenant
  file_contributions:
    infrastructure:
    - path: app/models/catalog_models.py
      file_type: catalog_models
      template: cp_full_catalog/catalog_models.py.jinja2
      stacks:
      - fastapi
