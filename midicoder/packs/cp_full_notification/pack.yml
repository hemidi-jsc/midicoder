pack:
  id: F08
  name: Notification & Communication Generator
  internal_id: cp_full_notification
  version: 3.0.0
  status: stable
  category: communication
  depends_on:
  - C02
  - F07
  old_ids:
  - CP12
  - CP62
  definitions_count: 20
  obligations_count: 8
  error_codes:
    prefix: MDC-F08
    range: MDC-CP12-001 to MDC-CP12-007
  scope_note: 'CP12 treats webhook as one notification delivery channel among many
    (email, sms, push, in-app). It provides a simple "send payload to URL" service
    for notification dispatch only. For webhook subscription management, event-driven
    dispatch, retry policies with queue workers, tenant isolation, and dashboard UI
    — use CP40 (Webhook & Outbound Integration Hub). In short: CP12 = notification
    channels; CP40 = webhook event hub.

    '
  capabilities_provided:
  - send_notification
  - email_dispatch
  - sms_dispatch
  - push_notification
  - delivery_tracking
  - ab_testing
  - deep_linking
  - mobile_auth
  - ota_update
  - device_registration
  capabilities:
  - id: email
    emitter: fastapi, nestjs
  - id: sms
    emitter: fastapi, nestjs
  - id: push
    emitter: fastapi, nestjs, angular, react
  - id: template_engine
    emitter: fastapi, nestjs
  - id: webhook
    emitter: fastapi, nestjs
  - id: delivery_tracking
    emitter: fastapi, nestjs
  - id: ab_testing
    emitter: fastapi, nestjs
  - id: deep_linking
    emitter: fastapi, nestjs
  - id: mobile_auth
    emitter: fastapi, nestjs
  - id: ota_update
    emitter: fastapi, nestjs
  - id: device_registration
    emitter: fastapi, nestjs
  definitions:
  - name: NotificationChannel
    description: 'Channel type: email, sms, push, in_app, webhook'
  - name: NotificationTemplate
    description: Parameterized message template per channel
  - name: DispatchConfig
    description: Routing and retry settings for notification delivery
  - name: WebhookConfig
    description: Webhook channel with auth, retry, payload template
  - name: WebhookDelivery
    description: Webhook delivery record with attempts and response tracking
  - name: ChatIntegrationConfig
    description: Slack, Teams, Discord, MS Teams, Webex integration
  - name: ChatPlatform
    description: Chat platform enum (slack, teams, discord, msteams, webex)
  - name: WebhookAuthType
    description: Webhook auth (none, basic, bearer, hmac)
  - name: DeliveryStatus
    description: Delivery status enum (pending, sent, delivered, failed, bounced,
      opened, clicked)
  - name: DeliveryAttempt
    description: Single delivery attempt record
  - name: DeliveryTracking
    description: End-to-end delivery tracking with lifecycle events
  - name: ABTestVariant
    description: A/B test variant with weight
  - name: ABTestConfig
    description: A/B test configuration with multiple variants
  - name: TwilioSmsGateway
    description: Twilio SMS provider with signature verification
  - name: WebhookGatewayImpl
    description: HTTP webhook provider with auth and retry
  - name: PushNotificationConfig
    description: Push notification config (FCM/APNs) with topic/multicast
  - name: DeepLinkRoute
    description: Deep link route with pattern matching and Universal Link/App Link
  - name: MobileAuthProvider
    description: OAuth2 mobile auth provider (Apple/Google/Facebook)
  - name: OTAUpdateConfig
    description: OTA update config with forced update and rollout percentage
  - name: DeviceRegistration
    description: Device registration with push token and deep link handler
  obligations:
  - name: TemplateValidation
    description: Notification templates must have required variables
  - name: FallbackChannel
    description: Failed dispatch must retry on fallback channel
  - name: WebhookReliability
    description: Webhook deliveries must retry with backoff on failure
  - name: ChatSecurity
    description: Chat bot tokens must be stored securely, never in source code
  - name: DeliveryTracking
    description: All dispatches must have tracking records
  - name: ABTestIntegrity
    description: A/B test variants must sum to 100% weight
  - name: PushTokenEncryption
    description: Device token must be encrypted when stored in database
  - name: DeepLinkValidation
    description: Deep link URL must be validated and sanitized before processing
  file_contributions:
    infrastructure:
    - path: app/notifications/email_service.py
      file_type: email_service
      template: cp_full_notification/email_service.py.jinja2
      stacks:
      - fastapi
      pack_emitter: null
    - path: app/notifications/notification_service.py
      file_type: notification_service
      template: cp_full_notification/notification_service.py.jinja2
      stacks:
      - fastapi
      pack_emitter: null
    - path: app/notifications/webhook_service.py
      file_type: webhook_service
      template: cp_full_notification/webhook_service.py.jinja2
      stacks:
      - fastapi
      pack_emitter: null
    - path: app/notifications/delivery_tracker.py
