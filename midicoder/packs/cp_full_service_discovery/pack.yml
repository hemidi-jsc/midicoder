pack:
  id: F35
  name: Feature Flags & Dynamic Config
  internal_id: cp_full_service_discovery
  version: 2.0.0
  status: stable
  category: runtime
  depends_on:
  - B01
  - C02
  - F14
  - F07
  definitions_count: 4
  obligations_count: 2
  error_codes:
    prefix: MDC-F35
    range: MDC-CP37-001 to MDC-CP37-022
  capabilities_provided:
  - evaluate_feature_flag
  - assign_experiment
  - read_dynamic_config
  - feature_toggle
  - ab_test
  - dynamic_config
  - service_registration
  - service_discovery
  capabilities:
  - id: feature_toggle
    emitter: fastapi, nestjs, angular, react
  - id: ab_test
    emitter: fastapi, nestjs, angular, react
  - id: dynamic_config
    emitter: fastapi, nestjs, angular, react
  - id: remote_sync
    emitter: fastapi, nestjs, angular, react
  definitions:
  - name: FeatureFlag
    description: Feature toggle với boolean/percentage/targeted variants và tenant
      override
  - name: ABExperiment
    description: A/B experiment với variants, deterministic assignment, và traffic
      control
  - name: DynamicConfig
    description: Dynamic configuration key-value với global/tenant/environment scope
  - name: FlagStore
    description: Abstract storage interface cho flag/backend (Database + Redis)
  obligations:
  - name: FlagEvaluationDeterminism
    description: Feature flag evaluation phải deterministic cho cùng context input
  - name: ConfigChangeAudit
    description: Tất cả config changes phải được audit log qua CP14
