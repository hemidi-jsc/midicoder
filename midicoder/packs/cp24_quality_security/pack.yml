pack:
  id: "CP24"
  name: "Code Quality & Security Scanner Generator"
  internal_id: "cp24_quality_security"
  version: "1.0.0"
  status: "stable"
  category: "quality"
  depends_on: ["CP23"]
  definitions_count: 3
  obligations_count: 2
  error_codes:
    prefix: "MDC-CP24"
    range: "MDC-CP24-001 to MDC-CP24-010"
  capabilities_provided:
    - quality_scan
    - security_scan
    - quality_gate
  capabilities:
    - id: "quality_scan"
      emitter: "fastapi, nestjs, angular, react"
    - id: "security_scan"
      emitter: "fastapi, nestjs, angular, react"
    - id: "quality_gate"
      emitter: "fastapi, nestjs, angular, react"
  definitions:
    - name: "QualityProfile"
      description: "Cấu hình quality profile cho từng stack (linter, formatter, min_score)"
    - name: "SecurityScanRule"
      description: "Quy tắc security scanning (bandit, safety, eslint-security, npm-audit)"
    - name: "QualityGateConfig"
      description: "Cấu hình quality gate (block_on_fail, report_path, min_coverage)"
  obligations:
    - name: "QualityGateBlocking"
      description: "Quality gate phải block pipeline khi fail — không có warn mode"
    - name: "SecurityScanDeterminism"
      description: "Security scan phải deterministic — same code, same result"
  file_contributions:
    infrastructure:
      # FastAPI
      - path: "pyproject.toml"
        file_type: "quality_config"
        template: "cp24_quality_security/pyproject_quality.toml.jinja2"
        stacks: ["fastapi"]
        pack_emitter: "cp24.quality.fastapi"
        context_keys: ["profile", "security_config"]
      - path: "bandit.yaml"
        file_type: "security_config"
        template: "cp24_quality_security/bandit.yaml.jinja2"
        stacks: ["fastapi"]
        pack_emitter: "cp24.quality.fastapi"
        context_keys: ["security_config"]
      - path: ".safety-policy.json"
        file_type: "security_config"
        template: "cp24_quality_security/safety_policy.json.jinja2"
        stacks: ["fastapi"]
        pack_emitter: "cp24.quality.fastapi"
        context_keys: ["security_config"]
      - path: "scripts/quality_gate.py"
        file_type: "quality_gate"
        template: "cp24_quality_security/quality_gate.py.jinja2"
        stacks: ["fastapi"]
        pack_emitter: "cp24.quality.fastapi"
        context_keys: ["profile", "security_config"]
      - path: ".flake8"
        file_type: "quality_config"
        template: "cp24_quality_security/flake8.ini.jinja2"
        stacks: ["fastapi"]
        pack_emitter: "cp24.quality.fastapi"
        context_keys: ["profile"]
      - path: ".isort.cfg"
        file_type: "quality_config"
        template: "cp24_quality_security/isort.cfg.jinja2"
        stacks: ["fastapi"]
        pack_emitter: "cp24.quality.fastapi"
        context_keys: []
      # NestJS
      - path: ".eslintrc.json"
        file_type: "quality_config"
        template: "cp24_quality_security/eslintrc.json.jinja2"
        stacks: ["nestjs"]
        pack_emitter: "cp24.quality.nestjs"
        context_keys: ["profile", "security_config"]
      - path: ".prettierrc"
        file_type: "quality_config"
        template: "cp24_quality_security/prettierrc.jinja2"
        stacks: ["nestjs"]
        pack_emitter: "cp24.quality.nestjs"
        context_keys: []
      - path: "scripts/quality-gate.ts"
        file_type: "quality_gate"
        template: "cp24_quality_security/quality_gate.ts.jinja2"
        stacks: ["nestjs"]
        pack_emitter: "cp24.quality.nestjs"
        context_keys: ["profile", "security_config"]
      - path: ".npmrc"
        file_type: "security_config"
        template: "cp24_quality_security/npmrc.jinja2"
        stacks: ["nestjs"]
        pack_emitter: "cp24.quality.nestjs"
        context_keys: []
      - path: "tsconfig.strict.json"
        file_type: "quality_config"
        template: "cp24_quality_security/tsconfig_strict.json.jinja2"
        stacks: ["nestjs"]
        pack_emitter: "cp24.quality.nestjs"
        context_keys: []
      # Angular
      - path: ".eslintrc.json"
        file_type: "quality_config"
        template: "cp24_quality_security/eslintrc.json.jinja2"
        stacks: ["angular"]
        pack_emitter: "cp24.quality.angular"
        context_keys: ["profile", "security_config"]
      - path: ".prettierrc"
        file_type: "quality_config"
        template: "cp24_quality_security/prettierrc.jinja2"
        stacks: ["angular"]
        pack_emitter: "cp24.quality.angular"
        context_keys: []
      - path: "scripts/quality-gate.ts"
        file_type: "quality_gate"
        template: "cp24_quality_security/quality_gate.ts.jinja2"
        stacks: ["angular"]
        pack_emitter: "cp24.quality.angular"
        context_keys: ["profile", "security_config"]
      - path: "lockfile-lint.config.js"
        file_type: "security_config"
        template: "cp24_quality_security/lockfile_lint.config.js.jinja2"
        stacks: ["angular"]
        pack_emitter: "cp24.quality.angular"
        context_keys: ["security_config"]
      - path: ".editorconfig"
        file_type: "quality_config"
        template: "cp24_quality_security/editorconfig.jinja2"
        stacks: ["angular"]
        pack_emitter: "cp24.quality.angular"
        context_keys: []
      # React
      - path: ".eslintrc.json"
        file_type: "quality_config"
        template: "cp24_quality_security/eslintrc.json.jinja2"
        stacks: ["react"]
        pack_emitter: "cp24.quality.react"
        context_keys: ["profile", "security_config"]
      - path: ".prettierrc"
        file_type: "quality_config"
        template: "cp24_quality_security/prettierrc.jinja2"
        stacks: ["react"]
        pack_emitter: "cp24.quality.react"
        context_keys: []
      - path: "scripts/quality-gate.ts"
        file_type: "quality_gate"
        template: "cp24_quality_security/quality_gate.ts.jinja2"
        stacks: ["react"]
        pack_emitter: "cp24.quality.react"
        context_keys: ["profile", "security_config"]
      - path: "lockfile-lint.config.js"
        file_type: "security_config"
        template: "cp24_quality_security/lockfile_lint.config.js.jinja2"
        stacks: ["react"]
        pack_emitter: "cp24.quality.react"
        context_keys: ["security_config"]
      - path: ".editorconfig"
        file_type: "quality_config"
        template: "cp24_quality_security/editorconfig.jinja2"
        stacks: ["react"]
        pack_emitter: "cp24.quality.react"
        context_keys: []
  recipes:
    - auto_generate_quality_collection
    - generate_default_profiles
    - generate_strict_profiles
    - generate_security_config
