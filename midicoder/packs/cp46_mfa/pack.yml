# ===========================================================================
# CP46 — MFA & Advanced Authentication
# ===========================================================================
# File contributions declaration cho 4 stacks: FastAPI, NestJS, Angular, React
#
# Capabilities:
# - totp_auth: Time-based One-Time Password (RFC 6238)
# - sms_otp: OTP gửi qua SMS
# - webauthn_fido2: WebAuthn/FIDO2 (hardware keys, biometrics)
# - biometric_auth: Xác thực sinh trắc học
#
# Storage: Database + Redis (session cache)
# ===========================================================================

pack:
  id: "CP46"
  name: "MFA & Advanced Authentication"
  internal_id: "cp46_mfa"
  version: "1.0.0"
  status: "stable"
  category: "security"
  depends_on: ["CP03", "CP12"]
  definitions_count: 4
  obligations_count: 2
  error_codes:
    prefix: "MDC-CP46"
    range: "MDC-CP46-001 to MDC-CP46-010"
  capabilities_provided:
    - totp_auth
    - sms_otp
    - webauthn_fido2
    - biometric_auth
  capabilities:
    - id: "totp_auth"
      emitter: "fastapi, nestjs, angular, react"
    - id: "sms_otp"
      emitter: "fastapi, nestjs, angular, react"
    - id: "webauthn_fido2"
      emitter: "fastapi, nestjs, angular, react"
    - id: "biometric_auth"
      emitter: "fastapi, nestjs, angular, react"
  definitions:
    - name: "MFACredential"
      description: "Chứng chỉ MFA của user (TOTP, SMS, WebAuthn, Biometric)"
    - name: "MFAChallengeSession"
      description: "Phiên thử thách xác thực MFA"
    - name: "MFAEnrollment"
      description: "Đăng ký MFA của user"
    - name: "MFASession"
      description: "Phiên xác thực MFA thành công"
  obligations:
    - name: "MfaEnrollmentFlow"
      description: "Enrollment flow hoàn chỉnh: setup → QR/secret → verify → enable"
    - name: "MfaChallengeVerification"
      description: "Challenge/verification với timeout, max attempts, và rate limiting"
