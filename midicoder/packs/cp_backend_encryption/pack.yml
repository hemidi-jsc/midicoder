pack:
  id: BE05
  name: Data Encryption at Rest
  internal_id: cp_backend_encryption
  version: 2.0.0
  status: stable
  category: backend
  type: backend
  depends_on:
  - B01
  - BE01
  - F14
  render_context_support: true
  definitions_count: 4
  obligations_count: 2
  error_codes:
    prefix: MDC-BE05
    range: MDC-CP58-001 to MDC-CP58-006
  capabilities_provided:
  - field_encryption
  - table_encryption
  - key_rotation
  - encryption_at_rest
  - compliance_encryption
  capabilities:
  - id: field_encryption
    emitter: fastapi, nestjs
  - id: table_encryption
    emitter: fastapi, nestjs
  - id: key_rotation
    emitter: fastapi, nestjs
  - id: encryption_at_rest
    emitter: fastapi, nestjs
  - id: compliance_encryption
    emitter: fastapi, nestjs
  definitions:
  - name: EncryptionConfig
    description: Cấu hình mã hóa tổng thể (thuật toán, khóa, key management)
  - name: EncryptedField
    description: Trường dữ liệu được mã hóa ở tầng ORM/model
  - name: EncryptionKey
    description: Khóa mã hóa với vòng đời quản lý (active, rotating, retired)
  - name: EncryptionPolicy
    description: Chính sách mã hóa với compliance standards (HIPAA, SOX, PCI-DSS)
  obligations:
  - name: EncryptionAtRest
    description: Tất cả dữ liệu nhạy cảm được mã hóa trước khi lưu trữ
  - name: KeyRotationPolicy
    description: Khóa mã hóa phải được xoay định kỳ theo chính sách cấu hình
  file_contributions:
