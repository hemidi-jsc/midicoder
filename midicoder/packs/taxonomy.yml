        declarative pipelines, Docker build, container scan
      depends_on: [B01, I01, C03]
      capabilities_provided:
        - ci_pipeline
        - cd_pipeline
        - github_actions
        - gitlab_ci
        - jenkins
        - docker_build
        - container_scan
      old_ids: [CP55]

    - id: I04
      name: Environment & Secret Management
      internal_id: cp_infra_env_secrets
