# ============================================================================
# Midicoder CE - Capability Pack Taxonomy v2
# ============================================================================
# Schema: taxonomy-v2
# Consolidated from 65 CPs → 47 CPs (2026-05-28)
#
# Type system:
#   base      - foundational, depends_on: []
#   infra     - infrastructure code only (Docker, K8s, Terraform, CI/CD)
#   core      - core runtime capability, consumed by many other packs
#   backend   - FastAPI/NestJS only, no Angular/React
#   frontend  - Angular/React only, no FastAPI/NestJS
#   full      - both backend (FastAPI/NestJS) AND frontend (Angular/React)
#
# Dependencies reference new IDs (B01, I01, C01, BE01, FE01, F01)
# All packs with frontend templates declare dependency on F07 (cp_full_ui_components)
# ============================================================================

metadata:
  version: 2.0.0
  schema_version: taxonomy-v2
  consolidated_date: "2026-05-28"
  total_packs: 52
  removed_packs: 3
  merged_packs: 10

groups:
  # ========================================================================
  # BASE - Foundational packs (no dependencies)
  # ========================================================================
  base:
    - id: B01
      name: Domain Model DSL & IR Builder
      internal_id: cp_base_domain_model
      description: >
        Core domain primitives: entities, value objects, commands, queries,
        workflows, aggregates, temporal entities, saga
      depends_on: []
      capabilities_provided:
        - entity_modeling
        - command_query_separation
        - value_object
        - aggregate_root
        - domain_events
        - temporal_entity
        - polymorphic_entity
        - saga
        - recipes
      old_ids: [CP01]

  # ========================================================================
  # INFRA - Infrastructure-only packs (no FastAPI/NestJS/Angular/React templates)
  # ========================================================================
  infra:
    - id: I01
      name: Infrastructure as Code
      internal_id: cp_infra_iac
      description: >
        Local runtime (docker-compose) and AWS baseline profiles
      depends_on: []
      capabilities_provided:
        - docker_compose
        - terraform_aws
      old_ids: [CP07]

    - id: I02
      name: Kubernetes & Cloud Native Deployment
      internal_id: cp_infra_kubernetes
