        Environment variable management per environment, secret storage
        (Vault/KMS/local), KMS encryption, ConfigMap reference
      depends_on: [B01, I01, F14]
      capabilities_provided:
        - env_config
        - secret_management
        - vault_integration
        - kms_integration
        - configmap_ref
      old_ids: [CP56]

    - id: I05
      name: Multi-Region & Geo-Replication
      internal_id: cp_infra_multi_region
