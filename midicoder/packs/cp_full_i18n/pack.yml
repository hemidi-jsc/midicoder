pack:
  id: F23
  name: i18n/L10n Runtime
  internal_id: cp_full_i18n
  version: 2.0.0
  status: stable
  category: internationalization
  consolidation_group: i18n
  merged_with: cp29_multi_language
  depends_on:
  - B01
  - C01
  - F07
  definitions_count: 8
  obligations_count: 4
  error_codes:
    prefix: MDC-F23
    range: MDC-CP39-001 to MDC-CP39-015
  capabilities_provided:
  - locale_format
  - translation_manage
  - language_switch
  - language_profile
  - i18n_bundle
  - keyset_manage
  capabilities:
  - id: locale_format
    emitter: fastapi, nestjs, angular, react
  - id: translation_manage
    emitter: fastapi, nestjs
  - id: language_switch
    emitter: fastapi, nestjs, angular, react
  - id: language_profile
    emitter: fastapi, nestjs, angular, react
  - id: i18n_bundle
    emitter: fastapi, nestjs, angular, react
  - id: keyset_manage
    emitter: fastapi, nestjs, angular, react
  definitions:
  - name: LocaleConfig
    description: Cấu hình locale (BCP 47 code, date/number/currency format)
  - name: TranslationEntry
    description: Bản ghi translation với key, namespace, locale, tenant scope
  - name: TranslationStore
    description: Abstract storage interface cho translation backend (SQLite/PostgreSQL)
  - name: LocaleFormatter
    description: Engine format date/number/currency/relative time theo locale
  - name: I18nKey
    description: A dotted-namespace i18n key extracted from DSL metadata
  - name: LanguageProfile
    description: Locale configuration (locales, default, fallback chain)
  - name: I18nBundle
    description: Collection of i18n keys with translations for a specific locale
  - name: I18nKeyset
    description: Collection managing all i18n keys and bundles
  obligations:
  - name: TranslationFallbackChain
    description: 'Translation resolution phải theo chain: cache → tenant → global
      → fallback locale → raw key'
  - name: TenantTranslationIsolation
    description: Tenant translations phải được isolate và có fallback về global
  - name: fallback_chain
    description: Every language profile must have a fallback chain ending with default
      locale
  - name: key_uniqueness
    description: All i18n keys in a keyset must be unique (no duplicates)
  file_contributions:
