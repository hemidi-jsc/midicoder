# ===========================================================================
# CP55 — CI/CD Pipeline Generator
# ===========================================================================
# File contributions declaration cho Infrastructure stack
#
# Capabilities:
# - ci_pipeline: Tạo CI pipeline (build, test, lint)
# - cd_pipeline: Tạo CD pipeline (deploy, rollback)
# - github_actions: GitHub Actions workflow generation
# - gitlab_ci: GitLab CI/CD pipeline generation
# - jenkins: Jenkins declarative pipeline generation
# - docker_build: Docker image build và publish
# - container_scan: Container security scanning (Trivy)
#
# Storage: File-based (YAML pipeline definitions)
# ===========================================================================

pack:
  id: "CP55"
  name: "CI/CD Pipeline Generator"
  internal_id: "cp55_cicd"
  version: "1.0.0"
  status: "stable"
  category: "infrastructure"
  depends_on: ["CP01", "CP07", "CP15"]
  definitions_count: 6
  obligations_count: 2
  error_codes:
    prefix: "MDC-CP55"
    range: "MDC-CP55-001 to MDC-CP55-010"
  capabilities_provided:
    - ci_pipeline
    - cd_pipeline
    - github_actions
    - gitlab_ci
    - jenkins
    - docker_build
    - container_scan
  capabilities:
    - id: "ci_pipeline"
      emitter: "infrastructure"
    - id: "cd_pipeline"
      emitter: "infrastructure"
    - id: "github_actions"
      emitter: "infrastructure"
    - id: "gitlab_ci"
      emitter: "infrastructure"
    - id: "jenkins"
      emitter: "infrastructure"
    - id: "docker_build"
      emitter: "infrastructure"
    - id: "container_scan"
      emitter: "infrastructure"
  definitions:
    - name: "PipelineConfig"
      description: "Cấu hình pipeline tổng thể (platform, triggers, branches, env_vars)"
    - name: "PipelineStage"
      description: "Một stage trong pipeline (steps, needs, allow_failure)"
    - name: "PipelineStep"
      description: "Một bước cụ thể trong stage (image, commands, timeout, artifacts)"
    - name: "GitHubActionsWorkflow"
      description: "Workflow file cho GitHub Actions với jobs"
    - name: "GitLabCIPipeline"
      description: "Pipeline definition cho GitLab CI"
    - name: "Jenkinsfile"
      description: "Declarative Jenkinsfile với agent, stages, post-actions"
  obligations:
    - name: "PipelineValidation"
      description: "Mọi pipeline definition phải được validate trước khi emit"
    - name: "SecurityScanRequired"
      description: "Container scan bắt buộc trong mọi pipeline có Docker build"
  file_contributions:
    infrastructure:
      # ------------------------------------------------------------------
      # GitHub Actions Workflows
      # ------------------------------------------------------------------
      - path: ".github/workflows/build-test-deploy.yml"
        file_type: "github_actions_workflow"
        template: "cp55_cicd/github-actions/build-test-deploy.yml.jinja2"
        stacks: ["infrastructure"]
        pack_emitter: "cp55.cicd.infrastructure"
        context_keys: ["pipelines", "stages", "workflows"]
      - path: ".github/workflows/docker-publish.yml"
        file_type: "github_actions_docker"
        template: "cp55_cicd/github-actions/docker-publish.yml.jinja2"
        stacks: ["infrastructure"]
        pack_emitter: "cp55.cicd.infrastructure"
        context_keys: ["pipelines", "workflows"]
      # ------------------------------------------------------------------
      # GitLab CI
      # ------------------------------------------------------------------
      - path: ".gitlab-ci.yml"
        file_type: "gitlab_ci_pipeline"
        template: "cp55_cicd/gitlab-ci.yml.jinja2"
        stacks: ["infrastructure"]
        pack_emitter: "cp55.cicd.infrastructure"
        context_keys: ["pipelines", "stages"]
      # ------------------------------------------------------------------
      # Jenkins
      # ------------------------------------------------------------------
      - path: "Jenkinsfile"
        file_type: "jenkins_pipeline"
        template: "cp55_cicd/Jenkinsfile.jinja2"
        stacks: ["infrastructure"]
        pack_emitter: "cp55.cicd.infrastructure"
        context_keys: ["pipelines", "stages"]
      # ------------------------------------------------------------------
      # Docker Compose CI
      # ------------------------------------------------------------------
      - path: "docker-compose.ci.yml"
        file_type: "docker_compose_ci"
        template: "cp55_cicd/docker-compose.ci.yml.jinja2"
        stacks: ["infrastructure"]
        pack_emitter: "cp55.cicd.infrastructure"
        context_keys: ["pipelines", "env_vars"]
  recipes:
    - github_actions_recipe
    - gitlab_ci_recipe
    - jenkins_recipe
    - full_cicd_recipe
