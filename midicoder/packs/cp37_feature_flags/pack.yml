# ===========================================================================
# CP37 — Feature Flags & Dynamic Config
# ===========================================================================
# File contributions declaration cho 4 stacks: FastAPI, NestJS, Angular, React
#
# Capabilities:
# - feature_toggle: Boolean/Percentage/Targeted flags
# - ab_test: A/B testing engine với deterministic assignment
# - dynamic_config: Hierarchical key-value config với tenant/environment scope
# - remote_sync: Polling + WebSocket sync từ remote server
# - config_versioning: Config change history và rollback
#
# Storage: Database (SQLite/PostgreSQL) + Redis cache
# ===========================================================================

pack:
  id: "CP37"
  name: "Feature Flags & Dynamic Config"
  internal_id: "cp37_feature_flags"
  version: "1.1.0"
  status: "stable"
  category: "runtime"
  depends_on: ["CP01", "CP02", "CP14"]
  definitions_count: 4
  obligations_count: 2
  error_codes:
    prefix: "MDC-CP37"
    range: "MDC-CP37-001 to MDC-CP37-022"
  capabilities_provided:
    - evaluate_feature_flag
    - assign_experiment
    - read_dynamic_config
    - feature_toggle
    - ab_test
    - dynamic_config
  capabilities:
    - id: "feature_toggle"
      emitter: "fastapi, nestjs, angular, react"
    - id: "ab_test"
      emitter: "fastapi, nestjs, angular, react"
    - id: "dynamic_config"
      emitter: "fastapi, nestjs, angular, react"
    - id: "remote_sync"
      emitter: "fastapi, nestjs, angular, react"
  definitions:
    - name: "FeatureFlag"
      description: "Feature toggle với boolean/percentage/targeted variants và tenant override"
    - name: "ABExperiment"
      description: "A/B experiment với variants, deterministic assignment, và traffic control"
    - name: "DynamicConfig"
      description: "Dynamic configuration key-value với global/tenant/environment scope"
    - name: "FlagStore"
      description: "Abstract storage interface cho flag/backend (Database + Redis)"
  obligations:
    - name: "FlagEvaluationDeterminism"
      description: "Feature flag evaluation phải deterministic cho cùng context input"
    - name: "ConfigChangeAudit"
      description: "Tất cả config changes phải được audit log qua CP14"
