  name: State Machine Engine
  internal_id: cp_full_state_machine
  version: 2.0.0
  status: stable
  depends_on:
    - B01
    - C02
    - F04
    - F07
  type: full
  render_context_support: true
  error_codes:
    prefix: "MDC-F13"
    range: "MDC-F13-001 to MDC-F13-099"
  capabilities_provided:
