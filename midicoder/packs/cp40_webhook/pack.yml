# ===========================================================================
# CP40 — Webhook & Outbound Integration Hub
# ===========================================================================
# File contributions declaration cho 4 stacks: FastAPI, NestJS, Angular, React
#
# Capabilities:
# - webhook_manage: CRUD webhook subscriptions với tenant isolation
# - event_deliver: Dispatch event đến external webhook endpoints
# - retry_policy: Exponential backoff retry cho failed dispatches
# - outbound_api: HTTP outbound client với auth + signature
#
# Storage: SQLite + Redis queue
# ===========================================================================

pack:
  id: "CP40"
  name: "Webhook & Outbound Integration Hub"
  internal_id: "cp40_webhook"
  version: "1.0.0"
  status: "stable"
  category: "integration"
  depends_on: ["CP05", "CP12", "CP14"]
  scope_note: >
    CP40 is the webhook event hub: subscription management (CRUD with
    tenant isolation), event-driven fan-out dispatch to multiple endpoints,
    configurable retry policies with queue workers, HMAC signature
    verification, and dashboard UI for monitoring deliveries.
    CP12 (Notification) uses webhook only as one of many notification
    delivery channels (email, sms, push, in-app, webhook) for simple
    "send payload to URL" operations.
    In short: CP40 = webhook event hub; CP12 = notification channels.
  definitions_count: 4
  obligations_count: 2
  error_codes:
    prefix: "MDC-CP40"
    range: "MDC-CP40-001 to MDC-CP40-010"
  capabilities_provided:
    - webhook_manage
    - event_deliver
    - retry_policy
    - outbound_api
  capabilities:
    - id: "webhook_manage"
      emitter: "fastapi, nestjs, angular, react"
    - id: "event_deliver"
      emitter: "fastapi, nestjs"
    - id: "retry_policy"
      emitter: "fastapi, nestjs"
    - id: "outbound_api"
      emitter: "fastapi, nestjs"
  definitions:
    - name: "WebhookSubscription"
      description: "Đăng ký webhook endpoint (event_type → URL + auth + retry)"
    - name: "WebhookDispatch"
      description: "Bản ghi dispatch (subscription → payload → delivery tracking)"
    - name: "WebhookDispatcher"
      description: "Engine dispatch webhook (subscribe → render → dispatch → audit)"
    - name: "RetryPolicy"
      description: "Chính sách retry exponential backoff (max_retries, base_delay, max_delay)"
  obligations:
    - name: "DispatchReliability"
      description: "Mỗi dispatch phải được retry theo policy và ghi audit trail"
    - name: "SubscriptionIsolation"
      description: "Webhook subscriptions phải được isolate theo tenant"
  file_contributions:
    infrastructure:
      # ------------------------------------------------------------------
      # FastAPI — Backend
      # ------------------------------------------------------------------
      - path: "app/webhook/models.py"
        file_type: "webhook_models"
        template: "cp40_webhook/webhook_models.py.jinja2"
        stacks: ["fastapi"]
        pack_emitter: null
        context_keys: ["subscriptions", "event_types"]
      - path: "app/webhook/schemas.py"
        file_type: "webhook_schemas"
        template: "cp40_webhook/webhook_schemas.py.jinja2"
        stacks: ["fastapi"]
        pack_emitter: null
        context_keys: ["subscriptions"]
      - path: "app/webhook/services/webhook_service.py"
        file_type: "webhook_service"
        template: "cp40_webhook/webhook_service.py.jinja2"
        stacks: ["fastapi"]
        pack_emitter: null
        context_keys: ["subscriptions", "event_types"]
      - path: "app/webhook/routers/webhook_router.py"
        file_type: "webhook_router"
        template: "cp40_webhook/webhook_router.py.jinja2"
        stacks: ["fastapi"]
        pack_emitter: null
        context_keys: []
      - path: "app/webhook/services/webhook_dispatch.py"
        file_type: "webhook_dispatch"
        template: "cp40_webhook/webhook_dispatch.py.jinja2"
        stacks: ["fastapi"]
        pack_emitter: null
        context_keys: ["subscriptions"]
      - path: "app/webhook/workers/webhook_worker.py"
        file_type: "webhook_worker"
        template: "cp40_webhook/webhook_worker.py.jinja2"
        stacks: ["fastapi"]
        pack_emitter: null
        context_keys: ["redis_url"]
      - path: "app/webhook/middleware.py"
        file_type: "webhook_middleware"
        template: "cp40_webhook/webhook_middleware.py.jinja2"
        stacks: ["fastapi"]
        pack_emitter: null
        context_keys: []
      - path: "app/webhook/webhook_verification.py"
        file_type: "webhook_verification"
        template: "cp40_webhook/webhook_verification.py.jinja2"
        stacks: ["fastapi"]
        pack_emitter: null
        context_keys: []
      # ------------------------------------------------------------------
      # NestJS — Backend
      # ------------------------------------------------------------------
      - path: "src/webhook/webhook.module.ts"
