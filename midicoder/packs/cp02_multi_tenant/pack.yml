pack:
  id: "CP02"
  name: "Multi-Tenant Architecture Generator"
  internal_id: "cp02_multi_tenant"
  version: "1.0.0"
  status: "stable"
  category: "architecture"
  depends_on: ["CP01"]
  definitions_count: 11
  obligations_count: 4
  error_codes:
    prefix: "MDC-CP02"
    range: "MDC-CP02-001 to MDC-CP02-005"
  capabilities_provided:
    - enforce_tenant_scope
    - tenant_isolation
    - schema_isolation
    - tenant_provisioning
    - cross_tenant_access
  capabilities:
    - id: "tenant_middleware"
      emitter: "fastapi, nestjs"
    - id: "tenant_context"
      emitter: "fastapi, nestjs"
    - id: "schema_isolation"
      emitter: "fastapi, nestjs"
    - id: "tenant_provisioning"
      emitter: "fastapi, nestjs"
    - id: "cross_tenant_access"
      emitter: "fastapi, nestjs"
  definitions:
    - name: "TenantConfig"
      description: "Tenant isolation strategy and provisioning settings"
    - name: "TenantContext"
      description: "Runtime scope enforcement for multi-tenancy"
    - name: "TenantResolver"
      description: "Resolve tenant ID from header, JWT, or subdomain"
    - name: "TenantIsolationStrategy"
      description: "Isolation enum: ROW, SCHEMA, DATABASE, HYBRID"
    - name: "TenantFilter"
      description: "Row/schema filter for tenant-aware queries"
    - name: "SchemaIsolationConfig"
      description: "Schema/database-level isolation with RLS, auto-create, migration"
    - name: "SchemaIsolationMode"
      description: "Schema isolation mode (dedicated_schema, dedicated_database, shared_schema)"
    - name: "TenantProvisioningConfig"
      description: "Auto/manual provisioning with plans, features, resource limits"
    - name: "CrossTenantAccessRule"
      description: "Cross-tenant data sharing with approval and expiry"
    - name: "ProvisioningStrategy"
      description: "Provisioning mode (automatic, manual_review, api_driven, terraform)"
    - name: "TenantStatus"
      description: "Tenant lifecycle (provisioning, active, suspended, deleted)"
  obligations:
    - name: "TenantIsolation"
      description: "All data access must enforce tenant boundary"
    - name: "SchemaProvisioning"
      description: "New tenant schema must be provisioned before first access"
    - name: "CrossTenantApproval"
      description: "Cross-tenant access must be approved and time-limited"
    - name: "ResourceLimits"
      description: "Tenant resource consumption must not exceed plan limits"
  file_contributions:
    infrastructure:
      - path: "app/multitenant/__init__.py"
        file_type: "init"
        template: "cp02_multi_tenant/__init__.py.jinja2"
        stacks: ["fastapi"]
        pack_emitter: null
      - path: "app/multitenant/tenant_context.py"
        file_type: "tenant_context"
        template: "cp02_multi_tenant/tenant_context.py.jinja2"
        stacks: ["fastapi"]
        pack_emitter: null
      - path: "app/multitenant/tenant_filters.py"
        file_type: "tenant_filter"
        template: "cp02_multi_tenant/tenant_filters.py.jinja2"
        stacks: ["fastapi"]
        pack_emitter: null
      - path: "app/multitenant/tenant_middleware.py"
        file_type: "tenant_middleware"
        template: "cp02_multi_tenant/tenant_middleware.py.jinja2"
        stacks: ["fastapi"]
        pack_emitter: null
      - path: "app/multitenant/tenant_models.py"
        file_type: "tenant_model"
        template: "cp02_multi_tenant/tenant_models.py.jinja2"
        stacks: ["fastapi"]
        pack_emitter: null
      - path: "src/multitenant/index.ts"
        file_type: "init"
        template: "cp02_multi_tenant/index.ts.jinja2"
        stacks: ["nestjs"]
        pack_emitter: null
      - path: "src/multitenant/tenant-context.service.ts"
        file_type: "tenant_context"
        template: "cp02_multi_tenant/tenant-context.service.ts.jinja2"
        stacks: ["nestjs"]
        pack_emitter: null
      - path: "src/multitenant/tenant-filter.decorator.ts"
        file_type: "tenant_filter"
        template: "cp02_multi_tenant/tenant-filter.decorator.ts.jinja2"
        stacks: ["nestjs"]
        pack_emitter: null
      - path: "src/multitenant/tenant.guard.ts"
        file_type: "tenant_guard"
        template: "cp02_multi_tenant/tenant.guard.ts.jinja2"
        stacks: ["nestjs"]
        pack_emitter: null
      - path: "src/multitenant/tenant.module.ts"
        file_type: "tenant_module"
        template: "cp02_multi_tenant/tenant.module.ts.jinja2"
        stacks: ["nestjs"]
        pack_emitter: null
  frontend_integration:
    angular:
      - TenantService
      - TenantGuard
      - TenantInterceptor
    react:
      - useTenant
      - TenantProvider
      - TenantContext
