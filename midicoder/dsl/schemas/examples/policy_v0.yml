policies:
  - id: trial_feature_access
    description: Restrict features for trial plan
    scope: Entity:subscription
    conditions:
      - field: plan
        op: eq
        value: trial
    effects:
      - type: limit
        params: {feature_group: "advanced", allowed: false}
  - id: high_value_invoice_approval
    description: Require approval for high value invoices
    scope: Entity:invoice
    conditions:
      - field: amount
        op: gt
        value: 10000
    effects:
      - type: allow
        params: {requires_approval: true}
  - id: data_retention_eu
    description: Data retention policy for EU tenants
    scope: Entity:organization
    conditions:
      - field: region
        op: eq
        value: eu
    effects:
      - type: limit
        params: {retention_days: 365}
  - id: free_plan_quota
    description: Limit quota for free plan
    scope: Command:call_api
    conditions:
      - field: plan
        op: eq
        value: free
    effects:
      - type: limit
        params: {max_requests_per_day: 1000}
  - id: feature_flag_admin_only
    description: Only admins can toggle flags
    scope: Command:toggle_feature_flag
    conditions:
      - field: role
        op: eq
        value: admin
    effects:
      - type: allow
        params: {}

