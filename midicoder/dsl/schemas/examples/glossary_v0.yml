glossary:
  terms:
    - id: tenant
      term: Tenant
      definition: Logical customer boundary in a multi-tenant system.
      description: Each tenant has isolated data, users, and configuration.
      category: technical
      synonyms: ["workspace", "organization"]
      related_terms: ["subscription", "user", "rbac"]
      examples: ["Acme Corp is one tenant in the platform."]
      source: Architecture handbook
      tags: ["saas", "multi-tenant"]

    - id: subscription
      term: Subscription
      definition: Recurring billing agreement that controls plan and limits.
      category: business
      synonyms: ["plan", "billing plan"]
      related_terms: ["invoice", "tenant"]
      examples: ["Pro plan billed monthly."]
      tags: ["billing"]

    - id: webhook
      term: Webhook
      definition: HTTP callback endpoint used for event delivery.
      category: integration
      related_terms: ["event", "retry", "signature"]
      examples: ["Payment provider sends invoice.paid to /webhooks/payments."]
      tags: ["integration", "api"]

    - id: idempotency
      term: Idempotency
      definition: Repeated identical requests produce one effective outcome.
      category: technical
      related_terms: ["retry", "safety"]
      examples: ["Retrying create_invoice with same key does not duplicate invoice."]
      tags: ["api-design", "reliability"]

    - id: feature_flag
      term: Feature Flag
      definition: Runtime switch to enable or disable behavior without deployment.
      category: technical
      synonyms: ["feature toggle"]
      related_terms: ["rollout", "configuration"]
      examples: ["Enable new checkout flow for 10 percent of tenants."]
      tags: ["release", "configuration"]
