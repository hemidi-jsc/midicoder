datasources:
  - id: main_db
    engine: postgres
    connector: sqlalchemy
    host: localhost
    port: 5432
    database: app_db
    schema: public
    default: true
  - id: cache_db
    engine: redis
    connector: redis-py
    host: localhost
    port: 6379

tables:
  - id: users
    description: User table
    datasource: main_db
    columns:
      - name: id
        type: uuid
        required: true
        constraints:
          primary_key: true
      - name: email
        type: string
        required: true
        constraints:
          unique: true
      - name: created_at
        type: datetime
        required: true
    indexes:
      - name: idx_users_email
        columns:
          - email
        unique: true

  - id: sessions
    description: Session cache table-like model
    datasource: cache_db
    columns:
      - name: key
        type: string
        required: true
      - name: value
        type: json
        required: true
      - name: expires_at
        type: datetime
        required: false
