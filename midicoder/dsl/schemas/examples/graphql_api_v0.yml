api:
  types:
    - name: User
      kind: object
      description: Public user profile in GraphQL API.
      fields:
        - name: id
          type: string
        - name: email
          type: string

    - name: Subscription
      kind: object
      fields:
        - name: id
          type: string
        - name: status
          type: Enum:subscription_status

  queries:
    - name: users
      resolver: list_users
      returns:
        - name: items
          type: list<Entity:user>

    - name: subscriptions
      resolver: list_subscriptions
      args:
        - name: organization_id
          type: Entity:organization
      returns:
        - name: items
          type: list<Entity:subscription>

  mutations:
    - name: createUser
      resolver: create_user
      args:
        - name: email
          type: string
        - name: password
          type: string
      returns:
        - name: user
          type: Entity:user

    - name: cancelSubscription
      resolver: cancel_subscription
      args:
        - name: subscription_id
          type: Entity:subscription
      returns:
        - name: subscription
          type: Entity:subscription
