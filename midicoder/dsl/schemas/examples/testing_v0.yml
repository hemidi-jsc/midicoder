tests:
  - id: checkin_unit_validation
    kind: unit
    framework: pytest
    description: Unit test for check-in validation logic
    tags:
      - unit
      - attendance
    steps:
      - type: command
        ref: CheckInCommand
        input:
          employee_code: EMP001
        expect:
          status: success
          attendance_record_created: true

  - id: checkin_e2e_browser
    kind: e2e
    framework: selenium
    description: End-to-end browser test for check-in flow
    steps:
      - type: command
        ref: CheckInCommand
        input:
          employee_code: EMP001
        expect:
          status: success
