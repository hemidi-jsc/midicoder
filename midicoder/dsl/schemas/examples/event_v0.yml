events:
  - id: user_registered
    description: User finished signup
    kind: domain
    payload:
      - name: user_id
        type: string
      - name: email
        type: string
  - id: subscription_activated
    description: Subscription became active
    kind: domain
    payload:
      - name: subscription_id
        type: string
      - name: organization_id
        type: string
  - id: invoice_paid
    description: Invoice was paid
    kind: domain
    payload:
      - name: invoice_id
        type: string
      - name: amount
        type: ValueObject:money
  - id: feature_flag_toggled
    description: Feature flag state changed
    kind: audit
    payload:
      - name: key
        type: string
      - name: state
        type: Enum:feature_flag_state
  - id: payment_failed
    description: Payment attempt failed
    kind: integration
    payload:
      - name: subscription_id
        type: string
      - name: provider_error_code
        type: string

