profiles:
  - name: local
    overrides:
      api.base_url: http://localhost:8000
      feature_flags.debug_mode: true
  - name: dev
    overrides:
      api.base_url: https://dev-api.example.com
      logging.level: INFO
  - name: staging
    overrides:
      api.base_url: https://staging-api.example.com
      logging.level: WARN
  - name: prod
    overrides:
      api.base_url: https://api.example.com
      logging.level: ERROR
