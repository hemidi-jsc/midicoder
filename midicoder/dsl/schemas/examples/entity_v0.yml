entities:
  - id: user
    description: Tenant user profile
    primary_key: id
    tenant_scope: tenant
    tags: ["user", "account"]
    fields:
      - name: id
        type: string
        required: true
        description: Unique user identifier
      - name: email
        type: string
        required: true
        description: Login email
      - name: full_name
        type: string
        required: false
      - name: status
        type: Enum:user_status
        required: true
        default: active
      - name: tenant_id
        type: string
        required: true
  - id: organization
    description: Tenant organization or workspace
    primary_key: id
    tenant_scope: tenant
    tags: ["organization", "workspace"]
    fields:
      - name: id
        type: string
        required: true
      - name: name
        type: string
        required: true
      - name: plan
        type: Enum:subscription_plan
        required: true
        default: free
      - name: owner_user_id
        type: Entity:user
        required: true
      - name: created_at
        type: datetime
        required: true
  - id: subscription
    description: Subscription contract per tenant
    primary_key: id
    tenant_scope: tenant
    tags: ["subscription", "billing"]
    fields:
      - name: id
        type: string
        required: true
      - name: organization_id
        type: Entity:organization
        required: true
      - name: plan
        type: Enum:subscription_plan
        required: true
      - name: status
        type: Enum:subscription_status
        required: true
      - name: current_period
        type: ValueObject:billing_period
        required: true
  - id: invoice
    description: Billing invoice
    tenant_scope: tenant
    tags: ["billing", "invoice"]
    fields:
      - name: id
        type: string
        required: true
      - name: organization_id
        type: Entity:organization
        required: true
      - name: amount
        type: ValueObject:money
        required: true
      - name: status
        type: Enum:invoice_status
        required: true
      - name: issued_at
        type: datetime
        required: true
  - id: feature_flag
    description: Feature flag configuration
    tenant_scope: tenant
    tags: ["feature", "flag"]
    fields:
      - name: key
        type: string
        required: true
      - name: description
        type: string
        required: false
      - name: state
        type: Enum:feature_flag_state
        required: true
      - name: rollout_percentage
        type: int
        required: false

