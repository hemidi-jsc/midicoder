reliability_policies:
  - id: checkin_command_policy
    target_kind: command
    target_ref: CheckInCommand
    timeout:
      total_ms: 3000
    retry:
      max_attempts: 2
      backoff_ms: 100
      jitter: true
    idempotency_key_field: request_id

  - id: billing_api_policy
    target_kind: integration
    target_ref: billing_api
    timeout:
      connect_ms: 1000
      read_ms: 3000
      total_ms: 5000
    retry:
      max_attempts: 3
      backoff_ms: 200
    circuit_breaker:
      failure_threshold: 5
      recovery_timeout_seconds: 30
