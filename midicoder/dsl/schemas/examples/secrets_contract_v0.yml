secrets:
  - id: db.password
    provider: env
    key: DB_PASSWORD
    description: Database password
    required: true
  - id: ext.billing.token
    provider: vault
    key: secret/data/midicoder/billing-token
    required: true
  - id: webhook.payment.secret
    provider: aws_secrets_manager
    key: prod/midicoder/webhook/payment
    required: true
