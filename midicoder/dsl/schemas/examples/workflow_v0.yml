workflows:
  - id: subscription_lifecycle
    description: Subscription lifecycle workflow
    entity: subscription
    initial_state: trial
    states:
      - id: trial
        kind: initial
      - id: active
        kind: normal
      - id: past_due
        kind: normal
      - id: cancelled
        kind: final
    transitions:
      - from_state: trial
        to_state: active
        on_event: subscription_activated
      - from_state: active
        to_state: past_due
        on_event: payment_failed
      - from_state: active
        to_state: cancelled
        on_command: cancel_subscription
      - from_state: past_due
        to_state: active
        on_event: subscription_activated
  - id: invoice_lifecycle
    description: Invoice lifecycle
    entity: invoice
    initial_state: draft
    states:
      - id: draft
        kind: initial
      - id: issued
        kind: normal
      - id: paid
        kind: final
      - id: void
        kind: final
    transitions:
      - from_state: draft
        to_state: issued
        on_command: issue_invoice
      - from_state: issued
        to_state: paid
        on_event: invoice_paid
      - from_state: issued
        to_state: void
        on_command: void_invoice
  - id: user_onboarding
    description: User onboarding workflow
    entity: user
    initial_state: pending
    states:
      - id: pending
        kind: initial
      - id: active
        kind: normal
      - id: disabled
        kind: final
    transitions:
      - from_state: pending
        to_state: active
        on_event: user_registered
      - from_state: active
        to_state: disabled
        on_command: disable_user
  - id: feature_flag_rollout
    description: Feature flag rollout workflow
    entity: feature_flag
    initial_state: disabled
    states:
      - id: disabled
        kind: initial
      - id: rollout
        kind: normal
      - id: enabled
        kind: final
    transitions:
      - from_state: disabled
        to_state: rollout
        on_command: start_rollout
      - from_state: rollout
        to_state: enabled
        on_command: complete_rollout
  - id: support_ticket_lifecycle
    description: Support ticket lifecycle
    entity: ticket
    initial_state: open
    states:
      - id: open
        kind: initial
      - id: in_progress
        kind: normal
      - id: resolved
        kind: final
    transitions:
      - from_state: open
        to_state: in_progress
        on_command: start_investigation
      - from_state: in_progress
        to_state: resolved
        on_command: resolve_ticket

