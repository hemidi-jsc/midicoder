security:
  auth_required: true
  authz_required: true
  webhook_signature_required: true
  cors:
    allowed_origins:
      - https://app.example.com
    allowed_methods:
      - GET
      - POST
      - PUT
      - DELETE
    allowed_headers:
      - Authorization
      - Content-Type
    allow_credentials: true
  rate_limits:
    - id: public-api
      requests: 100
      per_seconds: 60
      scope: ip
  pii_masking:
    - field: user.email
      strategy: redact
    - field: user.phone
      strategy: partial
