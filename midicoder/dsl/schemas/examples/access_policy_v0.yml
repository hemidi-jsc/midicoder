access:
  roles:
    - id: owner
      description: Tenant owner
    - id: admin
      description: Tenant administrator
    - id: member
      description: Regular tenant member
    - id: billing_admin
      description: Billing manager
    - id: support_agent
      description: Support operator
  permissions:
    - id: org_manage
      description: Manage organization profile and settings
      resource: entity:organization
      action: admin
    - id: billing_manage
      description: Manage subscriptions and invoices
      resource: entity:subscription
      action: admin
    - id: user_manage
      description: Manage users in tenant
      resource: entity:user
      action: write
    - id: ticket_handle
      description: Process support tickets
      resource: command:resolve_ticket
      action: write
    - id: feature_flag_manage
      description: Manage feature rollout flags
      resource: entity:feature_flag
      action: admin
  bindings:
    - role: owner
      permissions: ["org_manage", "billing_manage", "user_manage", "feature_flag_manage"]
    - role: admin
      permissions: ["org_manage", "user_manage", "feature_flag_manage"]
    - role: member
      permissions: []
    - role: billing_admin
      permissions: ["billing_manage"]
    - role: support_agent
      permissions: ["ticket_handle"]
