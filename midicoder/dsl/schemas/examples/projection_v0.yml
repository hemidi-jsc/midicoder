projections:
  - id: user_subscription_projection
    description: User subscription summary
    source_events: ["subscription_activated", "subscription_not_active"]
    storage: read_model
    fields:
      - name: user_id
        type: string
      - name: organization_id
        type: string
      - name: plan
        type: Enum:subscription_plan
      - name: status
        type: Enum:subscription_status
  - id: invoice_summary_projection
    description: Invoice summary for lists
    source_events: ["invoice_paid"]
    storage: read_model
    fields:
      - name: invoice_id
        type: string
      - name: organization_id
        type: string
      - name: amount
        type: ValueObject:money
      - name: status
        type: Enum:invoice_status
  - id: usage_aggregation_projection
    description: Aggregated usage metrics
    source_events: ["usage_recorded"]
    storage: analytics
    fields:
      - name: metric
        type: string
      - name: value
        type: float
  - id: audit_log_projection
    description: Audit log entries
    source_events: ["user_registered", "subscription_activated", "invoice_paid"]
    storage: audit_log
    fields:
      - name: event_id
        type: string
      - name: event_type
        type: string
      - name: occurred_at
        type: datetime
  - id: feature_flag_exposure_projection
    description: Feature flag exposure stats
    source_events: ["feature_flag_toggled"]
    storage: analytics
    fields:
      - name: key
        type: string
      - name: state
        type: Enum:feature_flag_state
      - name: user_count
        type: int
