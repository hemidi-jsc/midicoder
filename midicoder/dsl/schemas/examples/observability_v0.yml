observability:
  - kind: command
    ref: CheckInCommand
    log_fields:
      - request_id
      - employee_code
      - status
    metrics:
      - command.checkin.success.count
      - command.checkin.latency.ms
    trace_enabled: true
    alert_rules:
      - checkin-error-rate-high

  - kind: integration
    ref: billing_api
    log_fields:
      - request_id
      - operation
      - http_status
    metrics:
      - integration.billing.request.count
      - integration.billing.error.count
    trace_enabled: true
