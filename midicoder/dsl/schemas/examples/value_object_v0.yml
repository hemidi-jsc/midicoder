value_objects:
  - id: money
    description: Monetary amount with currency
    category: money
    fields:
      - name: amount
        type: decimal
        required: true
      - name: currency
        type: string
        required: true
  - id: billing_period
    description: Subscription billing period
    category: period
    fields:
      - name: start
        type: datetime
        required: true
      - name: end
        type: datetime
        required: true
  - id: postal_address
    description: Postal address value object
    category: address
    fields:
      - name: line1
        type: string
      - name: city
        type: string
      - name: country
        type: string
  - id: contact_info
    description: Contact information
    category: contact
    fields:
      - name: email
        type: string
      - name: phone
        type: string
        required: false
  - id: geo_location
    description: Geographic location
    category: geo
    fields:
      - name: lat
        type: float
      - name: lng
        type: float

