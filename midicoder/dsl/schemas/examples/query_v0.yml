queries:
  - id: list_users
    description: List tenant users
    category: list
    reads: ["user"]
    pagination: {page_size: 50}
    returns:
      - name: users
        type: list<Entity:user>
  - id: get_user_detail
    description: Get single user detail
    category: detail
    reads: ["user"]
    input:
      - name: user_id
        type: string
    returns:
      - name: user
        type: Entity:user
  - id: list_subscriptions
    description: List subscriptions by organization
    category: list
    reads: ["subscription"]
    input:
      - name: organization_id
        type: string
    returns:
      - name: subscriptions
        type: list<Entity:subscription>
  - id: list_invoices
    description: List invoices for tenant
    category: report
    reads: ["invoice"]
    pagination: {page_size: 50}
    returns:
      - name: invoices
        type: list<Entity:invoice>
  - id: usage_report
    description: Usage report per metric
    category: metrics
    reads: ["usage_record"]
    input:
      - name: from
        type: datetime
      - name: to
        type: datetime
    returns:
      - name: metrics
        type: json

