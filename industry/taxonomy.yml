# Midicoder CE v1.0.0 - Taxonomy Definition
#
# This file defines the canonical taxonomy for Core Packs (CP), Domain Packs (DP),
# and Regulatory Overlays (RX) used across the entire Midicoder CE pipeline.
#
# Version: 1.0.0
# Created: 2026-04-17
# Status: APPROVED
#
# Usage:
#   - All blueprints MUST reference packs/overlays from this taxonomy
#   - IDs are immutable after v1.0.0 release
#   - New additions require architectural review
#
---

metadata:
  version: "1.0.0"
  created_date: "2026-04-17"
  updated_date: "2026-04-17"
  schema_version: "taxonomy-v1"
  status: "approved"

# ============================================================================
# CORE PACKS (CP)
# ============================================================================
# Core Packs are the compiler substrate - universal capabilities required for
# all web applications regardless of domain. These are first-party curated,
# not plugin-based, to maintain determinism and avoid lock-in.
#
# Phase definitions:
#   - P0: Critical path, required for all blueprints
#   - P1: High priority, required for most production apps
#   - P2: Standard features, commonly needed
#   - P3: Advanced features, specialized use cases
#   - P4: Experimental/future, opt-in only
# ============================================================================

core_packs:
  # --------------------------------------------------------------------------
  # P0 - Critical Path (Required for All Blueprints)
  # --------------------------------------------------------------------------

  - id: "CP01"
    name: "Domain Model DSL & IR Builder"
    internal_id: "cp1-domain-model"
    phase: "P0"
    description: "Core domain primitives: entities, value objects, commands, queries, workflows"
    definitions_count: 6
    obligations_count: 2
    dependencies: []
    category: "domain-modeling"
    status: "stable"

  - id: "CP02"
    name: "Multi-Tenant Architecture Generator"
    internal_id: "cp2-multi-tenant"
    phase: "P0"
    description: "Tenant isolation strategies and provisioning workflows"
    definitions_count: 2
    obligations_count: 1
    dependencies: ["CP01"]
    category: "architecture"
    status: "stable"

  - id: "CP03"
    name: "Authentication & Authorization Framework"
    internal_id: "cp3-auth"
    phase: "P0"
    description: "JWT/OAuth2 baseline, session management, rate limiting"
    definitions_count: 2
    obligations_count: 2
    dependencies: ["CP01", "CP02"]
    category: "security"
    status: "stable"

  - id: "CP04"
    name: "RBAC & Policy Engine"
    internal_id: "cp4-rbac"
    phase: "P0"
    description: "Role-based access control, permissions, policy rules"
    definitions_count: 4
    obligations_count: 1
    dependencies: ["CP02", "CP03"]
    category: "security"
    status: "stable"

  - id: "CP07"
    name: "Infrastructure as Code Generator"
    internal_id: "cp7-iac"
    phase: "P0"
    description: "Local runtime (docker-compose) and AWS baseline profiles"
    definitions_count: 2
    obligations_count: 1
    dependencies: []
    category: "infrastructure"
    status: "stable"

  # --------------------------------------------------------------------------
  # P1 - High Priority (Most Production Apps)
  # --------------------------------------------------------------------------

  - id: "CP05"
    name: "Event-Driven Architecture Generator"
    internal_id: "cp5-event-driven"
    phase: "P1"
    description: "Event topics, publishing, subscriptions, outbox pattern"
    definitions_count: 4
    obligations_count: 1
    dependencies: ["CP01"]
    category: "architecture"
    status: "stable"

  - id: "CP06"
    name: "API Gateway & Service Mesh Generator"
    internal_id: "cp6-api-gateway"
    phase: "P1"
    description: "Gateway profiles, routing, upstream binding"
    definitions_count: 2
    obligations_count: 0
    dependencies: ["CP01", "CP05"]
    category: "integration"
    status: "stable"

  - id: "CP08"
    name: "Database & Data Access Layer Generator"
    internal_id: "cp8-database"
    phase: "P1"
    description: "Datasource declarations, table mappings, column definitions"
    definitions_count: 2
    obligations_count: 1
    dependencies: ["CP01"]
    category: "persistence"
    status: "stable"

  - id: "CP09"
    name: "Caching & Performance Layer Generator"
    internal_id: "cp9-cache"
    phase: "P1"
    description: "Cache profiles, bindings, invalidation strategies"
    definitions_count: 3
    obligations_count: 2
