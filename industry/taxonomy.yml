# ============================================================================
# DOMAIN PACKS (DP)
# ============================================================================
# Domain Packs provide industry-specific semantic primitives. Each pack
# encapsulates the business logic, entities, and workflows specific to a
# domain area. These compose with Core Packs to form complete blueprints.
# ============================================================================

domain_packs:
  # --------------------------------------------------------------------------
  # Commerce & Transactions
  # --------------------------------------------------------------------------

  - id: "DP01"
    name: "Commerce Core"
    description: "Core e-commerce capabilities: products, carts, orders, payments"
    category: "commerce"
    industries_using:
      - "ecommerce-d2c"
      - "marketplace-b2c"
      - "marketplace-b2b"
      - "omnichannel-retail"
      - "food-delivery"
    depends_on_core_packs:
      - "CP01"  # Domain Model
      - "CP08"  # Database
      - "CP10"  # Search
      - "CP12"  # Notification
      - "CP45"  # Payment
    status: "stable"

  - id: "DP02"
