validation_rules:
  - rule: blueprint_must_include_p0_packs
    description: All blueprints must include all P0 packs (CP01-CP04, CP07)
    severity: error
  - rule: dependency_order_preserved
    description: Pack dependencies must follow phase ordering (P0 -> P1 -> P2 -> P3 -> P4)
    severity: error
  - rule: no_dependency_cycles
    description: Dependency graph must be acyclic (DAG).
    severity: error
  - rule: stable_cannot_depend_on_planned
    description: A stable pack cannot depend on a planned pack.
    severity: error
  - rule: all_referenced_packs_exist
    description: All pack IDs must exist in taxonomy.
    severity: error
