# Midicoder CE v1.0.0 - Taxonomy Definition
#
# This file defines the canonical taxonomy for Core Packs (CP), Domain Packs (DP),
# and Regulatory Overlays (RX) used across the entire Midicoder CE pipeline.
#
# Version: 1.0.0
# Created: 2026-04-17
# Status: APPROVED
#
# Usage:
#   - All blueprints MUST reference packs/overlays from this taxonomy
#   - IDs are immutable after v1.0.0 release
#   - New additions require architectural review
#
---

metadata:
  version: "1.0.0"
  created_date: "2026-04-17"
  updated_date: "2026-04-17"
  schema_version: "taxonomy-v1"
  status: "approved"

# ============================================================================
# CORE PACKS (CP)
# ============================================================================
# Core Packs are the compiler substrate - universal capabilities required for
# all web applications regardless of domain. These are first-party curated,
# not plugin-based, to maintain determinism and avoid lock-in.
#
# Phase definitions:
#   - P0: Critical path, required for all blueprints
#   - P1: High priority, required for most production apps
#   - P2: Standard features, commonly needed
#   - P3: Advanced features, specialized use cases
#   - P4: Experimental/future, opt-in only
# ============================================================================

core_packs:
  # --------------------------------------------------------------------------
  # P0 - Critical Path (Required for All Blueprints)
  # --------------------------------------------------------------------------

