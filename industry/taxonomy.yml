# ============================================================================
# REGULATORY OVERLAYS (RX)
# ============================================================================
# Regulatory Overlays enforce compliance requirements at compile-time.
# Each overlay represents a specific regulatory framework or compliance
# domain with enforceable obligations and guard rails.
# ============================================================================

regulatory_overlays:
  # --------------------------------------------------------------------------
  # Privacy & Data Protection
  # --------------------------------------------------------------------------

  - id: "RX01"
    name: "Privacy & PII Protection"
    description: "GDPR, CCPA, PII handling, data subject rights"
    category: "privacy"
    obligations:
      - "pii_encryption_required"
      - "data_retention_policy_required"
      - "consent_management_required"
      - "right_to_erasure_support"
    industries_requiring:
      - "all"  # Universal requirement (~95/100 industries)
    depends_on_core_packs:
      - "CP03"  # Auth (encryption)
      - "CP04"  # RBAC (data access)
      - "CP14"  # Audit (access logging)
      - "CP47"  # Data Retention (erasure)
      - "CP49"  # Consent Management
    status: "stable"

