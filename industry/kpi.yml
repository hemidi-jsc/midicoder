# Midicoder CE — KPI Definitions (aligned with CP/DP/RX specs)
#
# Version: 2.0.0
# Updated: 2026-05-06
# Aligned with: CORE_PACK_SPECIFICATION, DOMAIN_PACK_SPECIFICATION, REGULATORY_OVERLAY_SPECIFICATION
---
metadata:
  version: "2.0.0"
  created_date: "2026-04-17"
  updated_date: "2026-05-06"
  measurement_module: "industry.kpi_checks"

# ============================================================================
# KPI CATEGORIES (aligned with 3 pack types + registry + sync)
# ============================================================================

kpi_categories:
  - id: "CP_DEPTH"
    name: "Core Pack Depth"
    description: "Definitions and obligations per CP"
    priority: "P0"

  - id: "DP_DEPTH"
    name: "Domain Pack Depth"
    description: "Entities, commands, queries, workflows, invariants per DP"
    priority: "P0"

  - id: "RX_COVERAGE"
    name: "Regulatory Overlay Coverage"
    description: "Obligation, gate, guard coverage per RX"
    priority: "P0"

  - id: "BLUEPRINT_COMPILE"
    name: "Blueprint Compilation"
    description: "Blueprint compile success rates"
    priority: "P0"

  - id: "DETERMINISM"
    name: "Determinism Guarantees"
    description: "Hash stability across compilation artifacts"
    priority: "P0"

  - id: "INVARIANT_COVERAGE"
    name: "Invariant Gate Coverage"
    description: "Platform invariant enforcement"
    priority: "P1"

  - id: "ERROR_NORMALIZATION"
    name: "Error Code Normalization"
    description: "Standard error code coverage"
    priority: "P1"

  - id: "SYNC_BF"
    name: "Backend-Frontend Sync"
    description: "Sync quality between backend and frontend stacks"
    priority: "P0"

  - id: "REGISTRY"
    name: "Registry Consistency"
    description: "Registry data quality and integrity"
    priority: "P0"

  - id: "INDUSTRY_COVERAGE"
    name: "Industry Coverage"
    description: "100 industry DP/RX coverage"
    priority: "P1"

# ============================================================================
# KPI DEFINITIONS
# ============================================================================

kpis:
  # --------------------------------------------------------------------------
  # CP_DEPTH (KPI-001 ~ KPI-005)
  # --------------------------------------------------------------------------

  - id: "KPI-001"
    name: "P0 CP Definition Count"
    category: "CP_DEPTH"
    description: "Each P0 CP must have >= 4 definitions"
    target_min: 4
    target_max: null
    check_function: "check_cp_definitions_phase"
    phase_filter: "P0"

  - id: "KPI-002"
    name: "P1 CP Definition Count"
    category: "CP_DEPTH"
    description: "Each P1 CP must have >= 3 definitions"
    target_min: 3
    target_max: null
    check_function: "check_cp_definitions_phase"
    phase_filter: "P1"

  - id: "KPI-003"
    name: "P2+ CP Definition Count"
    category: "CP_DEPTH"
    description: "Each P2+ CP must have >= 2 definitions"
    target_min: 2
    target_max: null
    check_function: "check_cp_definitions_phase"
    phase_filter: "P2,P3,P4"

  - id: "KPI-004"
    name: "Total CP Definitions"
    category: "CP_DEPTH"
    description: "Total CP definitions >= 100"
    target_min: 100
    target_max: null
    check_function: "check_total_cp_definitions"

  - id: "KPI-005"
    name: "CP Obligations Coverage"
    category: "CP_DEPTH"
    description: "Each CP must have >= 1 obligation"
    target_min: 1
    target_max: null
    check_function: "check_cp_obligations"

  # --------------------------------------------------------------------------
  # DP_DEPTH (KPI-006 ~ KPI-010)
  # --------------------------------------------------------------------------

  - id: "KPI-006"
    name: "DP Entity Count"
    category: "DP_DEPTH"
    description: "Each stable DP must have >= 3 entities"
    target_min: 3
    target_max: null
    check_function: "check_dp_entities"
    status_filter: "stable"

  - id: "KPI-007"
    name: "DP Command/Query Count"
    category: "DP_DEPTH"
    description: "Each stable DP must have >= 2 commands + >= 2 queries"
    target_min: 2
    target_max: null
    check_function: "check_dp_commands_queries"
    status_filter: "stable"

  - id: "KPI-008"
    name: "DP Workflow Coverage"
    category: "DP_DEPTH"
    description: "Each stable DP must have >= 1 workflow"
    target_min: 1
    target_max: null
    check_function: "check_dp_workflows"
    status_filter: "stable"

  - id: "KPI-009"
    name: "DP Invariant Coverage"
    category: "DP_DEPTH"
    description: "Each stable DP must have >= 2 invariants"
    target_min: 2
    target_max: null
    check_function: "check_dp_invariants"
    status_filter: "stable"

  - id: "KPI-010"
    name: "DP Depends-On Valid"
    category: "DP_DEPTH"
    description: "All DP depends_on references must point to existing CPs"
    target_min: 100
    target_max: 100
    check_function: "check_dp_depends_on_valid"
    result_type: "percent"

  # --------------------------------------------------------------------------
  # RX_COVERAGE (KPI-011 ~ KPI-014)
  # --------------------------------------------------------------------------

  - id: "KPI-011"
    name: "RX Obligation Count"
    category: "RX_COVERAGE"
    description: "Each stable RX must have >= 2 obligations"
    target_min: 2
    target_max: null
    check_function: "check_rx_obligations"
    status_filter: "stable"

  - id: "KPI-012"
    name: "RX Gate Coverage"
    category: "RX_COVERAGE"
    description: "Each obligation with enforce_level=both must have compile gate"
    target_min: 100
    target_max: 100
    check_function: "check_rx_gates"
    result_type: "percent"

  - id: "KPI-013"
    name: "RX Guard Coverage"
    category: "RX_COVERAGE"
    description: "Each obligation with enforce_level=both must have runtime guard"
    target_min: 100
    target_max: 100
    check_function: "check_rx_guards"
    result_type: "percent"

  - id: "KPI-014"
    name: "RX Industry Coverage"
    category: "RX_COVERAGE"
    description: "Each RX must list >= 1 industry requiring it"
    target_min: 1
    target_max: null
    check_function: "check_rx_industries"

  # --------------------------------------------------------------------------
  # BLUEPRINT_COMPILE (KPI-015 ~ KPI-017)
  # --------------------------------------------------------------------------

  - id: "KPI-015"
    name: "Blueprint Compile Success"
    category: "BLUEPRINT_COMPILE"
    description: "All registered blueprints compile successfully"
    target_min: 100
    target_max: 100
    check_function: "check_blueprint_compile"
    result_type: "percent"

  - id: "KPI-016"
    name: "P0 Blueprint Compile"
    category: "BLUEPRINT_COMPILE"
    description: "All P0 blueprints compile"
    target_min: 100
    target_max: 100
    check_function: "check_blueprint_compile_p0"
    result_type: "percent"

  - id: "KPI-017"
    name: "Blueprint No Broken Deps"
    category: "BLUEPRINT_COMPILE"
    description: "No blueprint references non-existent packs"
    target_min: 0
    target_max: 0
    check_function: "check_blueprint_broken_deps"

  # --------------------------------------------------------------------------
  # DETERMINISM (KPI-018 ~ KPI-021)
  # --------------------------------------------------------------------------

  - id: "KPI-018"
    name: "Registry Hash Stability"
    category: "DETERMINISM"
    description: "Registry load produces same hash across runs"
    target_min: 100
    target_max: 100
    check_function: "check_registry_hash_stability"
    result_type: "percent"

  - id: "KPI-019"
    name: "DAG Resolution Deterministic"
    category: "DETERMINISM"
    description: "DAG resolution produces same order across runs"
    target_min: 100
    target_max: 100
    check_function: "check_dag_deterministic"
    result_type: "percent"

  - id: "KPI-020"
    name: "Pack Query Deterministic"
    category: "DETERMINISM"
    description: "Registry queries return same results across runs"
    target_min: 100
    target_max: 100
    check_function: "check_query_deterministic"
    result_type: "percent"

  - id: "KPI-021"
    name: "Blueprint Validation Deterministic"
    category: "DETERMINISM"
    description: "Blueprint validation returns same result across runs"
    target_min: 100
    target_max: 100
    check_function: "check_validation_deterministic"
    result_type: "percent"

  # --------------------------------------------------------------------------
  # INVARIANT_COVERAGE (KPI-022 ~ KPI-026)
  # --------------------------------------------------------------------------

  - id: "KPI-022"
    name: "Unresolved Ref Detection"
    category: "INVARIANT_COVERAGE"
    description: "All unresolved pack references caught"
    target_min: 100
    target_max: 100
    check_function: "check_unresolved_refs"
    result_type: "percent"

  - id: "KPI-023"
    name: "Cycle Detection"
    category: "INVARIANT_COVERAGE"
    description: "All dependency cycles caught"
    target_min: 100
    target_max: 100
    check_function: "check_dependency_cycles"
    result_type: "percent"

  - id: "KPI-024"
    name: "Status Transition Valid"
    category: "INVARIANT_COVERAGE"
    description: "No invalid status transitions in packs"
    target_min: 100
    target_max: 100
    check_function: "check_status_transitions"
    result_type: "percent"

  - id: "KPI-025"
    name: "Phase Dependency Order"
    category: "INVARIANT_COVERAGE"
    description: "P0 doesn't depend on P1+, P1 doesn't depend on P2+..."
    target_min: 100
    target_max: 100
    check_function: "check_phase_order"
    result_type: "percent"

  - id: "KPI-026"
    name: "Stable No Planned Deps"
    category: "INVARIANT_COVERAGE"
    description: "Stable packs don't depend on planned packs"
    target_min: 100
    target_max: 100
    check_function: "check_stable_deps"
    result_type: "percent"

  # --------------------------------------------------------------------------
  # ERROR_NORMALIZATION (KPI-027 ~ KPI-028)
  # --------------------------------------------------------------------------

  - id: "KPI-027"
    name: "Error Code Coverage"
    category: "ERROR_NORMALIZATION"
    description: "All packs have defined error code prefixes"
    target_min: 100
    target_max: 100
    check_function: "check_error_codes"
    result_type: "percent"

  - id: "KPI-028"
    name: "Error Code Uniqueness"
    category: "ERROR_NORMALIZATION"
    description: "No duplicate error code prefixes across packs"
    target_min: 0
    target_max: 0
    check_function: "check_error_code_duplicates"

  # --------------------------------------------------------------------------
  # SYNC_BF (KPI-029 ~ KPI-031)
  # --------------------------------------------------------------------------

  - id: "KPI-029"
    name: "CP Backend-Frontend Sync"
    category: "SYNC_BF"
    description: "CPs with frontend_integration have both Angular + React entries"
    target_min: 100
    target_max: 100
    check_function: "check_cp_sync"
    result_type: "percent"

  - id: "KPI-030"
    name: "DP Backend-Frontend Sync"
    category: "SYNC_BF"
    description: "DPs with backend emitters have frontend UI emitters"
    target_min: 100
    target_max: 100
    check_function: "check_dp_sync"
    result_type: "percent"

  - id: "KPI-031"
    name: "RX Frontend Compliance"
    category: "SYNC_BF"
    description: "RXs with enforce_level=both have frontend guards defined"
    target_min: 100
    target_max: 100
    check_function: "check_rx_frontend_sync"
    result_type: "percent"

  # --------------------------------------------------------------------------
  # REGISTRY (KPI-032 ~ KPI-035)
  # --------------------------------------------------------------------------

  - id: "KPI-032"
    name: "Registry Load Success"
    category: "REGISTRY"
    description: "Registry loads taxonomy.yml without errors"
    target_min: 1
    target_max: 1
    check_function: "check_registry_load"

  - id: "KPI-033"
    name: "Pack Count Consistency"
    category: "REGISTRY"
    description: "Registry pack counts match taxonomy sections"
    target_min: 100
    target_max: 100
    check_function: "check_pack_counts"
    result_type: "percent"

  - id: "KPI-034"
    name: "Unique Pack IDs"
    category: "REGISTRY"
    description: "All pack IDs are unique across CP/DP/RX"
    target_min: 0
    target_max: 0
    check_function: "check_unique_ids"

  - id: "KPI-035"
    name: "Version Field Present"
    category: "REGISTRY"
    description: "All packs have version field"
    target_min: 100
    target_max: 100
    check_function: "check_versions"
    result_type: "percent"

  # --------------------------------------------------------------------------
  # INDUSTRY_COVERAGE (KPI-036 ~ KPI-038)
  # --------------------------------------------------------------------------

  - id: "KPI-036"
    name: "DP Industry Usage"
    category: "INDUSTRY_COVERAGE"
    description: "Each DP is used by at least 1 industry"
    target_min: 100
    target_max: 100
    check_function: "check_dp_usage"
    result_type: "percent"

  - id: "KPI-037"
    name: "RX Industry Requiring"
    category: "INDUSTRY_COVERAGE"
    description: "Each RX is required by at least 1 industry"
    target_min: 100
    target_max: 100
    check_function: "check_rx_usage"
    result_type: "percent"

  - id: "KPI-038"
    name: "No Orphan Packs"
    category: "INDUSTRY_COVERAGE"
    description: "No packs with empty industries_using/industries_requiring"
    target_min: 0
    target_max: 0
    check_function: "check_orphan_packs"

# ============================================================================
# SUCCESS CRITERIA v1.0.0
# ============================================================================

success_criteria_v1_0_0:
  required_pass:
    - "KPI-001"  # P0 CP definitions >= 4
    - "KPI-004"  # Total CP definitions >= 100
    - "KPI-005"  # CP obligations >= 1
    - "KPI-010"  # DP depends_on valid
    - "KPI-011"  # RX obligations >= 2
    - "KPI-017"  # No broken blueprint deps
    - "KPI-018"  # Registry hash stable
    - "KPI-019"  # DAG deterministic
    - "KPI-022"  # Unresolved refs caught
    - "KPI-023"  # Cycles caught
    - "KPI-025"  # Phase order valid
    - "KPI-026"  # Stable deps valid
    - "KPI-027"  # Error codes defined
    - "KPI-028"  # Error codes unique
    - "KPI-032"  # Registry loads
    - "KPI-033"  # Pack counts consistent
    - "KPI-034"  # Unique IDs
    - "KPI-035"  # Versions present
    - "KPI-038"  # No orphan packs
  summary:
    total_required_kpis: 19
    description: "All 19 KPIs must pass for v1.0.0 release"
