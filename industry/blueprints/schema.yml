# Schema cho Blueprint YAML files
# Theo requirement.md section "Blueprint System"
# 
# Blueprint định nghĩa composition của:
# - Core Packs (CP01-CP30)
# - Domain Packs (DP01-DP26)
# - Regulatory Overlays (RX01-RX12)
# - Invariants (business, compliance, failure_modes)
#
# Tác giả: Midicoder Team
# Version: 1.0.0

$schema: "http://json-schema.org/draft-07/schema#"
$id: "https://midicoder.dev/schemas/industry-blueprint-v1.json"
title: "Industry Blueprint Schema"
description: "Schema cho Industry Blueprint YAML files"
type: "object"

required:
  - $schema
  - metadata
  - industry
  - core_packs
  - regulatory_overlays

properties:
  # ============================================================================
  # Schema Declaration
  # ============================================================================
  
  $schema:
    type: "string"
    enum:
      - "industry-blueprint-v1"
    description: "Version của schema này"
  
  # ============================================================================
  # Metadata
  # ============================================================================
  
  metadata:
    type: "object"
    description: "Metadata của Blueprint"
    required:
      - version
      - industry_id
      - name
      - group
    properties:
      version:
        type: "string"
        pattern: "^(0|[1-9]\\d*)\\.(0|[1-9]\\d*)\\.(0|[1-9]\\d*)(?:-((?:0|[1-9]\\d*|\\d*[a-zA-Z-][0-9a-zA-Z-]*)(?:\\.(?:0|[1-9]\\d*|\\d*[a-zA-Z-][0-9a-zA-Z-]*))*))?(?:\\+([0-9a-zA-Z-]+(?:\\.[0-9a-zA-Z-]+)*))?$"
        description: "Version theo semver"
        example: "1.0.0"
      
      industry_id:
        type: "string"
        pattern: "^[a-z][a-z0-9-]*$"
        description: "Industry identifier (lowercase, hyphenated)"
        example: "ecommerce-d2c"
      
      name:
        type: "string"
        minLength: 1
        maxLength: 100
        description: "Tên hiển thị của industry"
        example: "E-commerce D2C"
      
      group:
        type: "string"
        enum:
          - "Commerce/Logistics/Ops"
          - "CRM/ERP/HR/Education"
          - "Healthcare/Banking/Exchange"
          - "SaaS/Platform"
          - "Media/Content"
          - "Other"
        description: "Industry group"
      
      priority:
        type: "integer"
        minimum: 1
        maximum: 100
        description: "Priority rank trong 100 industries"
      
      complexity:
        type: "string"
        enum:
          - "low"
          - "medium"
          - "high"
          - "very_high"
          - "extreme"
        description: "Implementation complexity level"
      
      regulatory_risk:
        type: "string"
        enum:
          - "low"
          - "medium"
          - "high"
          - "very_high"
        description: "Regulatory compliance risk level"
      
      commercial_priority:
        type: "string"
        enum:
          - "critical"
          - "high"
          - "medium"
          - "low"
        description: "Commercial value priority"
      
      status:
        type: "string"
        enum:
          - "draft"
          - "review"
          - "approved"
          - "deprecated"
        default: "draft"
        description: "Lifecycle status"
      
      tags:
        type: "array"
        items:
          type: "string"
        default: []
        description: "Tags để phân loại"
  
  # ============================================================================
  # Industry Information (alternative to metadata.industry_id)
  # ============================================================================
  
  industry:
    type: "object"
    description: "Thông tin chi tiết về Industry"
    required:
      - id
      - name
      - group
    properties:
      id:
        type: "string"
        pattern: "^[a-z][a-z0-9-]*$"
        description: "Industry identifier"
      
      name:
        type: "string"
        minLength: 1
        maxLength: 100
        description: "Tên hiển thị"
      
      group:
        type: "string"
        enum:
          - "Commerce/Logistics/Ops"
          - "CRM/ERP/HR/Education"
          - "Healthcare/Banking/Exchange"
          - "SaaS/Platform"
          - "Media/Content"
          - "Other"
        description: "Industry group"
      
      priority:
        type: "integer"
        minimum: 1
        maximum: 100
        description: "Priority rank"
      
      complexity:
        type: "string"
        enum:
          - "low"
          - "medium"
          - "high"
          - "very_high"
          - "extreme"
        description: "Complexity level"
      
      regulatory_risk:
        type: "string"
        enum:
          - "low"
          - "medium"
          - "high"
          - "very_high"
        description: "Regulatory risk level"
      
      commercial_priority:
        type: "string"
        enum:
          - "critical"
          - "high"
          - "medium"
          - "low"
        description: "Commercial priority"
  
  # ============================================================================
  # Core Packs Configuration
  # ============================================================================
  
  core_packs:
    type: "object"
    description: "Cấu hình Core Packs (CP01-CP30)"
    properties:
      mandatory:
        type: "array"
        description: "P0 core packs bắt buộc (CP01, CP02, CP03, CP04, CP07)"
        items:
          type: "string"
          pattern: "^CP(0[1-9]|[12]\\d|30)$"
          description: "Core Pack ID (CP01-CP30)"
        uniqueItems: true
      
      included:
        type: "array"
        description: "Additional core packs từ P1-P3"
        items:
          type: "string"
          pattern: "^CP(0[1-9]|[12]\\d|30)$"
          description: "Core Pack ID"
        uniqueItems: true
      
      excluded:
        type: "array"
        description: "Core packs bị loại trừ (P2-P4 only)"
        items:
          type: "string"
          pattern: "^CP(0[1-9]|[12]\\d|30)$"
          description: "Core Pack ID"
        uniqueItems: true
      
      experimental:
        type: "array"
        description: "Experimental core packs (P4 only)"
        items:
          type: "string"
          pattern: "^CP(2[7-9]|30)$"
          description: "Experimental Core Pack ID (P4 only)"
        uniqueItems: true
  
  # ============================================================================
  # Domain Packs Configuration
  # ============================================================================
  
  domain_packs:
    type: "array"
    description: "Domain Packs references (DP01-DP26)"
    items:
      type: "object"
      oneOf:
        # Simple form: just ID
        - properties:
            id:
              type: "string"
              pattern: "^DP(0[1-9]|1[0-9]|2[0-6])$"
              description: "Domain Pack ID (DP01-DP26)"
          required:
            - id
          additionalProperties: false
        
        # Full form: ID with config
        - properties:
            id:
              type: "string"
              pattern: "^DP(0[1-9]|1[0-9]|2[0-6])$"
              description: "Domain Pack ID"
            
            required:
              type: "boolean"
              default: true
              description: "Có bắt buộc không"
            
            config:
              type: "object"
              description: "Configuration cho domain pack"
              additionalProperties: true
      
  
  # ============================================================================
  # Regulatory Overlays Configuration
  # ============================================================================
  
  regulatory_overlays:
    type: "array"
    description: "Regulatory Overlays references (RX01-RX12)"
    items:
      type: "object"
      oneOf:
        # Simple form: just ID
        - properties:
            id:
              type: "string"
              pattern: "^RX(0[1-9]|1[0-2])$"
              description: "Regulatory Overlay ID (RX01-RX12)"
          required:
            - id
          additionalProperties: false
        
        # Full form: ID with config
        - properties:
            id:
              type: "string"
              pattern: "^RX(0[1-9]|1[0-2])$"
              description: "Regulatory Overlay ID"
            
            strict_mode:
              type: "boolean"
              default: true
              description: "Có enforce strict compliance không"
            
            config:
              type: "object"
              description: "Configuration cho overlay"
              additionalProperties: true
  
  # ============================================================================
  # Target Profiles
  # ============================================================================
  
  target_profiles:
    type: "array"
    description: "Supported deployment targets"
    items:
      type: "string"
      enum:
        - "local"
        - "aws"
        - "gcp"
        - "azure"
        - "on-premise"
    uniqueItems: true
    default:
      - "local"
      - "aws"
  
  # ============================================================================
  # Invariants Configuration
  # ============================================================================
  
  invariants:
    type: "object"
    description: "Configuration cho tất cả Invariants"
    properties:
      business:
        type: "array"
        description: "Business invariants"
        items:
          oneOf:
            # Simple form: just ID
            - type: "string"
              description: "Business invariant ID"
            
            # Full form
            - type: "object"
              required:
                - id
                - name
                - description
                - enforcement
              properties:
                id:
                  type: "string"
                  description: "Invariant identifier (INVxxx)"
                
                name:
                  type: "string"
                  description: "Tên invariant"
                
                description:
                  type: "string"
                  description: "Mô tả invariant"
                
                enforcement:
                  type: "string"
                  enum:
                    - "compile-time"
                    - "runtime"
                    - "both"
                  description: "Enforcement mode"
                
                violation_code:
                  type: "string"
                  description: "Error code khi vi phạm"
                
                severity:
                  type: "string"
                  enum:
                    - "error"
                    - "warning"
                  default: "error"
                  description: "Severity level"
      
      compliance:
        type: "array"
        description: "Compliance invariants"
        items:
          oneOf:
            # Simple form: just ID
            - type: "string"
              description: "Compliance invariant ID"
            
            # Full form
            - type: "object"
              required:
                - id
                - overlay
                - description
              properties:
                id:
                  type: "string"
                  description: "Invariant identifier"
                
                overlay:
                  type: "string"
                  pattern: "^RX(0[1-9]|1[0-2])$"
                  description: "Regulatory overlay reference"
                
                description:
                  type: "string"
                  description: "Mô tả invariant"
                
                controls:
                  type: "array"
                  items:
                    type: "string"
                  description: "Danh sách controls cần enforce"
                  default: []
      
      failure_modes:
        type: "array"
        description: "Failure mode invariants"
        items:
          oneOf:
            # Simple form: just ID
            - type: "string"
              description: "Failure mode invariant ID"
            
            # Full form
            - type: "object"
              required:
                - id
                - scenario
                - handling
              properties:
                id:
                  type: "string"
                  description: "Invariant identifier"
                
                scenario:
                  type: "string"
                  description: "Failure scenario description"
                
                handling:
                  type: "string"
                  description: "Handling strategy"
                
                recovery:
                  type: "string"
                  description: "Recovery procedure"
  
  # ============================================================================
  # Configuration Overrides
  # ============================================================================
  
  config:
    type: "object"
    description: "Configuration overrides cho Blueprint"
    properties:
      default_tenant_mode:
        type: "string"
        enum:
          - "database"
          - "schema"
          - "row"
          - "hybrid"
        default: "schema"
        description: "Default tenant mode"
      
      default_auth_strategy:
        type: "string"
        enum:
          - "jwt"
          - "oauth2"
          - "saml"
          - "hybrid"
        default: "jwt"
        description: "Default auth strategy"
      
      default_db_engine:
        type: "string"
        enum:
          - "postgres"
          - "mysql"
          - "sqlserver"
          - "oracle"
        default: "postgres"
        description: "Default database engine"
      
      observability:
        type: "object"
        description: "Observability configuration"
        additionalProperties: true
      
      security:
        type: "object"
        description: "Security configuration"
        additionalProperties: true
  
  # ============================================================================
  # References
  # ============================================================================
  
  references:
    type: "object"
    description: "References cho Blueprint"
    properties:
      brief_path:
        type: "string"
        format: "uri-reference"
        description: "Path đến brief.md"
      
      documentation_url:
        type: "string"
        format: "uri"
        description: "URL documentation"
      
      related_blueprints:
        type: "array"
        items:
          type: "string"
          pattern: "^[a-z][a-z0-9-]*$"
        description: "Danh sách related blueprints"
        default: []

additionalProperties: false